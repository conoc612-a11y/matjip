name: (진단) 법원 사이트 해외 IP 접속 가능성 확인

# 일회용 진단 워크플로 (2026-08-22).
#
# 목적: courtauction.go.kr 이 GitHub Actions(해외 IP)에서 왜 안 되는지 **원인을 못 박는다.**
# 지금까지 확인된 건 증상뿐이다 — `page.goto: Timeout 30000ms exceeded` ×3 (매 실행 일관).
# ECONNRESET 도 403 도 아니라, V-World 사례(§19-2: 5/5 ECONNRESET → 해외 IP 차단 확정)처럼
# 단정할 수 없었다. 무응답(타임아웃)은 방화벽 DROP 과도, 다른 원인과도 일치하기 때문이다.
#
# 실험 설계 — 대조군을 함께 찍어 '이 사이트만의 문제'인지 '한국 사이트 전반'인지 가른다:
#   ① courtauction.go.kr  (대상)
#   ② urban.seoul.go.kr   (대조군A: Actions 에서 **매일 성공** 중인 한국 정부 사이트)
#   ③ api.vworld.kr       (대조군B: ECONNRESET 으로 차단 **확정**된 한국 정부 사이트)
# 단계별로 DNS → TCP → TLS → HTTP 를 따로 재서 어디서 끊기는지 본다.
#
# 판정 기준:
#   TCP 에서 타임아웃      → 방화벽이 조용히 버림(DROP) = 해외 IP 차단 확정
#   ECONNRESET/연결거부    → V-World 와 같은 REJECT 방식 차단
#   HTTP 403/차단 페이지   → WAF 의 의도적 차단(봇 차단 가능성)
#   정상 200               → IP 문제가 아니라 Playwright/러너 환경 문제
#
# 결과를 TROUBLESHOOTING 에 기록한 뒤 **이 파일은 삭제한다.**

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 러너 위치·IP 확인
        run: |
          set +e
          echo "== 러너 공인 IP / 위치 =="
          curl -s --max-time 15 https://ipinfo.io/json || echo "(ipinfo 실패)"
          echo

      - name: 단계별 접속 진단
        run: |
          set +e
          probe() {
            host="$1"; label="$2"
            echo "════════════════════════════════════════════"
            echo "[$label] $host"
            echo "── ① DNS"
            getent hosts "$host" || echo "  DNS 실패"
            echo "── ② TCP 443 (10초)"
            # bash /dev/tcp 로 순수 TCP 연결만 시험한다(TLS·HTTP 영향 배제)
            timeout 10 bash -c "cat < /dev/null > /dev/tcp/$host/443" 2>&1 \
              && echo "  TCP 연결 성공" \
              || echo "  TCP 연결 실패/타임아웃 (exit $?)"
            echo "── ③ TLS 핸드셰이크 (10초)"
            timeout 10 openssl s_client -connect "$host:443" -servername "$host" </dev/null 2>&1 \
              | grep -E "CONNECTED|Verify return code|no peer certificate|errno" | head -3
            echo "  (openssl exit $?)"
            echo "── ④ HTTP GET (20초)"
            curl -sS -o /dev/null --max-time 20 \
              -w "  http=%{http_code}  dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s\n" \
              "https://$host/"
            echo "  curl exit=$?  (6=DNS실패 7=연결실패 28=타임아웃 35=TLS오류 56=연결끊김)"
            echo
          }
          probe www.courtauction.go.kr "대상: 법원경매"
          probe urban.seoul.go.kr      "대조군A: 서울도시공간포털(Actions 에서 성공 중)"
          probe api.vworld.kr          "대조군B: V-World(ECONNRESET 확정)"

      - name: 법원 사이트 상세 (verbose)
        run: |
          set +e
          echo "== courtauction.go.kr verbose =="
          curl -v --max-time 25 -o /dev/null https://www.courtauction.go.kr/ 2>&1 | tail -25
          echo
          echo "== 실제 수집 대상 URL (SPA 진입점) =="
          curl -sS -o /dev/null --max-time 25 \
            -w "http=%{http_code} total=%{time_total}s\n" \
            "https://www.courtauction.go.kr/pgj/index.on?w2xPath=/pgj/ui/pgj100/PGJ151F00.xml"
          echo "curl exit=$?"
