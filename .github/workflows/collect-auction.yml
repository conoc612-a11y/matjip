name: 법원경매 목록 자동 갱신

# courtauction.go.kr 은 API를 직접 호출하면 거부하는 SPA라, tools/collect_auction.js가
# playwright로 화면을 직접 클릭·조작해 auction.json을 만든다(TROUBLESHOOTING §6-11 참고).
# 이전엔 이 스크립트를 사람이 터미널에서 수동으로 돌려야만 갱신됐다 — 그래서 매일 새벽
# 자동으로 돌려 auction.json이 항상 최신을 유지하게 한다. 사진(auction_photos.json)은
# 전량 재수집에 8~10시간이 걸려 여기 포함하지 않는다(수동으로만 진행).

on:
  schedule:
    # 매일 07:00 KST(=22:00 UTC 전날). 법원 업무시간과 무관하게 하루 한 번이면 충분하고,
    # IP 차단 위험을 낮추려면 잦은 빈도로 돌리지 않는 게 안전하다(TROUBLESHOOTING §6-11).
    - cron: '0 22 * * *'
  workflow_dispatch: {} # 필요하면 Actions 탭에서 수동 실행도 가능

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    # 지오코딩은 아래 주석처럼 캐시가 커밋돼 있어 새 물건 주소만 조회한다(보통 몇 분).
    # 그래도 수집(playwright 화면 조작)이 법원 13곳 × 페이지 순회라 30분 넘게 걸린다.
    # 만에 하나 캐시가 비면 전체 재지오코딩(~5.5시간)이 필요하니 넉넉히 잡는다 —
    # GitHub Actions 무료 티어는 잡당 최대 6시간이라 360이 상한.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 지오코딩 캐시(tools/.geocache.json)는 커밋 파일로 관리한다.
      # actions/cache 는 취소/실패한 실행에서는 캐시를 저장하지 않아, 지오코딩 도중
      # 타임아웃이 나면 다음 실행이 빈 캐시로 시작해 처음부터 다시 지오코딩했다
      # (실측: 첫 자동 실행이 60분 제한에 걸려 3,300건 중 200건만 채우고 취소).
      # 캐시가 git 에 들어 있으면 취소와 무관하게 항상 유지되고, 새 주소만 조회하면 된다.
      # 변경분은 아래 커밋 단계에서 auction.json 과 함께 반영한다.

      - run: npm ci

      # playwright(devDependencies, playwright-core와 버전 고정)로 브라우저 리비전을
      # 맞춰서 설치한다 — 버전이 안 맞으면 playwright-core가 실행 시점에 브라우저를
      # 못 찾는다.
      - run: npx playwright install --with-deps chromium

      - run: node tools/collect_auction.js

      # 스크립트 안에도 같은 가드가 있지만(saveAuction), 여기서 한 번 더 막는다 —
      # 커밋·푸시 직전이 마지막 방어선이고, 스크립트가 바뀌어 가드가 빠져도 여기서 걸린다.
      # git 에 기록된 직전 버전과 비교해 절반 미만으로 줄었으면 커밋을 거부한다.
      - name: auction.json 행 수 sanity check
        run: |
          new=$(node -e "process.stdout.write(String((require('./auction.json').rows||[]).length))")
          old=$(git show HEAD:auction.json 2>/dev/null | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
              try{process.stdout.write(String((JSON.parse(s).rows||[]).length))}catch(e){process.stdout.write('0')}
            });" || echo 0)
          echo "직전 ${old}건 → 이번 ${new}건"
          if [ "$new" -lt 1 ]; then echo "::error::수집 0건 — 커밋 거부"; exit 1; fi
          if [ "$old" -gt 0 ] && [ "$new" -lt $((old / 2)) ]; then
            echo "::error::직전(${old}건) 대비 절반 미만(${new}건) — 커밋 거부"; exit 1
          fi

      - name: auction.json·지오코딩 캐시 변경 시 커밋·푸시
        run: |
          if git diff --quiet -- auction.json tools/.geocache.json; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add auction.json tools/.geocache.json
          git commit -m "chore(auction): 법원경매 목록 자동 갱신 ($(date -u +%Y-%m-%d))"
          git push
