<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>맛집 탐방 — 부동산 지도</title>
  <link rel="preconnect" href="https://unpkg.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://api.vworld.kr" crossorigin />
  <link rel="preconnect" href="https://openapi.map.naver.com" crossorigin />
  <link rel="preconnect" href="https://dapi.kakao.com" crossorigin />
  <link rel="preconnect" href="https://bhgijvaxxjnocgfnaaeu.supabase.co" crossorigin />
  <link rel="dns-prefetch" href="https://tile.openstreetmap.org" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <style>
    :root {
      --c-primary:#1971c2; --c-primary-soft:#e7f0fb; --c-price:#d9480f;
      --c-success:#2f9e44; --c-danger:#e03131; --c-text:#1f2937; --c-muted:#6b7280;
      --c-border:#e5e7eb; --c-bg:#f3f5f8; --c-card:#ffffff; --c-hover:#f5f7fa;
      --c-shadow:0 1px 3px rgba(16,24,40,.06); --c-shadow-lg:0 10px 30px rgba(16,24,40,.14);
      --bg:var(--c-bg); --card:var(--c-card); --line:var(--c-border);
      --text:var(--c-text); --muted:var(--c-muted); --accent:var(--c-primary); --ok:var(--c-success);
    }
    :root.dark {
      --bg:#101216; --card:#1b1e25; --line:#2a2e37; --text:#e8ecf2; --muted:#8b93a3;
      --c-primary-soft:#1b2a40; --c-hover:#242a34; --c-border:#2a2e37; --c-bg:#101216;
      --c-text:#e8ecf2; --c-muted:#8b93a3;
      --c-shadow:0 1px 3px rgba(0,0,0,.4); --c-shadow-lg:0 10px 30px rgba(0,0,0,.5);
    }
    * { box-sizing:border-box; }
    html, body { height:100%; }
    body { margin:0; background:var(--bg); color:var(--text);
      font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif;
      font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
      display:flex; flex-direction:column; }
    /* ── Header ── */
    header { display:flex; justify-content:space-between; align-items:center; height:58px; padding:0 18px;
      background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:1000; flex-shrink:0; }
    .brand { display:flex; align-items:center; gap:9px; text-decoration:none; color:var(--text); }
    .brand-mark { width:30px; height:30px; border-radius:8px; background:var(--c-primary); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .brand-mark svg { width:17px; height:17px; }
    .brand-title { font-size:16px; font-weight:700; margin:0; letter-spacing:-.2px; }
    header .right { display:flex; gap:6px; align-items:center; font-size:13px; }
    header a, header button { cursor:pointer; font:inherit; text-decoration:none; }
    .nav-tab { color:var(--muted); padding:7px 12px; border-radius:8px; text-decoration:none; font-weight:500; border:none; background:none; transition:background .15s,color .15s; }
    .nav-tab:hover { background:var(--c-hover); color:var(--text); }
    .nav-tab.active { background:var(--c-primary); color:#fff; }
    .icon-btn { width:34px; height:34px; border:none; background:var(--c-hover); color:var(--text); border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .icon-btn:hover { background:var(--line); }
    .profile { position:relative; }
    .profile-tab { display:flex; align-items:center; gap:3px; }
    .profile-menu { position:absolute; right:0; top:calc(100% + 8px); background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--c-shadow-lg); min-width:170px; display:none; z-index:2000; overflow:hidden; }
    .profile-menu.on { display:block; }
    .profile-menu a, .profile-menu button { display:block; width:100%; text-align:left; padding:10px 14px; font:inherit; font-size:13px; color:var(--text); background:none; border:none; border-bottom:1px solid var(--line); cursor:pointer; text-decoration:none; }
    .profile-menu a:hover, .profile-menu button:hover { background:var(--c-hover); }
    /* ── Autocomplete ── */
    .ac-wrap { position:relative; flex:1; }
    .ac { position:absolute; left:0; right:0; top:calc(100% + 4px); background:var(--card); border:1px solid var(--line); border-radius:10px; z-index:1500; max-height:240px; overflow-y:auto; display:none; box-shadow:var(--c-shadow-lg); }
    .ac.on { display:block; }
    .ac-item { padding:10px 14px; font-size:13px; cursor:pointer; display:flex; gap:8px; align-items:center; }
    .ac-item:hover { background:var(--c-hover); }
    .ac-item .t { margin-left:auto; color:var(--muted); font-size:11px; }
    /* 지도를 최대한 크게. 세로 9.4:0.6(푸터), 가로 9:1(우측 패널).
       basis를 0으로 둬야 flex 비율이 그대로 화면 비율이 된다(basis가 남아 있으면 비율이 왜곡됨).
       패널은 min-width로 하한만 둔다 — 9:1을 그대로 두면 넓은 화면에서 카드가 깨진다. */
    .layout { display:flex; flex-wrap:wrap; flex:9.4; min-height:0; overflow:hidden; }
    #map { flex:9 1 0; min-height:300px; }
    .panel { flex:1 1 0; min-width:280px; overflow-y:auto; padding:14px 16px; }
    /* ── Panel widgets ── */
    .engine-bar { display:flex; gap:4px; margin-bottom:10px; background:var(--c-hover); padding:4px; border-radius:10px; }
    .tool-btn { flex:1; font:inherit; font-size:12px; font-weight:600; padding:7px 10px; border:none; background:transparent; color:var(--muted); border-radius:7px; cursor:pointer; transition:all .15s; }
    .tool-btn:hover { color:var(--text); }
    .tool-btn.on { background:var(--card); color:var(--c-primary); box-shadow:var(--c-shadow); }
    .search-row { display:flex; gap:8px; margin-bottom:12px; }
    .search-inp { width:100%; font:inherit; font-size:13px; padding:11px 14px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--text); }
    .search-inp::placeholder { color:var(--muted); }
    .search-inp:focus { outline:2px solid var(--c-primary); outline-offset:-1px; border-color:var(--c-primary); }
    .gps-btn { width:44px; flex-shrink:0; border:1px solid var(--line); background:var(--card); color:var(--c-primary); border-radius:10px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .gps-btn:hover { border-color:var(--c-primary); background:var(--c-primary-soft); }
    .list-tabs { display:flex; background:var(--c-hover); border-radius:10px; padding:4px; margin:4px 0 14px; }
    .list-tab { flex:1; font:inherit; font-size:12px; font-weight:600; padding:8px 6px; border:none; background:transparent; color:var(--muted); border-radius:7px; cursor:pointer; transition:all .15s; }
    .list-tab.active { background:var(--card); color:var(--c-primary); box-shadow:var(--c-shadow); }
    .fav-cats { display:none; gap:6px; flex-wrap:wrap; margin:-4px 0 14px; }
    .fav-cats.on { display:flex; }
    .fav-cat { font:inherit; font-size:12px; padding:6px 14px; border:1px solid var(--line); background:var(--card); color:var(--muted); border-radius:999px; cursor:pointer; transition:all .15s; }
    .fav-cat:hover { border-color:var(--c-primary); color:var(--c-primary); }
    .fav-cat.active { background:var(--c-primary); color:#fff; border-color:var(--c-primary); }
    .banner { background:var(--c-primary-soft); color:var(--text); padding:11px 14px; border-radius:10px; font-size:12.5px; margin-bottom:12px; line-height:1.55; }
    .banner a { color:var(--c-primary); font-weight:600; }
    #recent { font-size:12px; margin-bottom:12px; color:var(--muted); line-height:2; }
    .recent-chip { display:inline-block; margin:2px 4px 2px 0; padding:3px 10px; border:1px solid var(--line); border-radius:999px; text-decoration:none; color:var(--text); background:var(--card); font-size:12px; }
    .recent-chip:hover { border-color:var(--c-primary); color:var(--c-primary); }
    #cmp-bar { background:var(--card); border:1px solid var(--line); border-left:3px solid var(--c-primary); border-radius:10px; padding:10px 14px; font-size:13px; margin-bottom:12px; box-shadow:var(--c-shadow); }
    .kakao-back { background:none; border:none; color:var(--c-primary); cursor:pointer; font:inherit; padding:2px 0 10px; }
    /* ── Result cards ── */
    .rec { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:10px; cursor:pointer; box-shadow:var(--c-shadow); transition:box-shadow .15s,border-color .15s,transform .15s; }
    .rec:hover { border-color:var(--c-primary); box-shadow:var(--c-shadow-lg); transform:translateY(-1px); }
    .rec h3 { margin:0 0 5px; font-size:15px; font-weight:600; letter-spacing:-.2px; }
    .rec .meta { font-size:12px; color:var(--muted); }
    .rec .tags { margin:9px 0; display:flex; flex-wrap:wrap; gap:6px; }
    .tag { font-size:11px; background:var(--c-hover); color:var(--muted); border-radius:999px; padding:3px 10px; font-weight:500; }
    .tag.hit { background:var(--c-primary); color:#fff; }
    .rec .why { font-size:12px; color:var(--ok); margin:6px 0; min-height:15px; }
    .rec .actions { display:flex; gap:8px; margin-top:10px; }
    .rec .actions a, .rec .actions button { font-size:12px; font-weight:500; padding:7px 12px; border-radius:8px; border:1px solid var(--line); cursor:pointer; background:var(--card); color:var(--text); text-decoration:none; }
    .rec .actions a:hover, .rec .actions button:hover { border-color:var(--c-primary); color:var(--c-primary); }
    .rec .actions .save { background:var(--c-primary); color:#fff; border:none; }
    .rec .actions .save:hover { color:#fff; }
    .score { float:right; font-size:14px; color:var(--c-price); font-weight:700; margin-left:8px; }
    .cmp-check { float:right; font-size:11px; color:var(--muted); cursor:pointer; user-select:none; margin-left:8px; }
    .sheet-handle { display:none; }
    /* ── Leaflet custom controls ── */
    .lc { background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:var(--c-shadow); font-size:12px; color:var(--text); padding:11px 13px; line-height:1.7; max-width:215px; }
    .lc-title { font-weight:700; font-size:12px; margin-bottom:7px; color:var(--text); letter-spacing:-.1px; }
    .lc-check { display:block; cursor:pointer; font-size:12px; }
    .lc-check input { vertical-align:middle; margin-right:5px; accent-color:var(--c-primary); }
    .lc-sep { margin:9px 0 6px; padding-top:8px; border-top:1px solid var(--line); }
    .lc-sub { font-weight:700; font-size:12px; margin-bottom:6px; }
    .lc-dot { display:inline-block; width:9px; height:9px; border-radius:50%; vertical-align:middle; margin-right:5px; }
    .jb-stage { font:inherit; font-size:10.5px; padding:3px 9px; border:1px solid var(--line); border-radius:999px; background:var(--card); color:var(--muted); cursor:pointer; }
    .jb-stage.active { background:var(--c-primary); border-color:var(--c-primary); color:#fff; }
    .sat-btn { padding:7px 10px; background:var(--card); border:1px solid var(--line); border-radius:8px; cursor:pointer; font-size:12px; font-weight:600; box-shadow:var(--c-shadow); color:var(--text); }
    .sat-btn.on { background:var(--c-primary); color:#fff; border-color:var(--c-primary); }
    .rp-stat { font-size:11px; color:var(--muted); margin-top:5px; }
    /* ── Popup card system ── */
    .pc { width:min(264px, calc(100vw - 56px)); padding:16px; box-sizing:border-box; }
    .pc-head { font-weight:700; font-size:14px; margin-bottom:8px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; line-height:1.35; color:var(--text); }
    .pc-body { font-size:12px; color:var(--muted); margin-bottom:12px; line-height:1.6; }
    .pc-body b { color:var(--text); }
    .pc-actions { display:flex; flex-direction:column; gap:7px; }
    .pc-btn { display:block; width:100%; padding:9px 10px; border-radius:8px; font-family:inherit; font-size:13px; font-weight:500; cursor:pointer; text-align:center; text-decoration:none; box-sizing:border-box; background:var(--card); border:1px solid var(--line); color:var(--text); transition:all .15s; }
    .pc-btn:hover { border-color:var(--c-primary); color:var(--c-primary); }
    .pc-btn-primary { background:var(--c-primary); color:#fff; border:1px solid var(--c-primary); }
    .pc-btn-primary:hover { background:#1a63a8; color:#fff; }
    /* Leaflet 이 .leaflet-container a { color:#0078A8 } 를 깔아 두어 흰 글씨 버튼이 파란 배경에
       묻힌다(실측 대비 1.02:1). a + 클래스로 상세도를 높여 흰 글씨를 지킨다. */
    a.pc-btn-primary { color:#fff; }
    a.pc-btn-primary:hover { color:#fff; }
    .pc-btn-outline { background:var(--card); border:1px solid var(--line) !important; color:var(--c-text); }
    .pc-btn-row { display:flex; gap:7px; }
    .pc-btn-row .pc-btn { flex:1; }
    .pc-price { font-size:15px; font-weight:700; color:var(--c-price); margin-top:2px; }
    .unit-row { display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; padding:6px 8px; margin-top:4px; background:var(--card); border:1px solid var(--line); border-radius:8px; cursor:pointer; font:inherit; font-size:12px; color:var(--text); text-align:left; box-sizing:border-box; }
    .unit-row:hover { border-color:var(--c-primary); }
    .unit-row b { color:var(--text); }
    .unit-row .ur-chev { color:var(--muted); font-size:9px; transition:transform .15s; flex-shrink:0; }
    .unit-row.open .ur-chev { transform:rotate(90deg); }
    .unit-detail { display:none; margin:2px 0 2px; padding:7px 9px; border-left:2px solid var(--c-primary); border-radius:0 8px 8px 0; background:var(--c-primary-soft); font-size:11px; color:var(--muted); line-height:1.75; }
    .unit-detail b { color:var(--text); }
    /* ── Leaflet 팝업 (다크모드 배경 + 화면 크기에 맞는 크기) ── */
    .leaflet-popup-content-wrapper { background:var(--card); color:var(--text); border-radius:12px; box-shadow:var(--c-shadow-lg); }
    .leaflet-popup-content { max-height:min(62vh, 520px); overflow-y:auto; max-width:min(340px, calc(100vw - 40px)); }
    .leaflet-popup-tip { background:var(--card); }
    .leaflet-container a.leaflet-popup-close-button { color:var(--muted); }
    /* ── 호버 툴팁 (건물 위 커서 정지 시 주소·토지·건물 정보) ── */
    .leaflet-tooltip.hov-tip { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 10px; box-shadow:var(--c-shadow-lg); font-size:12px; line-height:1.55; }
    .leaflet-tooltip-top.hov-tip::before { border-top-color:var(--card); }
    .hov-tip .hov-addr { color:var(--muted); }
    .hov-tip .hov-name { font-weight:700; color:var(--text); }
    /* 네이버 부동산 링크는 방문 후 색이 갈리면 안 보이므로 유지한다 */
    a.pc-btn-primary:visited { color:#fff; }
    /* Leaflet 기본 컨트롤은 배경이 흰색으로 고정돼 있어 다크모드에서 메뉴 글씨가 사라진다(실측 1.19:1).
       테마 변수로 따라가게 만든다. */
    .leaflet-control-layers, .leaflet-control-layers-expanded { background:var(--card); color:var(--text); }
    .leaflet-control-layers-separator { border-top-color:var(--line); }
    .leaflet-control-layers-toggle { background-color:var(--card); }
    .leaflet-control-zoom a { background-color:var(--card); color:var(--text); border-color:var(--line); }
    .leaflet-control-zoom a:hover { background-color:var(--c-hover); }
    .leaflet-control-attribution { color:var(--muted); }
    :root.dark .leaflet-control-attribution { background:rgba(27,30,37,.85); }
    /* ── Stage chip bar ── */
    #jb-stage-bar { position:absolute; bottom:18px; left:50%; transform:translateX(-50%); display:flex; gap:6px; padding:6px 10px; background:var(--card); border-radius:999px; box-shadow:var(--c-shadow-lg); z-index:900; max-width:90vw; overflow-x:auto; white-space:nowrap; }
    .jb-chip { padding:5px 13px; border-radius:999px; border:1.5px solid var(--c-border); background:var(--card); font-size:12px; cursor:pointer; font-family:inherit; color:var(--text); }
    .jb-chip.active { border-color:var(--c-primary); background:var(--c-primary); color:#fff; }
    /* ── Footer ── */
    .site-footer { flex:0.6; flex-shrink:0; background:var(--card); border-top:1px solid var(--line);
      padding:7px 18px; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:4px 14px; }
    .footer-links { display:flex; gap:14px; flex-wrap:wrap; }
    .footer-links a { font-size:11.5px; color:var(--muted); text-decoration:none; }
    .footer-links a:hover { color:var(--c-primary); }
    .footer-contact { font-size:11.5px; color:var(--muted); }
    .build-tag { opacity:.55; }
    .footer-stats { display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--muted); }
    .footer-stats b { font-weight:600; color:var(--text); }
    @media (max-width:640px) {
      .layout { display:block; flex:none; }
      #map { height:100vh; min-height:0; }
      .panel { position:fixed; left:0; right:0; bottom:0; max-height:84vh; height:auto; z-index:1200;
        background:var(--card); border-radius:18px 18px 0 0; box-shadow:0 -6px 24px rgba(0,0,0,.18);
        transform:translateY(calc(100% - 138px)); transition:transform .28s ease; }
      .panel.sheet-open { transform:translateY(0); }
      .sheet-handle { display:block; text-align:center; padding:8px 0 6px; position:sticky; top:0; background:var(--card); border-radius:18px 18px 0 0; cursor:pointer; z-index:2; }
      .sheet-handle::before { content:''; display:inline-block; width:42px; height:5px; border-radius:3px; background:#c1c4c9; }
      .site-footer { display:none; }
      header { padding:0 12px; }
      .brand-title { font-size:15px; }
    }
  </style>
</head>
<body>
  <header>
    <a href="land.html" class="brand">
      <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l7-4v18"/><path d="M19 21V11l-7-4"/></svg></span>
      <span class="brand-title">부동산 지도</span>
    </a>
    <div class="right">
      <a href="main.html" class="nav-tab">맛집</a>
      <a href="land.html" class="nav-tab active">부동산</a>
      <button id="theme-btn" class="icon-btn" title="다크모드" aria-label="다크모드"></button>
      <div class="profile">
        <button id="profile-btn" class="nav-tab profile-tab">내 정보 <span style="opacity:.6;">▾</span></button>
        <div id="profile-menu" class="profile-menu">
          <a href="#" id="who" style="color:var(--muted);font-size:11px;pointer-events:none;">로그인 안 됨</a>
          <a href="onboarding.html">취향 설정</a>
          <button id="logout" style="display:none;">로그아웃</button>
        </div>
      </div>
    </div>
  </header>

  <div class="layout">
    <div id="map"></div>
    <div class="panel">
      <div class="sheet-handle" id="sheet-handle" title="위로 올려서 목록 보기"></div>
      <div id="engine-bar" class="engine-bar">
        <button class="tool-btn on" data-engine="vworld">V-World</button>
        <button class="tool-btn" data-engine="kakao">카카오</button>
      </div>
      <div class="search-row">
        <div class="ac-wrap">
          <input type="text" id="search" class="search-inp" placeholder="주소 · 지역명 · 정비구역명 검색 (Enter)" autocomplete="off" />
          <div id="ac" class="ac"></div>
        </div>
        <button id="geo-btn" class="gps-btn" title="내 위치" aria-label="내 위치"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="7"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/></svg></button>
