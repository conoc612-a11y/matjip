  <script>
    const SUPABASE_URL = 'https://bhgijvaxxjnocgfnaaeu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_rYaGd3kk5UuFBe3TSpFA8g_uGHWwkqM';
    // supabase SDK는 무겁고 초기 지도 렌더와 무관하므로(푸터 통계·로그아웃 전용) 첫 필요 시 로드한다.
    let sb = null;
    let _sbPromise = null;
    function ensureSb() {
      if (_sbPromise) return _sbPromise;
      if (window.supabase) { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); _sbPromise = Promise.resolve(sb); return _sbPromise; }
      _sbPromise = new Promise((resolve) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
        s.async = true;
        s.onload = () => { try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch (e) { sb = null; } resolve(sb); };
        s.onerror = () => resolve(null);
        document.head.appendChild(s);
      });
      return _sbPromise;
    }
    const $ = (id) => document.getElementById(id);

    // ── 다크모드 (localStorage 저장, 맛집 지도와 동일 키) ──
    const ICON_SUN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
    const ICON_MOON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
    function applyTheme(dark) { document.documentElement.classList.toggle('dark', dark); const b = $('theme-btn'); if (b) b.innerHTML = dark ? ICON_SUN : ICON_MOON; }
    applyTheme(localStorage.getItem('mj_theme') === 'dark');
    function initThemeBtn() { const b = $('theme-btn'); if (b) b.addEventListener('click', () => { const dark = !document.documentElement.classList.contains('dark'); localStorage.setItem('mj_theme', dark ? 'dark' : 'light'); applyTheme(dark); }); }
    initThemeBtn();

    // ── 최근 본 곳 (부동산 전용 키, 최대 8개) ──
    const RECENT_KEY = 'mj_recent_land';
    function loadRecent() { try { return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); } catch (e) { return []; } }
    function pushRecent(item) { let a = loadRecent().filter((x) => x.key !== item.key); a.unshift(item); a = a.slice(0, 8); try { localStorage.setItem(RECENT_KEY, JSON.stringify(a)); } catch (e) {} renderRecent(); }
    function renderRecent() {
      const a = loadRecent(), el = $('recent'); if (!el) return;
      if (!a.length) { el.style.display = 'none'; return; }
      el.style.display = '';
      el.innerHTML = '최근 본 곳: ' + a.map((x, i) => `<span class="recent-chip" data-i="${i}" style="cursor:pointer;">${esc(x.name)} <b class="recent-del" data-i="${i}" title="삭제" style="cursor:pointer;color:#e03131;margin-left:1px;">✕</b></span>`).join('') + ` <a href="#" class="recent-clear" style="color:var(--muted);font-size:11px;">전체삭제</a>`;
      el.querySelectorAll('.recent-chip').forEach((c) => c.addEventListener('click', (e) => {
        if (e.target.closest('.recent-del')) return;
        e.preventDefault(); const x = a[Number(c.dataset.i)];
        if (x && x.lat != null) map.setView([x.lat, x.lng], 16);
      }));
      el.querySelectorAll('.recent-del').forEach((d) => d.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); const b = loadRecent(); b.splice(Number(d.dataset.i), 1); try { localStorage.setItem(RECENT_KEY, JSON.stringify(b)); } catch (er) {} renderRecent(); }));
      const cl = el.querySelector('.recent-clear'); if (cl) cl.addEventListener('click', (e) => { e.preventDefault(); try { localStorage.removeItem(RECENT_KEY); } catch (er) {} renderRecent(); });
    }

    // ── V-World 인증키: 발급받으면 아래에 넣으세요. 비어 있으면 OSM 지도로 자동 대체 ──
    const VWORLD_KEY = 'B2CDEEDD-D622-311B-883B-CC7890E50822';

    // ── 카카오 실시간 장소검색 (REST API, 도메인 등록 불필요) ──
    const KAKAO_JS_KEY = '725e7ddf965a3ffff3da1f2ac771cc57'; // developers.kakao.com 앱 > 앱키 > JavaScript 키 (Web 도메인 등록 필요). 비우면 버튼 숨김.
    let kakaoReady = false, kakaoMarkers = [];
    function clearKakaoMarkers() { kakaoMarkers.forEach((m) => map.removeLayer(m)); kakaoMarkers = []; }
    if (KAKAO_JS_KEY) {
      const ks = document.createElement('script');
      ks.src = `//dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_JS_KEY}&libraries=services&autoload=false`;
      ks.onload = () => window.kakao && kakao.maps.load(() => { kakaoReady = true; });
      document.head.appendChild(ks);
    }

    let searchEngine = 'vworld';
    // ── 검색엔진 선택 ──
    (function initEngineBar() {
      document.querySelectorAll('#engine-bar .tool-btn').forEach(function (b) {
        b.addEventListener('click', function () {
          document.querySelectorAll('#engine-bar .tool-btn').forEach(function (x) { x.classList.remove('on'); });
          b.classList.add('on'); searchEngine = b.dataset.engine;
        });
      });
    })();

    // ── 지도 초기화 (서울 중심) ──
    // preferCanvas: 벡터(마커 9천개 + 폴리곤 정점 4.2만개)를 SVG DOM 대신 캔버스 1장에 그린다.
    // SVG 렌더러는 도형마다 <path> DOM을 만들고 팬/줌마다 전부 좌표를 재계산해서 지도가 버벅인다.
    const map = L.map('map', { wheelPxPerZoomLevel: 120, preferCanvas: true }).setView([37.5665, 126.9780], 12);
    // V-World 다중 배경지도 (일반/항공영상/하이브리드) — S-Map 유사 룩.
    // Satellite는 jpeg, Base·Hybrid는 png (실측 확인). 우측 상단 레이어에서 전환.
    const vTile = (layer, ext) => L.tileLayer(
      `https://api.vworld.kr/req/wmts/1.0.0/${VWORLD_KEY}/${layer}/{z}/{y}/{x}.${ext}`,
      { maxZoom: 19, attribution: '© V-World' });
    const osmBase = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      { maxZoom: 19, attribution: '© OpenStreetMap' });
    const baseLayers = VWORLD_KEY ? {
      '일반지도': vTile('Base', 'png'),
      '항공영상': vTile('Satellite', 'jpeg'),
      '항공+라벨': L.layerGroup([vTile('Satellite', 'jpeg'), vTile('Hybrid', 'png')]),
      'OSM (대체)': osmBase,
    } : { 'OSM': osmBase };
    const defaultBase = baseLayers['일반지도'] || baseLayers['OSM'];
    defaultBase.addTo(map);
    // 기본(일반지도) 타일 실패 시 OSM 자동 대체
    if (VWORLD_KEY) { let fell = false; defaultBase.on('tileerror', () => { if (!fell) { fell = true; map.removeLayer(defaultBase); osmBase.addTo(map); } }); }

    // 실거래가 JSON은 딱 한 번만 받는다 (Promise 메모이즈). 이전엔 페이지 로드 + 레이어 켤 때 중복 다운로드됨.
    //
    // 파일이 두 종류다. 새 파일을 먼저 시도하고 없으면 옛 파일로 물러선다.
    //  realprice_apt.json      (신) 압축 포맷. 지번을 지오코딩한 정확한 좌표 + 전세가율·거래유형.
    //  realprice_seoul_gg.json (구) 객체 배열. 좌표 출처가 불명확해 클릭 지점과 건물이 어긋났다.
    // 두 포맷을 같은 객체 모양으로 되살려서, 이후 코드(마커·팝업·근처 통계)는 차이를 모르게 한다.
    let _rpPromise = null;
    let rpSource = '';        // 어느 파일을 썼는지 (팝업 표시 판단에 사용)
    function decodeCompactRp(j) {
      const F = {};
      j.fields.forEach((f, i) => { F[f] = i; });
      const pick = (r, k) => (F[k] === undefined ? undefined : r[F[k]]);
      return j.rows.map((r) => ({
        name: r[F.name], gu: j.gus[r[F.gu]], dong: j.dongs[r[F.dong]],
        lat: r[F.lat], lng: r[F.lng], priceEok: r[F.price], area: r[F.area],
        floor: r[F.floor], build: r[F.build], ymd: r[F.ymd],
        cnt: pick(r, 'cnt'), pmin: pick(r, 'pmin'), pmax: pick(r, 'pmax'),
        jeonse: pick(r, 'jeonse') || 0, jrate: pick(r, 'jrate') || 0,
        gbn: j.gbns && F.gbn !== undefined ? j.gbns[r[F.gbn]] : '',
        cancel: pick(r, 'cancel') ? 1 : 0, lease: pick(r, 'lease') ? 1 : 0,
      }));
    }
    // realprice_apt.json 이 없는 동안 매 로드마다 404 를 헛으로 쏘지 않도록,
    // 404 (파일 진짜 부재)를 세션 동안 기억한다. 배포로 파일이 생기면 6시간 안에
    // 그 사실만으로 못 보게 되는 건 막고 싶어 TTL 을 준다. 네트워크 오류는 404 가
    // 아니므로 캐시하지 않는다 — 일시 장애가 '파일 없음'으로 고착되는 것을 방지.
    const APT_MISS_KEY = 'rp_apt_missing', APT_MISS_TTL = 6 * 3600 * 1000;
    function aptMissingCached() {
      try {
        const v = sessionStorage.getItem(APT_MISS_KEY);
        const t = Number(v);
        return Boolean(v) && Number.isFinite(t) && Date.now() - t < APT_MISS_TTL;
      } catch (e) { return false; }
    }
    function loadRp() {
      if (_rpPromise) return _rpPromise;
      const tryApt = !aptMissingCached();
      _rpPromise = (tryApt
        ? fetch('realprice_apt.json')
        : Promise.reject({ _missing: true }))
        .then((r) => {
          if (r.ok) return r.json();
          const e = new Error('no apt file'); e._missing = true; throw e;
        })
        .then((j) => {
          try { sessionStorage.removeItem(APT_MISS_KEY); } catch (e) {}
          rpSource = 'apt'; rpRows = decodeCompactRp(j); return rpRows;
        })
        .catch((err) => {
          if (err && err._missing) { try { sessionStorage.setItem(APT_MISS_KEY, String(Date.now())); } catch (e) {} }
          return fetch('realprice_seoul_gg.json')
            .then((r) => r.json())
            .then((rows) => { rpSource = 'legacy'; rpRows = rows; return rows; })
            .catch(() => null);
        });
      return _rpPromise;
    }
    let rpRows = null;  // 실거래가 원본 (실거래가 레이어 켜면 로드됨) — 지도 클릭 정보/근처 실거래에서 참조. VWORLD 블록보다 먼저 선언(TDZ 방지)
    let _jbRowsGlobal = null; // 정비사업 행 전역 참조 (VWORLD 블록 밖 클릭 핸들러에서 참조)
    // ── 공용 헬퍼 ────────────────────────────────────────────────
    // 아래 3개는 반드시 최상위 스코프에 둔다.
    // 과거에 이 함수들을 `if (VWORLD_KEY) { }` 블록 안에 두었다가 두 가지 사고가 났다:
    //  (1) 블록 밖 지도 클릭 핸들러에서 ageColor 호출 → ReferenceError →
    //      팝업이 '정보 불러오는 중…'에서 영구 정지
    //  (2) 밖에서 쓰려고 같은 로직을 복사해 둔 사본이 생겨 4벌/2벌로 늘어남
    // 새 헬퍼를 추가할 때도 블록 안이 아니라 여기에 둘 것.

    // 노후도(건축년도) 색상
    const ageColor = (b) => { const y = parseInt(b) || 0; return !y ? '#868e96' : y >= 2015 ? '#2f9e44' : y >= 2005 ? '#94d82d' : y >= 1995 ? '#fab005' : y >= 1985 ? '#fd7e14' : '#e03131'; };
    // 두 좌표 사이 대략 거리(km). 서울권 한정 근사식(위도 1도≈111km, 경도 1도≈88km).
    const kmDist = (lat1, lng1, lat2, lng2) => { const dy = (lat1 - lat2) * 111, dx = (lng1 - lng2) * 88; return Math.sqrt(dx * dx + dy * dy); };
    // 정비사업 유형 분류 + 색상
    const JB_COLOR = { '재개발': '#e03131', '재건축': '#7048e8', '모아': '#2f9e44', '지역주택': '#1c7ed6', '리모델링': '#f08c00', '기타': '#868e96' };
    function jbGroup(g) {
      g = g || '';
      if (g.indexOf('가로') >= 0 || g.indexOf('소규모') >= 0) return '모아';
      if (g.indexOf('재건축') >= 0) return '재건축';
      if (g.indexOf('재개발') >= 0) return '재개발';
      if (g.indexOf('지역주택') >= 0) return '지역주택';
      if (g.indexOf('리모델링') >= 0) return '리모델링';
      return '기타';
    }

    // ── [토지 레이어] V-World 국토·토지정보 오버레이 (토글) ─────────────────
    // 근거: V-World 공개 WMS(api.vworld.kr) / 서울 토지정보 land.seoul.go.kr.
    // 우측 상단 레이어 버튼에서 켜고 '줌인'하면 필지·용도지역이 색으로 표시됩니다.
    // (광역 줌에서는 비어 보일 수 있음 — 지적/용도지역은 확대해야 그려짐.)
    if (VWORLD_KEY) {
      // 주의: STYLES는 넘기지 않는다 — Leaflet 기본값(styles:'')이 이미 있어,
      // 중복 지정하면 'STYLES=&STYLES='가 되어 V-World가 타일을 거부한다(빈 화면 원인).
      // CRS도 넘기지 않는다 — Leaflet 1.9의 TileLayer.WMS가 onAdd에서 자동으로
      // 'crs=EPSG:3857'(지도 CRS)을 주입하며, V-World는 이를 수용한다.
      // 명시적으로 넣으면 'CRS=...&CRS=...' 중복 파라미터가 되어 거부될 수 있다.
      // (행정경계 레이어는 CRS 미지정 시 빈 타일을 반환하므로 Leaflet 자동 CRS가 필수.)
      const wms = (layers, opacity) => L.tileLayer.wms('https://api.vworld.kr/req/wms', {
        layers, format: 'image/png', transparent: true, version: '1.3.0', uppercase: true,
        KEY: VWORLD_KEY, DOMAIN: location.origin,
        opacity, attribution: '© V-World', maxZoom: 19,
      });
      // 레이어 코드는 V-World 공식 WMS 가이드에서 확인함(추측 아님).
      // 일부(그린벨트·진흥지구)는 도심 중앙엔 데이터가 없어 외곽에서 보임 — 정상.
      // 토지거래허가구역(동 단위 근사) — 지정 동 경계 GeoJSON 색칠. 정확·최신은 land.seoul.go.kr.
      // 렌더러는 캔버스 대신 SVG를 강제: 캔버스는 팬/줌 후 이전 transform(scale/translate)이
      // 남아 폴리곤이 지도와 어긋나 보이는 스테일 버그가 있었음. SVG는 moveend마다 좌표를
      // 다시 투영해 항상 타일·마커와 일치한다. (32개 폴리곤·정점 4.2만개는 단일 레이어로
      // 손으로 켜는 오버레이라 SVG 비용이 허용 범위 — 무거운 9천 마커 계열은 캔버스 유지)
      const tojiLayer = L.geoJSON(null, {
        renderer: L.svg(),
        style: { color: '#c92a2a', weight: 1, fillColor: '#e8590c', fillOpacity: 0.28 },
        onEachFeature: (f, layer) => layer.bindTooltip(`토지거래허가구역 · ${f.properties.name}`, { sticky: true }),
      });
      fetch('toji_heoga.geojson').then((r) => r.json()).then((gj) => tojiLayer.addData(gj)).catch(() => {});

      // ── 아파트 실거래가·노후도 (서울+경기 9천여 단지) : 필터 + 범례 + 카드 팝업 ──
      const realpriceCluster = L.markerClusterGroup({ chunkedLoading: true, maxClusterRadius: 60 });
      // 팝업·툴팁은 마우스가 닿는 순간에만 생성 (9천개 미리 만들면 지도가 멈춘다)
      realpriceCluster.on('mouseover', (e) => {
        const m = e.layer, d = m && m._rp;
        if (!d || m._ttDone) return;
        m._ttDone = 1;
        m.bindTooltip(d.priceEok == null ? esc(d.name) : d.priceEok + '억', { direction: 'top' }).openTooltip();
      });
      realpriceCluster.on('click', (e) => {
        const m = e.layer;
        if (!m || !m._rp) return;
        if (!m.getPopup() && m._pop) m.bindPopup(m._pop());
        m.openPopup();
      });
      rpRows = null;
      const rpFilter = { price: 'all', age: 'all' };
      const inPrice = (p) => { if (rpFilter.price === 'all') return true; if (p == null) return false; const v = Number(p); return rpFilter.price === 'u10' ? v < 10 : rpFilter.price === '10_20' ? (v >= 10 && v < 20) : rpFilter.price === '20_30' ? (v >= 20 && v < 30) : v >= 30; };
      const inAge = (b) => { if (rpFilter.age === 'all') return true; const y = parseInt(b) || 0; return rpFilter.age === 'new' ? y >= 2015 : rpFilter.age === 'mid' ? (y >= 2000 && y < 2015) : (y > 0 && y < 2000); };
      function rpBuild() {
        if (!rpRows) return;
        realpriceCluster.clearLayers();
        realpriceCluster.addLayers(rpRows.filter((d) => inPrice(d.priceEok) && inAge(d.build)).map((d) => {
          const m = L.circleMarker([d.lat, d.lng], { radius: 5, color: '#fff', weight: 1, fillColor: ageColor(d.build), fillOpacity: 0.9 });
          m._rp = d;
          m._pop = (() => `<div class="pc"><div class="pc-head"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${ageColor(d.build)};flex-shrink:0;"></span><span class="rp-name">${esc(d.name)}</span></div><div class="pc-body"><div style="margin-bottom:4px;">${esc(d.gu)} ${esc(d.dong)}</div><div class="pc-price">매매 ${d.priceEok == null ? '-' : d.priceEok + '억'}</div><div style="margin-top:3px;">평단가: ${d.area && d.priceEok ? Math.round(d.priceEok * 10000 / d.area).toLocaleString() + '만원/㎡' : '-'}</div><div style="margin-top:3px;">${esc(d.area)}㎡ · ${esc(d.floor)}층 · 거래 ${esc(d.ymd)}</div><div style="margin-top:3px;">${esc(d.build || '?')}년 건축${parseInt(d.build) <= 1994 ? '<span style="background:#e03131;color:#fff;font-size:10px;padding:2px 8px;border-radius:999px;margin-left:6px;">재건축연한 초과</span>' : ''}</div>${jeonseHtml(d, '평형 기준')}${rpFlagsHtml(d)}<div class="rp-radius-stat rp-stat" style="display:none;"></div></div><div class="pc-actions"><button class="rp-save pc-btn pc-btn-outline" style="border-color:var(--c-price) !important;color:var(--c-price);">저장</button><a href="https://map.naver.com/p/search/${encodeURIComponent(d.name + ' ' + (d.dong || d.gu || ''))}?c=${d.lng},${d.lat},17,0,0,0,dh" target="_blank" rel="noopener" class="pc-btn pc-btn-primary rp-naver">네이버 부동산</a><div class="pc-btn-row"><button class="rt-start pc-btn pc-btn-outline">출발</button><button class="rt-end pc-btn pc-btn-outline">도착</button></div><button class="sv-btn pc-btn pc-btn-outline">거리뷰</button></div></div>`);
          return m;
        }));
      }
      const rpFilterCtrl = L.control({ position: 'topleft' });
      rpFilterCtrl.onAdd = () => {
        const div = L.DomUtil.create('div');
        div.className = 'lc';
        div.innerHTML = '<div class="lc-title">실거래가 필터</div>'
          + '<label style="display:block;margin-bottom:6px;">실거래가 <select id="rp-price" style="font:inherit;font-size:12px;"><option value="all">전체</option><option value="u10">10억 이하</option><option value="10_20">10~20억</option><option value="20_30">20~30억</option><option value="o30">30억+</option></select></label>'
          + '<label style="display:block;">건축년도 <select id="rp-age" style="font:inherit;font-size:12px;"><option value="all">전체</option><option value="new">2015~ 신축</option><option value="mid">2000~2014</option><option value="old">2000 이전</option></select></label>';
        L.DomEvent.disableClickPropagation(div);
        return div;
      };
      const rpLegend = L.control({ position: 'bottomright' });
      rpLegend.onAdd = () => {
        const div = L.DomUtil.create('div');
        div.className = 'lc';
        const row = (c, t) => `<div><span class="lc-dot" style="background:${c};"></span>${t}</div>`;
        div.innerHTML = '<div class="lc-title">건축년도 (노후도)</div>' + row('#2f9e44', '신축 2015~') + row('#94d82d', '2005~2014') + row('#fab005', '1995~2004') + row('#fd7e14', '1985~1994') + row('#e03131', '노후 ~1984') + row('#868e96', '미상');
        return div;
      };
      // 가격·건축년도 필터와 노후도 범례는 아파트/연립다세대 두 레이어가 공용으로 쓴다.
      // 레이어별로 배선 코드를 복사하면 또 갈라지므로 한 곳에 모아둔다.
      function showPriceFilter() {
        rpFilterCtrl.addTo(map);
        rpLegend.addTo(map);
        setTimeout(() => {
          const ps = document.getElementById('rp-price'), ag = document.getElementById('rp-age');
          if (ps && !ps._w) { ps._w = 1; ps.value = rpFilter.price; ps.addEventListener('change', () => { rpFilter.price = ps.value; rpBuild(); villaBuild(); }); }
          if (ag && !ag._w) { ag._w = 1; ag.value = rpFilter.age; ag.addEventListener('change', () => { rpFilter.age = ag.value; rpBuild(); villaBuild(); }); }
        }, 60);
      }
      map.on('overlayadd', (e) => {
        if (e.layer !== realpriceCluster) return;
        showPriceFilter();
        // 이미 받아둔 경우에도 반드시 rpBuild()를 호출해야 마커가 그려진다 (예전엔 early-return으로 빈 레이어가 됐음)
        loadRp().then(() => rpBuild());
      });
      map.on('overlayremove', (e) => {
        // 연립·다세대 레이어가 아직 켜져 있으면 공용 컨트롤을 지우지 않는다
        if (e.layer !== realpriceCluster || map.hasLayer(villaCluster)) return;
        map.removeControl(rpFilterCtrl);
        map.removeControl(rpLegend);
      });

      // ── 연립·다세대 실거래가 (서울 23,708개 건물) ──────────────────
      // 국토부 '연립다세대 매매' 12개월치를 건물(지번) 단위로 묶은 것. tools/collect_realprice.js 산출물.
      // 파일이 1.86MB 라 레이어를 켤 때만 받는다. 아파트 파일과 같은 지연 로딩 방식.
      // 저장 포맷이 압축돼 있다(키 이름 1회 + 값 배열 + 구·동·유형 사전 인덱스).
      // 같은 정보를 아파트 파일 포맷으로 담으면 6MB 라 초기 로딩을 망친다.
      const villaCluster = L.markerClusterGroup({ chunkedLoading: true, maxClusterRadius: 60 });
      villaCluster.on('mouseover', (e) => {
        const m = e.layer, d = m && m._rp;
        if (!d || m._ttDone) return;
        m._ttDone = 1;
        m.bindTooltip(d.priceEok == null ? esc(d.name) : d.priceEok + '억', { direction: 'top' }).openTooltip();
      });
      villaCluster.on('click', (e) => {
        const m = e.layer;
        if (!m || !m._rp) return;
        if (!m.getPopup() && m._pop) m.bindPopup(m._pop());
        m.openPopup();
      });

      // 전세가율 표시. 연립·다세대는 매매를 '건물' 단위로 묶었기 때문에 전세도 건물 단위로
      // 짝지어진다. 같은 건물이라도 평형이 다르면 짝이 어긋나 값이 튈 수 있다.
      // 실측: 9,891건 중 90건(0.9%)이 20~130% 밖으로 벗어났다(571% 같은 값).
      // 신뢰 구간을 벗어난 값은 숨긴다 — 틀린 숫자를 보여주는 것보다 안 보여주는 편이 낫다.
      // note: 짝짓는 단위를 사용자에게 알려준다. 아파트는 평형까지 맞춰서 더 정확하고,
      // 연립·다세대는 건물 단위라 평형이 다르면 값이 어긋날 수 있다.
      function jeonseHtml(d, note) {
        if (!(d.jeonse > 0) || !(d.jrate >= 20 && d.jrate <= 130)) return '';
        const col = d.jrate >= 80 ? 'var(--c-danger)' : d.jrate >= 65 ? 'var(--c-price)' : 'var(--c-success)';
        return `<div style="margin-top:3px;">전세 ${d.jeonse}억 · 전세가율 <b style="color:${col};">${d.jrate}%</b>`
          + (note ? ` <span style="font-size:10px;color:var(--c-muted);">${note}</span>` : '') + `</div>`;
      }

      // 시세를 왜곡시키는 거래는 표시해서 걸러 볼 수 있게 한다.
      // 직거래는 중개 시장가와 어긋나기 쉽고, 계약 해제 건은 실제로 성사되지 않은 거래다.
      // 구 데이터 파일에는 이 필드가 없으므로 값이 있을 때만 그린다.
      function rpFlagsHtml(d) {
        const f = [];
        if (d.cancel) f.push('<span style="background:var(--c-danger);color:#fff;font-size:10px;padding:1px 6px;border-radius:9px;">계약해제</span>');
        if (d.gbn && d.gbn.indexOf('직거래') >= 0) f.push('<span style="background:#f08c00;color:#fff;font-size:10px;padding:1px 6px;border-radius:9px;">직거래</span>');
        if (d.lease) f.push('<span style="background:#7048e8;color:#fff;font-size:10px;padding:1px 6px;border-radius:9px;">토지임대부</span>');
        return f.length ? `<div style="margin-top:4px;display:flex;gap:4px;flex-wrap:wrap;">${f.join('')}</div>` : '';
      }

      function villaPopupHtml(d) {
        const ppm = d.area && d.priceEok ? Math.round(d.priceEok * 10000 / d.area).toLocaleString() + '만원/㎡' : '-';
        const oldTag = parseInt(d.build) <= 1994
          ? '<span style="background:#e03131;color:#fff;font-size:10px;padding:2px 8px;border-radius:999px;margin-left:6px;">재건축연한 초과</span>' : '';
        // 12개월 거래가 여러 건이면 가격 범위를 함께 보여준다 (한 건물의 시세 폭을 알 수 있다)
        const range = d.cnt > 1 && d.pmax > d.pmin
          ? `<div style="margin-top:3px;font-size:11px;color:var(--c-muted);">12개월 ${d.cnt}건 · ${d.pmin}~${d.pmax}억</div>`
          : `<div style="margin-top:3px;font-size:11px;color:var(--c-muted);">12개월 ${d.cnt}건</div>`;
        return `<div class="pc"><div class="pc-head"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${ageColor(d.build)};flex-shrink:0;"></span><span class="rp-name">${esc(d.name)}</span><span style="font-size:10px;background:var(--c-primary);color:#fff;padding:1px 8px;border-radius:999px;">${esc(d.type)}</span></div><div class="pc-body"><div style="margin-bottom:4px;">${esc(d.gu)} ${esc(d.dong)}</div><div class="pc-price">매매 ${d.priceEok}억</div><div style="margin-top:3px;">평단가: ${ppm}</div><div style="margin-top:3px;">${esc(d.area)}㎡ · ${esc(d.floor)}층 · 거래 ${esc(d.ymd)}</div><div style="margin-top:3px;">${esc(d.build)}년 건축${oldTag}</div>${jeonseHtml(d, '건물 기준 참고')}${range}<div class="rp-radius-stat" style="display:none;"></div></div><div class="pc-actions"><button class="rp-save pc-btn pc-btn-outline" style="border-color:var(--c-price) !important;color:var(--c-price);">저장</button><a href="${naverSearchUrl(d.name + ' ' + (d.dong || d.gu || ''), d.lat, d.lng)}" target="_blank" rel="noopener" class="pc-btn pc-btn-primary rp-naver">네이버 부동산</a><div class="pc-btn-row"><button class="rt-start pc-btn pc-btn-outline">출발</button><button class="rt-end pc-btn pc-btn-outline">도착</button></div><button class="sv-btn pc-btn pc-btn-outline">거리뷰</button></div></div>`;
      }

      let villaRows = null, _villaPromise = null;
      function loadVilla() {
        if (!_villaPromise) {
          _villaPromise = fetch('realprice_villa.json').then((r) => r.json()).then((j) => {
            // 압축 포맷 → 아파트 마커와 같은 객체 모양으로 되살린다.
            // 이후 코드(팝업·저장·근처 통계)가 아파트와 동일하게 동작하도록 필드명을 맞춘다.
            const F = {};
            j.fields.forEach((f, i) => { F[f] = i; });
            villaRows = j.rows.map((r) => ({
              name: r[F.name], gu: j.gus[r[F.gu]], dong: j.dongs[r[F.dong]], type: j.types[r[F.type]],
              lat: r[F.lat], lng: r[F.lng], priceEok: r[F.price], area: r[F.area], floor: r[F.floor],
              build: r[F.build], ymd: r[F.ymd], cnt: r[F.cnt], pmin: r[F.pmin], pmax: r[F.pmax],
              jeonse: r[F.jeonse] || 0, jrate: r[F.jrate] || 0,
            }));
            return villaRows;
          }).catch(() => null);
        }
        return _villaPromise;
      }

      function villaBuild() {
        if (!villaRows) return;
        villaCluster.clearLayers();
        villaCluster.addLayers(villaRows.filter((d) => inPrice(d.priceEok) && inAge(d.build)).map((d) => {
          const m = L.circleMarker([d.lat, d.lng], { radius: 4, color: '#fff', weight: 1, fillColor: ageColor(d.build), fillOpacity: 0.9 });
          m._rp = d;                       // 아파트 마커와 같은 키를 쓴다 → 저장·길찾기·거리뷰 핸들러 공용
          m._isVilla = 1;                  // 팝업의 '구 데이터' 배지를 아파트(구폴백)에만 붙이기 위한 표시
          m._pop = (() => villaPopupHtml(d));
          return m;
        }));
      }
      map.on('overlayadd', (e) => {
        if (e.layer !== villaCluster) return;
        showPriceFilter();
        loadVilla().then(() => villaBuild());
      });
      map.on('overlayremove', (e) => {
        // 두 레이어가 공용이므로, 다른 하나가 아직 켜져 있으면 컨트롤을 남겨둔다
        if (e.layer !== villaCluster || map.hasLayer(realpriceCluster)) return;
        map.removeControl(rpFilterCtrl);
        map.removeControl(rpLegend);
      });

      // 실거래가 마커 팝업의 ☆저장 버튼 → localStorage 즐겨찾기 토글
      map.on('popupopen', (e) => {
        const m = e.popup._source;
        if (!m || !m._rp) return;
        const node = e.popup._contentNode || e.popup.getElement();
        const btn = node && node.querySelector('.rp-save');
        if (!btn) return;
        const d = m._rp;
        pushRecent({ key: propId(d), name: d.name, lat: d.lat, lng: d.lng });
        const paint = () => {
          const on = isPropSaved(d);
          btn.textContent = on ? '저장됨 · 해제' : '저장';
          btn.style.background = on ? 'var(--c-primary)' : 'var(--card)';
          btn.style.color = on ? '#fff' : 'var(--c-primary)';
          btn.style.borderColor = 'var(--c-primary)';
        };
        paint();
        btn.onclick = () => { togglePropSave(d); paint(); if (landMode === 'favorites') render(); };
        const sBtn = node.querySelector('.rt-start'), eBtn = node.querySelector('.rt-end');
        if (sBtn) sBtn.onclick = () => { setRoutePoint('start', d.lat, d.lng); m.closePopup(); };
        if (eBtn) eBtn.onclick = () => { setRoutePoint('end', d.lat, d.lng); m.closePopup(); };
        const svBtn = node.querySelector('.sv-btn');
        if (svBtn) svBtn.onclick = () => showStreetView(d.lat, d.lng);
        enrichAptName(node, d.name, d.dong || d.gu, d.lat, d.lng);  // '두산' → '두산1단지아파트'
        // 아파트가 구 폴백 파일(realprice_seoul_gg.json)로 뜨는 동안엔 투자 판단에 중요한 한계를 알린다.
        // 좌표가 근사값이라 실제 건물과 어긋날 수 있고, 전세가율·거래유형 필드가 없어 보이지 않는다.
        // realprice_apt.json 이 배포되면 rpSource='apt' 가 되어 이 배지는 자동으로 사라진다.
        if (rpSource === 'legacy' && !m._isVilla) {
          const body = node.querySelector('.pc-body');
          if (body) {
            const n = document.createElement('div');
            n.style.cssText = 'margin-top:4px;font-size:10px;color:var(--c-price);';
            n.textContent = '구 데이터 — 좌표 근사 · 전세가율/거래유형 미제공';
            body.appendChild(n);
          }
        }
        // 반경 700m 실거래 통계
        if (rpRows && rpRows.length) {
          let cnt700 = 0, sum = 0, sumCnt = 0;
          rpRows.forEach((r) => {
            if (r.lat == null) return;
            const dist = kmDist(d.lat, d.lng, r.lat, r.lng);
            if (dist < 0.7) { cnt700++; if (r.priceEok != null) { sum += r.priceEok; sumCnt++; } }
          });
          const avgEl = node.querySelector('.rp-radius-stat');
          if (avgEl && cnt700 > 0) {
            avgEl.textContent = `반경 700m 실거래 ${cnt700}건 · 평균 ${sumCnt ? Math.round(sum/sumCnt*10)/10 : '-'}억`;
            avgEl.style.display = 'block';
          }
        }
      });

      // ── [정비사업] 서울 재개발·재건축·가로주택·지역주택 등 1,100여 구역 (정보몽땅 공식자료) ──
      // 사업구분 → 표시 그룹/색상. jaegebal 처럼 유형별로 색 구분 + 진행단계 표시.
      // 모아 = 소규모주택정비(가로주택정비·소규모재건축·소규모재개발) → 모아타운/모아주택 계열
      const jbCluster = L.markerClusterGroup({ chunkedLoading: true, maxClusterRadius: 50 });
      const jbPolyLayer = L.featureGroup();
      let jbRows = null, jbPolys = null;
      const jbFilter = { '재개발': true, '재건축': true, '모아': true, '지역주택': true, '리모델링': true, '기타': true };
      let jbActiveStage = 'all';
      const STAGE_COLOR_MAP = { '착공': '#2f9e44', '준공': '#1c7ed6', '관리처분': '#7048e8', '사업시행': '#e8590c', '조합설립': '#f08c00', '추진위': '#aaa', '대지선정': '#f08c00' };
      function stageColor(s) { s = s || ''; for (const [k, v] of Object.entries(STAGE_COLOR_MAP)) { if (s.includes(k)) return v; } return '#868e96'; }
      const STAGE_PCT = { '대지선정':10,'추진위':20,'조합설립':35,'사업시행':50,'관리처분':65,'착공':80,'준공':95,'조합해산':100,'정비구역해제':0 };
      function stagePct(s) { s=s||''; for(const [k,v] of Object.entries(STAGE_PCT)) { if(s.includes(k)) return v; } return 15; }
      function jbPopupHtml(d) {
        const g = jbGroup(d.gubun), c = JB_COLOR[g];
        const stageBadge = d.stage ? `<span style="display:inline-block;background:${stageColor(d.stage)};color:#fff;font-size:11px;padding:2px 8px;border-radius:999px;margin-left:4px;">${esc(d.stage)}</span>` : '';
        const linkBtns = (d.rc || d.cafe) ? `<div class="pc-btn-row">${d.rc ? `<a href="https://urban.seoul.go.kr/view/map/mapPopup.html?recordCode=${encodeURIComponent(d.rc)}" target="_blank" rel="noopener" class="pc-btn pc-btn-outline" style="border-color:#7048e8 !important;color:#7048e8;">경계지도</a>` : ''}${d.cafe ? `<a href="https://cleanup.seoul.go.kr/cafe/mainIndx.do?cafeUrl=${encodeURIComponent(d.cafe)}" target="_blank" rel="noopener" class="pc-btn pc-btn-outline" style="border-color:var(--c-primary) !important;color:var(--c-primary);">정보공개</a>` : ''}</div>` : '';
        return `<div class="pc"><div class="pc-head"><span style="display:inline-block;background:${c};color:#fff;font-size:11px;padding:2px 8px;border-radius:999px;">${g}</span>${stageBadge}</div><div class="pc-body"><div style="font-weight:700;font-size:14px;margin-bottom:2px;color:var(--c-text);">${esc(d.name)}</div><div>${esc(d.gu)} ${esc(d.jibun)}${d.approx ? ' <span style="color:var(--c-price);">(동 근사위치)</span>' : ''}</div><div style="font-size:11px;color:var(--c-muted);margin-top:3px;">사업구분: ${esc(d.gubun)}${d.method ? ' · ' + esc(d.method) : ''}</div><div style="margin:8px 0 4px;"><div style="display:flex;justify-content:space-between;font-size:10px;color:var(--c-muted);margin-bottom:3px;"><span>진행단계</span><span>${stagePct(d.stage)}%</span></div><div style="height:5px;background:var(--line);border-radius:3px;overflow:hidden;"><div style="height:100%;width:${stagePct(d.stage)}%;background:${stageColor(d.stage)};border-radius:3px;transition:width .3s;"></div></div></div><div class="jb-rp-stat rp-stat" style="display:none;padding:5px 0;border-top:1px solid var(--c-border);"></div></div><div class="pc-actions">${linkBtns}<div class="pc-btn-row"><button class="rt-start pc-btn pc-btn-outline" style="border-color:var(--c-success) !important;color:var(--c-success);">출발</button><button class="rt-end pc-btn pc-btn-outline" style="border-color:var(--c-danger) !important;color:var(--c-danger);">도착</button></div><button class="sv-btn pc-btn pc-btn-outline">거리뷰</button></div></div>`;
      }
      // ── 폴리곤 링 정제 ──────────────────────────────────────────
      // 원본 데이터에 두 종류의 쓰레기가 섞여 있다. 둘 다 "선만 보이는 폴리곤"의 원인이다.
      //  (1) 중복 링: 246개 레코드 중 91개에 동일한 경계가 2~4번 저장돼 있다.
      //      Leaflet 기본 fill-rule(evenodd)에서 같은 링이 두 번 겹치면 채움이 상쇄돼 사라진다.
      //      → 면적·정점수 서명으로 제거 (실측 397 → 281개, 데이터 손실 0)
      //  (2) 퇴화 링: 면적이 수십 ㎡에 불과한 실 조각. 정비구역일 수 없는 값이다.
      //      채워도 2.5px 선에 덮여 별 모양 선 뭉치로만 보인다.
      //      실측 면적 분포에 절벽이 있다 — 5% 지점 87㎡ / 10% 지점 6,590㎡.
      //      그 사이인 1,000㎡를 기준으로 자르면 진짜 구역은 하나도 안 잘린다.
      //      (레코드 11000AGZ201311228317 은 링 20개가 전부 87㎡ 이하라 통째로 탈락 →
      //       폴리곤 대신 마커로 표시된다. jbBuild 의 rings.length 검사가 그 처리를 한다.)
      const MIN_RING_M2 = 1000;
      const _ringCache = new Map();
      // 위경도 → ㎡ 근사 (서울권: 위도 1도≈111km, 경도 1도≈88km)
      const _ringArea = (r) => {
        let s = 0;
        for (let i = 0, n = r.length; i < n; i++) {
          const a = r[i], b = r[(i + 1) % n];
          s += (a[1] * 88000) * (b[0] * 111000) - (b[1] * 88000) * (a[0] * 111000);
        }
        return Math.abs(s / 2);
      };
      function usableRings(key, rings) {
        let out = _ringCache.get(key);
        if (out) return out;
        const seen = new Set();
        out = [];
        for (const r of rings) {
          if (!r || r.length < 3) continue;          // 면이 될 수 없음
          const a = _ringArea(r);
          if (a < MIN_RING_M2) continue;             // 퇴화 링(실 조각) 제외
          const sig = r.length + '|' + a.toExponential(8);
          if (seen.has(sig)) continue;               // 중복 링 제외
          seen.add(sig);
          out.push(r);
        }
        _ringCache.set(key, out);
        return out;
      }
      function jbBuild() {
        if (!jbRows) return;
        _jbRowsGlobal = jbRows;
        jbCluster.clearLayers();
        jbPolyLayer.clearLayers();
        const dots = [];
        jbRows.forEach((d) => {
          if (!jbFilter[jbGroup(d.gubun)]) return;
          if (jbActiveStage !== 'all' && !(d.stage || '').includes(jbActiveStage)) return;
          const c = JB_COLOR[jbGroup(d.gubun)];
          // 쓸 수 있는 링이 하나도 안 남으면 폴리곤을 그리지 않고 마커로 떨어뜨린다.
          // (예전엔 빈 배열로 L.polygon 을 만들어 아무것도 안 보이는 유령 도형이 됐다.)
          const rings = (d.rc && jbPolys && jbPolys[d.rc]) ? usableRings(d.rc, jbPolys[d.rc]) : null;
          if (rings && rings.length) {
            // fillRule 'nonzero': Leaflet 기본값은 'evenodd'인데, 그 규칙에서는 겹친 링이 서로를
            // 상쇄해 채움이 사라지고 외곽선만 남는다 (= 폴리곤 색이 안 칠해지는 증상).
            // weight 를 얇게: 서울 전체 줌에서는 구역이 20px 남짓이라 굵은 선이 채움을 덮어버린다.
            const poly = L.polygon(rings.map((r) => [r]), { color: c, weight: 1.5, fillColor: c, fillOpacity: 0.45, fillRule: 'nonzero', smoothFactor: 2 });
            poly._jb = d;
            poly.bindTooltip(`<b>${esc(d.name)}</b><br><span style="font-size:11px;color:#555">${esc(d.stage || '')}</span>`, { sticky: true });
            poly.bindPopup(() => jbPopupHtml(d));  // 열 때 생성
            jbPolyLayer.addLayer(poly);
          } else {
            const m = L.circleMarker([d.lat, d.lng], { radius: 10, color: '#fff', weight: 2.5, fillColor: c, fillOpacity: 0.95 });
            m._jb = d;
            m.bindTooltip(`<b>${esc(d.name)}</b> · ${esc(d.stage || '')}`, { direction: 'top' });
            m.bindPopup(() => jbPopupHtml(d));  // 열 때 생성
            dots.push(m);
          }
        });
        jbCluster.addLayers(dots);
      }
      const jbCtrl = L.control({ position: 'topleft' });
      jbCtrl.onAdd = () => {
        const div = L.DomUtil.create('div');
        div.className = 'lc';
        div.innerHTML = '<div class="lc-title">정비사업 유형</div>'
          + Object.keys(JB_COLOR).map((g) => `<label class="lc-check"><input type="checkbox" class="jb-f" data-g="${g}" checked> <span class="lc-dot" style="background:${JB_COLOR[g]};"></span> ${g}</label>`).join('')
          + '<div class="lc-sep lc-sub">진행단계</div>'
          + '<div style="display:flex;flex-wrap:wrap;gap:4px;">'
          + ['전체','추진위','조합설립','사업시행','관리처분','착공','준공'].map((s) => `<button class="jb-stage${s === '전체' ? ' active' : ''}" data-s="${s}">${s}</button>`).join('')
          + '</div>';
        L.DomEvent.disableClickPropagation(div);
        return div;
      };
      // ── Stage chip bar (bottom-center, shown when JB layer is active) ──
      const jbStageBar = document.createElement('div');
      jbStageBar.id = 'jb-stage-bar';
      jbStageBar.style.display = 'none';
      jbStageBar.innerHTML = ['전체','추진위','조합설립','사업시행','관리처분','착공','준공','대지선정'].map((s) => `<button class="jb-chip${s === '전체' ? ' active' : ''}" data-s="${s}">${s}</button>`).join('');
      document.getElementById('map').appendChild(jbStageBar);
      L.DomEvent.disableClickPropagation(jbStageBar);
      L.DomEvent.disableScrollPropagation(jbStageBar);
      jbStageBar.addEventListener('click', (e) => {
        const chip = e.target.closest('.jb-chip');
        if (!chip) return;
        jbActiveStage = chip.dataset.s === '전체' ? 'all' : chip.dataset.s;
        jbStageBar.querySelectorAll('.jb-chip').forEach((c) => c.classList.toggle('active', c === chip));
        document.querySelectorAll('.jb-stage').forEach((b) => b.classList.toggle('active', b.dataset.s === chip.dataset.s));
        jbBuild();
      });
      map.on('overlayadd', (e) => {
        if (e.layer !== jbCluster) return;
        jbCtrl.addTo(map); jbPolyLayer.addTo(map); jbStageBar.style.display = '';
        setTimeout(() => {
          document.querySelectorAll('.jb-f').forEach((cb) => { if (cb._w) return; cb._w = 1; cb.addEventListener('change', () => { jbFilter[cb.dataset.g] = cb.checked; jbBuild(); }); });
          document.querySelectorAll('.jb-stage').forEach((btn) => {
            if (btn._w) return; btn._w = 1;
            btn.addEventListener('click', () => {
              jbActiveStage = btn.dataset.s === '전체' ? 'all' : btn.dataset.s;
              document.querySelectorAll('.jb-stage').forEach((b) => b.classList.toggle('active', b === btn));
              jbStageBar.querySelectorAll('.jb-chip').forEach((c) => c.classList.toggle('active', c.dataset.s === btn.dataset.s));
              jbBuild();
            });
          });
        }, 60);
        if (jbRows) return;
        Promise.all([fetch('redevelop_seoul.json?v=3').then((r) => r.json()), fetch('redevelop_polygons.json?v=1').then((r) => r.json()).catch(() => ({}))]).then(([rows, polys]) => { jbRows = rows; jbPolys = polys; jbBuild(); }).catch(() => {});
      });
      map.on('overlayremove', (e) => { if (e.layer === jbCluster) { map.removeControl(jbCtrl); map.removeLayer(jbPolyLayer); jbStageBar.style.display = 'none'; } });
      // 정비구역 팝업의 출발/도착 → 길찾기
      map.on('popupopen', (e) => {
        const m = e.popup._source;
        if (!m || !m._jb) return;
        const node = e.popup._contentNode || e.popup.getElement();
        const d = m._jb;
        pushRecent({ key: 'jb' + d.name + d.jibun, name: d.name, lat: d.lat, lng: d.lng });
        const sBtn = node.querySelector('.rt-start'), eBtn = node.querySelector('.rt-end');
        if (sBtn) sBtn.onclick = () => { setRoutePoint('start', d.lat, d.lng); m.closePopup(); };
        if (eBtn) eBtn.onclick = () => { setRoutePoint('end', d.lat, d.lng); m.closePopup(); };
        const svBtn = node.querySelector('.sv-btn');
        if (svBtn) svBtn.onclick = () => showStreetView(d.lat, d.lng);
        // 인근 실거래 통계 (500m)
        if (rpRows && rpRows.length) {
          let cnt=0, sum=0, sumCnt=0, minP=Infinity, maxP=-Infinity;
          rpRows.forEach((r) => {
            if (r.lat==null) return;
            if (kmDist(d.lat, d.lng, r.lat, r.lng) < 0.5) {
              cnt++;
              if (r.priceEok!=null) { sum+=r.priceEok; sumCnt++; if(r.priceEok<minP)minP=r.priceEok; if(r.priceEok>maxP)maxP=r.priceEok; }
            }
          });
          const statEl = node.querySelector('.jb-rp-stat');
          if (statEl && cnt > 0) {
            statEl.innerHTML = `500m 내 아파트 ${cnt}건 · 평균 <b>${sumCnt ? Math.round(sum/sumCnt*10)/10 : '-'}억</b>${sumCnt>=2 ? ` (${minP}~${maxP}억)` : ''}`;
            statEl.style.display = 'block';
          }
        }
      });

      const landOverlays = {
        '정비사업 (재개발·재건축)': jbCluster,
        '아파트 실거래가·노후도': realpriceCluster,
        '연립·다세대 실거래가': villaCluster,
        '토지거래허가구역': tojiLayer,
        '행정구역 (시군구)': wms('lt_c_adsigg', 0.5),
        '행정동 경계': wms('lt_c_ademd', 0.4),
        '용도지역': wms('lt_c_uq111', 0.55),
        '지적도 (필지 경계)': wms('lp_pa_cbnd_bubun', 0.6),
        '개발제한구역 (그린벨트)': wms('lt_c_ud801', 0.5),
        '개발진흥지구': wms('lt_c_uq129', 0.5),
        '택지·사업지구': wms('lt_c_lhzone', 0.5),
      };
      L.control.layers(baseLayers, landOverlays, { collapsed: true, position: 'topright' }).addTo(map);
      // 항공영상 퀵토글
      const satBtn = L.control({ position: 'topleft' });
      satBtn.onAdd = () => {
        const b = L.DomUtil.create('button');
        b.title = '항공영상/일반지도 전환';
        b.className = 'sat-btn';
        b.textContent = '항공';
        let sat = false;
        b.onclick = () => {
          sat = !sat;
          if (sat) {
            Object.values(baseLayers).forEach(l => map.hasLayer(l) && map.removeLayer(l));
            baseLayers['항공+라벨'] && baseLayers['항공+라벨'].addTo(map);
            b.classList.add('on');
          } else {
            Object.values(baseLayers).forEach(l => map.hasLayer(l) && map.removeLayer(l));
            defaultBase.addTo(map);
            b.classList.remove('on');
          }
        };
        L.DomEvent.disableClickPropagation(b);
        return b;
      };
      satBtn.addTo(map);
    }
    // 실거래가 데이터는 초기 렌더를 막지 않도록 브라우저가 한가할 때 미리 로드 (클릭 팝업의 '근처 실거래'에 사용)
    (window.requestIdleCallback || ((f) => setTimeout(f, 2500)))(() => { loadRp(); ensureNaver(); });

    // ── [V-World 검색 API] 주소·지명 검색 → 지도 이동 (JSONP로 브라우저 CORS 회피) ──
    let vsMarker = null;
    function vworldSearch(q, type) {
      if (!q) return;
      const cb = '__vw_' + Date.now();
      const clean = () => { try { delete window[cb]; } catch (e) {} };
      window[cb] = (data) => {
        clean();
        const items = (data.response && data.response.result && data.response.result.items) || [];
        if (!items.length) {
          if (type === 'place') { vworldSearch(q, 'address'); return; } // 장소 없으면 주소로 재검색
          alert('검색 결과가 없어요: ' + q); return;
        }
        const it = items[0], x = Number(it.point.x), y = Number(it.point.y);
        map.setView([y, x], 16);
        if (vsMarker) map.removeLayer(vsMarker);
        vsMarker = L.marker([y, x]).addTo(map).bindPopup(`<b>${esc(it.title || q)}</b>`).openPopup();
      };
      const s = document.createElement('script');
      s.src = `https://api.vworld.kr/req/search?service=search&request=search&version=2.0&crs=EPSG:4326&size=5&page=1&query=${encodeURIComponent(q)}&type=${type}&format=json&key=${VWORLD_KEY}&callback=${cb}`;
      s.onerror = clean;
      document.head.appendChild(s);
    }
    // 검색 통합: 식당 필터는 #search 입력, 주소·지명 이동은 #search Enter로 처리(아래 참조).

    const markers = {}; // id -> marker
    let user = null;

    // ── V-World 역지오코딩 (좌표→주소, JSONP CORS 회피) ──
    function reverseGeocode(lat, lng, cb) {
      const name = '__vwrev_' + Math.floor(lat * 1e6) + '_' + Math.floor(lng * 1e6);
      window[name] = (data) => {
        try { delete window[name]; } catch (e) {}
        let addr = '';
        try { const r = data.response.result; addr = (r && r[0] && r[0].text) || ''; } catch (e) {}
        cb(addr);
      };
      const s = document.createElement('script');
      s.src = `https://api.vworld.kr/req/address?service=address&request=getAddress&version=2.0&crs=epsg:4326&point=${lng},${lat}&format=json&type=both&key=${VWORLD_KEY}&callback=${name}`;
      s.onerror = () => { try { delete window[name]; } catch (e) {} cb(''); };
      document.head.appendChild(s);
    }

    // ── 지도 클릭 → 위치 정보(주소 + 근처 실거래가) 표시 ──
    let clickMarker = null;
    const _gcCache = new Map(); // 좌표 캐시(≈1m 그리드) → {addr, bldName}
    // 그리드가 너무 크면(예: ×200 = 약 555m) 옆 건물을 클릭해도 같은 셀로 뭉쳐
    // 첫 건물의 주소·건물명·지번이 그대로 재사용된다. ×100000 ≈ 1.1m(위도)로 좁힌다.
    const _gcKey = (lat, lng) => `${(lat * 100000 | 0)},${(lng * 100000 | 0)}`;

    // ── 단지명 보정 ──────────────────────────────────────────────
    // 국토부 실거래가 원본은 단지명이 축약돼 있다 (실측: 9,030건 중 1,594건 = 17.7%가 3글자 이하).
    // 예를 들어 '두산1단지아파트'가 '두산'으로만 들어와서, 그대로 네이버에 검색하면
    // 전혀 다른 단지가 나온다. 좌표를 역지오코딩해 실제 건물명을 받아 보정한다.
    const _bldCache = new Map();
    function naverBldName(lat, lng, cb) {
      const key = _gcKey(lat, lng);
      if (_bldCache.has(key)) { cb(_bldCache.get(key)); return; }
      ensureNaver().then((nv) => {
        if (!(nv && nv.maps && nv.maps.Service)) { cb(null); return; }
        try {
          nv.maps.Service.reverseGeocode({
            coords: new nv.maps.LatLng(lat, lng),
            // orders 는 배열이 아니라 콤마로 이은 문자열이어야 한다.
            // 배열로 넘기면 콘솔에 '"orders" type does not match' 경고가 뜨고 무시된다.
            orders: [nv.maps.Service.OrderType.ROAD_ADDR, nv.maps.Service.OrderType.ADDR].join(','),
          }, (status, res) => {
            let name = null;
            try {
              if (status === nv.maps.Service.Status.OK) {
                for (const r of ((res.v2 && res.v2.results) || [])) {
                  const a0 = r.land && r.land.addition0;
                  if (a0 && a0.type === 'building' && a0.value) { name = a0.value; break; }
                }
              }
            } catch (err) {}
            _bldCache.set(key, name);
            cb(name);
          });
        } catch (err) { cb(null); }
      });
    }
    // ── 건물 정보 (V-World 건물정보 LT_C_BLDGINFO, JSONP) ────────────
    // 아파트가 아닌 건물(단독·다세대·근린생활 등)의 용도·층수·연면적·사용승인일을 제공한다.
    // 실측 주의: 이 레이어의 usability는 그룹코드(01000/02000/04000…)만 내려온다.
    // 5자리 세부코드(예: 02003 다세대주택)는 제공되지 않아 '다세대 vs 다가구' 구분은 불가능하다.
    // 그래서 계열까지만 표기하고, 층수·연면적으로 사용자가 판단할 수 있게 함께 보여준다.
    const BLD_USE = {
      '01000': '단독주택 계열 (단독·다중·다가구)',
      '02000': '공동주택 계열 (아파트·연립·다세대)',
      '03000': '제1종 근린생활시설', '04000': '제2종 근린생활시설',
      '05000': '문화 및 집회시설', '06000': '종교시설', '07000': '판매시설',
      '08000': '운수시설', '09000': '의료시설', '10000': '교육연구시설',
      '11000': '노유자시설', '12000': '수련시설', '13000': '운동시설',
      '14000': '업무시설', '15000': '숙박시설', '16000': '위락시설',
      '17000': '공장', '18000': '창고시설', '19000': '위험물 저장·처리시설',
      '20000': '자동차 관련시설', '21000': '동물·식물 관련시설', '22000': '자원순환 관련시설',
    };
    // V-World 데이터 API 범용 조회 (JSONP — 브라우저에서 CORS 없이 호출 가능함을 실측 확인)
    // 레이어별로 캐시한다. 좌표는 ≈1m 그리드로 뭉쳐 같은 건물 반복 조회를 막는다.
    const _vwCache = new Map();
    let _vwSeq = 0;
    function vworldFeature(dataId, lat, lng, cb) {
      const key = dataId + '@' + _gcKey(lat, lng);
      if (_vwCache.has(key)) { cb(_vwCache.get(key)); return; }
      const cbName = '__vw' + (++_vwSeq) + '_' + Math.abs(lat * 1e5 | 0);
      let done = false;
      const finish = (val) => {
        if (done) return;
        done = true;
        try { delete window[cbName]; } catch (e) {}
        _vwCache.set(key, val);
        cb(val);
      };
      window[cbName] = (data) => {
        let props = [];
        try { props = ((data.response.result.featureCollection.features) || []).map((f) => f.properties).filter(Boolean); } catch (e) {}
        finish(props);
      };
      const s = document.createElement('script');
      s.src = `https://api.vworld.kr/req/data?service=data&version=2.0&request=GetFeature&format=json&size=5`
        + `&crs=EPSG:4326&geomFilter=POINT(${lng}%20${lat})&data=${dataId}&key=${VWORLD_KEY}`
        + `&domain=${encodeURIComponent(location.origin)}&callback=${cbName}`;
      s.onerror = () => finish([]);
      document.head.appendChild(s);
      setTimeout(() => finish([]), 7000);
    }

    // 토지·건물 정보를 한 번에 모은다.
    //  LT_C_UQ111        용도지역   → 용적률·건폐율을 결정. 재개발 가치 판단의 출발점.
    //  LP_PA_CBND_BUBUN  지적       → 개별공시지가, 지번, 지목, PNU
    //  LT_C_BLDGINFO     건물       → 용도 계열, 층수, 연면적, 사용승인일

    // ── 국토교통부 건축HUB 건축물대장 (data.go.kr) ──────────────
    // 실측 확인: Access-Control-Allow-Origin: * 라서 브라우저에서 fetch 로 직접 호출된다.
    // 주의 1) 구버전 BldRgstService_v2 는 응답이 비어 있다. BldRgstHubService 를 써야 한다.
    // 주의 2) platGbCd 를 빠뜨리면 조회되지 않는다.
    // 주의 3) 이 키는 공개 HTML에 노출된다(V-World·네이버·카카오 키와 동일한 상황).
    //         일일 호출 한도가 있어 남용되면 소진될 수 있다.
    const MOLIT_KEY = '716d7a26e9743cf52ecda06537934dd5845ebafbc7322c4e32536652a5209030';
    // PNU(19자리) = 시군구5 + 법정동5 + 산여부1 + 본번4 + 부번4
    // V-World 지적 레이어가 주는 PNU 를 그대로 건축물대장 파라미터로 분해할 수 있다.
    function pnuParts(pnu) {
      if (!pnu || String(pnu).length !== 19) return null;
      const s = String(pnu);
      return { sigunguCd: s.slice(0, 5), bjdongCd: s.slice(5, 10), platGbCd: s[10] === '2' ? '1' : '0', bun: s.slice(11, 15), ji: s.slice(15, 19) };
    }
    const _brCache = new Map();
    // data.go.kr 은 간헐적으로 500·404 를 뱉는다(실측: 같은 요청이 연속 200 이다가도 한 번씩 실패,
    // 몰아치면 몇 초간 전부 실패). 그래서 세 가지를 지킨다.
    //  1) 일시적 실패는 최대 3회(600ms·1.8s 간격) 재시도한다.
    //  2) 일시적 실패를 캐시하지 않는다. 캐시하면 그 필지는 영영 조회를 안 하게 된다.
    //     '정상 응답인데 기록이 없음'(빈 배열)만 캐시한다.
    //  3) 병렬로 한꺼번에 쏘지 않는다 — 동시 요청이 몰리면 상위 게이트웨이가 통째로 막는다(loadLedgerDetail).
    // 건축HUB 의 조회는 전부 같은 지번 파라미터(sigunguCd·bjdongCd·platGbCd·bun·ji)를
    // 쓰므로(명세 공통 입력) op 이름만 바꿔 하나의 함수로 호출한다.
    // 표제부는 대표 동 1건(건물대장), 상세 조회는 배열 전체를 돌려준다.
    function ledgerOp(op, pnu, cb, _attempt) {
      const p = pnuParts(pnu);
      if (!p) { cb(null); return; }
      const key = op + '|' + pnu;
      if (_brCache.has(key)) { cb(_brCache.get(key)); return; }
      const attempt = _attempt || 0;
      const fail = () => {
        const wait = [600, 1800, 0][attempt];
        if (wait) { setTimeout(() => ledgerOp(op, pnu, cb, attempt + 1), wait); return; }
        cb(null);  // 캐시하지 않는다 — 다음 클릭 때 다시 시도할 수 있도록
      };
      // 아파트 대단지는 세대가 수백~천 개라 1페이지만 받으면 세대 수·공시가격이 잘린다.
      // totalCount 를 보고 100행/페이지로 마저 받되, 남용 방지를 위해 최대 500행(5페이지)으로 막는다.
      // 페이지는 순차로만 이어받아(data.go.kr 이 동시 요청에 약함) 한 번 실패하면 전체 재시도.
      const MAX_ROWS = 500;
      const pageSize = op === 'getBrTitleInfo' ? 10 : 100;
      const page = (pno, acc) => {
        const q = `serviceKey=${MOLIT_KEY}&sigunguCd=${p.sigunguCd}&bjdongCd=${p.bjdongCd}`
          + `&platGbCd=${p.platGbCd}&bun=${p.bun}&ji=${p.ji}&numOfRows=${pageSize}&pageNo=${pno}&_type=json`;
        fetch(`https://apis.data.go.kr/1613000/BldRgstHubService/${op}?${q}`)
          .then((r) => (r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status))))
          .then((j) => {
            const body = j.response.body;
            const items = body.items;
            const arr = (!items ? [] : Array.isArray(items.item) ? items.item : [items.item]).filter(Boolean);
            const acc2 = acc.concat(arr);
            const total = Number(body.totalCount) || 0;
            if (total > acc2.length && acc2.length < MAX_ROWS && arr.length === pageSize) {
              setTimeout(() => page(pno + 1, acc2), 150);
              return;
            }
            _brCache.set(key, acc2);
            cb(acc2);
          })
          .catch(fail);
      };
      page(1, []);
    }
    function buildingRegister(pnu, cb) {
      ledgerOp('getBrTitleInfo', pnu, (arr) => {
        // 한 필지에 동이 여러 개일 수 있다(아파트 단지). 연면적이 가장 큰 동을 대표로 삼는다.
        cb((arr || []).sort((a, b) => (Number(b.totArea) || 0) - (Number(a.totArea) || 0))[0] || null);
      });
    }
    // 서울시 도시계획조례 기준 용적률 상한. 지구단위계획·정비계획으로 달라질 수 있어 참고용이다.
    const FAR_LIMIT = {
      '제1종전용주거지역': 100, '제2종전용주거지역': 150,
      '제1종일반주거지역': 200, '제2종일반주거지역': 250, '제3종일반주거지역': 300,
      '준주거지역': 400, '근린상업지역': 600, '유통상업지역': 600,
      '일반상업지역': 800, '중심상업지역': 1000, '준공업지역': 400,
    };

    // ── 단독·다가구 동 단위 시세 ─────────────────────────────────
    // 국토부가 단독/다가구 실거래의 지번을 '1***' 로 마스킹해서(표본 428건 전부) 개별
    // 좌표를 찍을 수 없다. 그래서 마커가 아니라 동 단위 집계로만 제공한다.
    // 파일이 30KB 라 부담이 없어 처음 필요할 때 한 번 받는다.
    let houseStats = null, _housePromise = null;
    function loadHouse() {
      if (!_housePromise) {
        _housePromise = fetch('realprice_house.json').then((r) => r.json())
          .then((j) => { houseStats = j; return j; }).catch(() => null);
      }
      return _housePromise;
    }
    // V-World 지적의 addr('서울특별시 관악구 봉천동 459-8')에서 '관악구 봉천동' 을 뽑는다.
    // 집계 파일의 키가 이 형식이다.
    function guDongKey(addr) {
      const g = addrGuDong(addr);
      return g.gu && g.dong ? `${g.gu} ${g.dong}` : null;
    }
    function addrGuDong(addr) {
      const m = String(addr || '').match(/(\S+구)\s+(\S+?[동가])(?:\s|$)/);
      return m ? { gu: m[1], dong: m[2] } : { gu: '', dong: '' };
    }
    function houseStatHtml(st) {
      if (!st) return '';
      const rows = [`거래 <b>${st.cnt}건</b> · 중앙값 <b>${st.med}억</b>` + (st.max > st.min ? ` <span style="color:var(--c-muted);">(${st.min}~${st.max}억)</span>` : '')];
      const ar = [];
      if (st.plot) ar.push(`대지 ${st.plot}㎡`);
      if (st.area) ar.push(`연면적 ${st.area}㎡`);
      if (ar.length) rows.push(`<span style="color:var(--c-muted);">중앙값 ${ar.join(' · ')}</span>`);
      if (st.build) rows.push(`<span style="color:var(--c-muted);">건축년도 중앙값 ${st.build}년</span>`);
      return `<div style="margin-top:5px;padding-top:5px;border-top:1px dashed var(--c-border);">`
        + `<b>이 동 단독·다가구 시세</b> <span style="font-size:10px;color:var(--c-muted);">최근 12개월</span><br>${rows.join('<br>')}</div>`;
    }

    // Leaflet 의 popup.update() 는 저장된 _content 문자열로 innerHTML 을 다시 그린다.
    // 우리가 DOM 에 직접 꽂아 넣은 내용(토지·건물 정보, 상호 목록)이 그 순간 통째로 지워지고,
    // 붙잡아 둔 노드도 분리돼 이후 렌더가 화면에 영영 반영되지 않는다.
    // 팝업 높이는 자동이라 내용이 늘어나도 알아서 커진다. 단 _adjustPan() 을 재렌더마다
    // 부르면 '팝업 전체가 화면에 들어오도록' 지도가 순간이동(animate:false)해, 상세 조회가
    // 하나씩 쌓이는 동안 지도가 다른 지역으로 훌쩍 옮겨간 것처럼 보인다. 팝업은 내부
    // 스크롤이 가능하므로 앵커(클릭 지점)가 화면 안에 있는 동안은 지도를 건드리지 않는다.
    function repanPopup(p) {
      if (!p || !p.isOpen || !p.isOpen()) return;
      const map = p._map;
      const ll = p.getLatLng ? p.getLatLng() : null;
      if (!map || !ll) return;
      if (map.getBounds().pad(-0.03).contains(ll)) return;
      try { if (p._adjustPan) p._adjustPan(); } catch (e) {}
    }

    const M2_PER_PY = 3.305785;
    // 토지·건물 정보 렌더. 건물 부분은 출처가 둘인데 겹치므로 하나만 쓴다.
    //  br  = 건축물대장 (정확한 주용도·용적률·건폐율) — 있으면 이것만 쓴다
    //  bld = V-World LT_C_BLDGINFO (용도 '계열'까지만) — 대장에 기록이 없을 때만 폴백
    // 둘 다 그리면 '단독주택 계열'과 '주용도 단독주택'이 나란히 나와 중복이다.
    function landInfoHtml(st, noDetail) {
      if (!st) return '';
      const rows = [];
      let badge = '';

      // 용도지역 — 투자 판단에서 가장 먼저 보는 항목
      if (st.zone) rows.push(`<b style="color:var(--c-primary);">${esc(st.zone)}</b>`);

      // 개별공시지가 + 평당 환산
      const pc = st.parcel;
      if (pc) {
        const jg = Number(pc.jiga) || 0;
        if (jg > 0) {
          const when = pc.gosi_year ? `${esc(pc.gosi_year)}.${esc(pc.gosi_month || '')}` : '';
          rows.push(`공시지가 <b>${jg.toLocaleString()}원/㎡</b> <span style="color:var(--c-muted);">(평당 ${Math.round(jg * M2_PER_PY).toLocaleString()}원${when ? ' · ' + when + ' 기준' : ''})</span>`);
        }
        if (pc.jibun) rows.push(`지번 ${esc(pc.jibun)}`);
      }

      const oldTag = (yr) => (yr && parseInt(yr) <= 1994)
        ? '<span style="background:#e03131;color:#fff;font-size:10px;padding:1px 6px;border-radius:999px;margin-left:5px;">30년↑</span>' : '';
      const ageDot = (yr) => yr ? `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${ageColor(yr)};margin-right:5px;"></span>` : '';

      if (st.br) {
        // ── 건축물대장 (우선) ──
        const it = st.br;
        const yr = /^\d{8}$/.test(it.useAprDay || '') ? String(it.useAprDay).slice(0, 4) : '';
        badge = oldTag(yr);
        const fam = Number(it.fmlyCnt) || Number(it.hhldCnt) || 0;
        const purps = it.mainPurpsCdNm || it.etcPurps || '';
        if (purps) rows.push(ageDot(yr) + `주용도 <b style="color:var(--c-primary);">${esc(purps)}</b>` + (fam ? ` · ${fam}세대` : ''));
        if (it.bldNm) rows.push(`<span style="color:var(--c-muted);">${esc(it.bldNm)}</span>`);
        const vl = Number(it.vlRat) || 0, bc = Number(it.bcRat) || 0;
        if (vl || bc) {
          let s = (vl ? `용적률 <b>${vl}%</b>` : '') + (bc ? `${vl ? ' · ' : ''}건폐율 ${bc}%` : '');
          const lim = FAR_LIMIT[st.zone];
          if (lim && vl) {
            // 상한 대비 낮을수록 증축·재건축 여력이 있다는 뜻. 판단은 사용자 몫이라 수치만 보여준다.
            const pct = Math.round(vl / lim * 100);
            const col = pct < 70 ? 'var(--c-success)' : pct < 95 ? 'var(--c-price)' : 'var(--c-muted)';
            s += `<br><span style="color:${col};font-size:11px;">조례 상한 ${lim}% 대비 <b>${pct}%</b></span>`;
          }
          rows.push(s);
        }
        const ar = [];
        if (Number(it.platArea)) ar.push(`대지 ${Number(it.platArea).toLocaleString()}㎡`);
        if (Number(it.archArea)) ar.push(`건축 ${Number(it.archArea).toLocaleString()}㎡`);
        if (Number(it.totArea)) ar.push(`연면적 ${Number(it.totArea).toLocaleString()}㎡`);
        if (ar.length) rows.push(ar.join(' · '));
        const stx = [];
        if (it.strctCdNm) stx.push(esc(it.strctCdNm));
        if (Number(it.grndFlrCnt)) stx.push(`지상 ${it.grndFlrCnt}층` + (Number(it.ugrndFlrCnt) ? `·지하 ${it.ugrndFlrCnt}층` : ''));
        if (stx.length) rows.push(stx.join(' · '));
        if (yr) rows.push(`${yr}.${String(it.useAprDay).slice(4, 6)} 사용승인`);
        if (String(it.rserthqkDsgnApplyYn) === '1') {
          rows.push(`<span style="color:var(--c-success);">✓ 내진설계 적용</span>${it.rserthqkAblty ? ' <span style="color:var(--c-muted);font-size:11px;">' + esc(it.rserthqkAblty) + '</span>' : ''}`);
        }
      } else if (st.bld) {
        // ── V-World 폴백 (대장에 기록이 없는 건물) ──
        const b = st.bld;
        const yr = /^\d{8}$/.test(b.useapr_day || '') ? b.useapr_day.slice(0, 4) : '';
        badge = oldTag(yr);
        const use = BLD_USE[b.usability] || (b.usability ? '용도코드 ' + esc(b.usability) : '');
        if (use) rows.push(ageDot(yr) + use);
        const line = [
          b.grnd_flr && b.grnd_flr !== '0' ? `지상 ${esc(b.grnd_flr)}층` + (b.ugrnd_flr && b.ugrnd_flr !== '0' ? `·지하 ${esc(b.ugrnd_flr)}층` : '') : '',
          b.totalarea && b.totalarea !== '0' ? `연면적 ${Number(b.totalarea).toLocaleString()}㎡` : '',
        ].filter(Boolean).join(' · ');
        if (line) rows.push(line);
        if (yr) rows.push(`${yr}.${b.useapr_day.slice(4, 6)} 사용승인`);
      }

      const houseHtml = houseStatHtml(st.house);
      let detailHtml = '';
      if (st.br && !noDetail) {
        // 상세 조회는 클릭 때만 부른다(일일 호출 한도 절약). 결과가 캐시되면 다시 열 때 즉시 나온다.
        detailHtml = st.detail
          ? ledgerDetailHtml(st)
          : `<button type="button" class="ld-more" style="margin-top:5px;font-size:11px;color:var(--c-primary);background:none;border:1px solid var(--c-border);border-radius:6px;padding:3px 10px;cursor:pointer;">건축물대장 상세 보기</button>`;
      }
      if (!rows.length && !houseHtml && !detailHtml) return '';
      return `<div style="font-size:12px;margin-top:6px;border-top:1px solid var(--c-border);padding-top:5px;">`
        + (rows.length ? `<b>토지·건물 정보</b>${badge}<br>${rows.join('<br>')}` : '')
        + houseHtml + detailHtml + '</div>';
    }

    // ── 건축물대장 상세 (투자자용 추가 조회) ─────────────────────
    // 표제부만으론 부족한 항목을 '상세 보기' 클릭 한 번에 모아 보여준다.
    // 오수정화시설(getBrWclfInfo)은 투자 판단과 무관해 제외했다.
    const LEDGER_DETAIL_OPS = [
      ['recap', 'getBrRecapTitleInfo'],         // 총괄표제부 — 단지 전체 세대·주차·주/부속건물
      ['basis', 'getBrBasisOulnInfo'],          // 기본개요 — 건물명·대장종류
      ['floors', 'getBrFlrOulnInfo'],           // 층별개요 — 층별 주용도·면적
      ['atch', 'getBrAtchJibunInfo'],           // 부속지번 — 통합/합병된 필지
      ['exposPub', 'getBrExposPubuseAreaInfo'], // 전유공용면적 — 전용/공용면적 구분
      ['housePrice', 'getBrHsprcInfo'],        // 주택가격 — 공시가격. op명은 getBrHousePriceInfo가 아님(실측 확인)
      ['jijigu', 'getBrJijiguInfo'],            // 지역지구구역 — 정비구역 등 포함
      // 전유부(getBrExposInfo)는 목록을 상시 받아도 전유공용면적이 있으면 쓰이지 않는다.
      // 그래서 상시 호출에서 제외하고, 전유공용면적이 비어 있을 때만 보충 조회한다.
    ];
    function loadLedgerDetail(st, render) {
      if (!st || st.detail || st._ldBusy) return;
      const pnu = st.parcel && st.parcel.pnu;
      if (!pnu) return;
      // '일반'(단독·다세대 단독대장)은 전유/공용면적 개념이 없다. 집합건축물일 때만 조회.
      const isComplex = !st.br || st.br.regstrGbCdNm !== '일반';
      const ops = isComplex ? LEDGER_DETAIL_OPS : LEDGER_DETAIL_OPS.filter(([k]) => k !== 'exposPub');
      st._ldBusy = true;
      st.detail = { loading: true };
      render();
      let left = ops.length;
      const finish = () => {
        st.detail.loading = false;
        st._ldBusy = false;
        render();
      };
      const done = () => {
        if (--left > 0) return;
        if (isComplex && !(st.detail.exposPub || []).some((x) => String(x.exposPubuseGbCd) === '1')) {
          // 전유공용면적이 비면 전유부로 동·호 목록을 보충한다. 이때만 1회 더 호출.
          ledgerOp('getBrExposInfo', pnu, (arr) => {
            st.detail.expos = arr || [];
            if (arr === null) st.detail.fail = (st.detail.fail || 0) + 1;
            finish();
          });
          return;
        }
        finish();
      };
      // data.go.kr 은 동시 요청이 몰리면 통째로 막힌다(실측). 8개를 한꺼번에 쏘지 말고
      // 동시 2개씩, 완료마다 150ms 간격으로 흘려보내 실패율을 낮춘다.
      let idx = 0, active = 0;
      const pump = () => {
        while (active < 2 && idx < ops.length) {
          const [k, op] = ops[idx++];
          active++;
          ledgerOp(op, pnu, (arr) => {
            active--;
            st.detail[k] = arr || [];
            if (arr === null) st.detail.fail = (st.detail.fail || 0) + 1;
            done();
            if (active < 2 && idx < ops.length) setTimeout(pump, 150);
          });
        }
      };
      pump();
    }
    function ledgerDetailHtml(st) {
      const d = st.detail;
      if (!d) return '';
      if (d.loading) {
        return `<div style="margin-top:5px;padding-top:5px;border-top:1px dashed var(--c-border);font-size:11px;color:var(--c-muted);">건축물대장 상세 조회 중…</div>`;
      }
      const rows = [];
      const basis = (d.basis || [])[0];
      if (basis && basis.bldNm) {
        rows.push(`건물명 <b>${esc(basis.bldNm)}</b> <span style="color:var(--c-muted);font-size:10px;">${esc(basis.regstrGbCdNm || '')}</span>`);
      }
      const recap = (d.recap || [])[0];
      if (recap) {
        const parts = [];
        if (Number(recap.hhldCnt)) parts.push(`세대 <b>${Number(recap.hhldCnt).toLocaleString()}</b>`);
        if (Number(recap.totPkngCnt)) parts.push(`주차 <b>${Number(recap.totPkngCnt).toLocaleString()}대</b>`);
        if (Number(recap.mainBldCnt)) parts.push(`주건축물 ${recap.mainBldCnt}동`);
        if (Number(recap.atchBldCnt)) parts.push(`부속 ${recap.atchBldCnt}동`);
        if (Number(recap.archArea)) parts.push(`건축면적 ${Number(recap.archArea).toLocaleString()}㎡`);
        if (parts.length) rows.push(`<b>총괄표제부</b> ${parts.join(' · ')}`);
      }
      const jijigu = (d.jijigu || []).filter((x) => x.jijiguCdNm);
      if (jijigu.length) {
        const seen = new Set();
        const arr = [];
        for (const x of jijigu) {
          if (seen.has(x.jijiguCdNm)) continue;
          seen.add(x.jijiguCdNm);
          const gb = x.jijiguGbCdNm || ({ 1: '용도지역', 2: '용도지구', 3: '용도구역' }[x.jijiguGbCd] || '');
          arr.push(`<span style="color:var(--c-muted);font-size:10px;">${esc(gb)}</span> ${esc(x.jijiguCdNm)}`);
        }
        rows.push(`<b>지역·지구·구역</b> ${arr.join(' · ')}`);
      }
      const floors = (d.floors || []).filter((x) => x.flrNoNm || x.flrNo);
      if (floors.length) {
        const dongSet = new Set(floors.map((x) => x.dongNm).filter(Boolean));
        const uni = [];
        const seen = new Set();
        for (const f of floors) {
          const label = f.flrNoNm || (f.flrNo + '층');
          if (seen.has(label)) continue;
          seen.add(label);
          uni.push([label, f.mainPurpsCdNm, f.area].filter(Boolean).join(' '));
        }
        const dong = dongSet.size > 1 ? ` <span style="color:var(--c-muted);font-size:10px;">동 ${dongSet.size}개</span>` : '';
        rows.push(`<b>층별개요</b>${dong} ${uni.slice(0, 6).join(' · ')}${uni.length > 6 ? ` 외 ${uni.length - 6}개 층` : ''}`);
      }
      const atch = (d.atch || []).filter((x) => x.atchBun != null);
      if (atch.length) {
        const shown = atch.slice(0, 3).map((x) => `${x.atchBun}${Number(x.atchJi) ? '-' + x.atchJi : ''}`).join(', ');
        rows.push(`<b>부속지번</b> ${atch.length}필지${shown ? ' · ' + esc(shown) + ' 외' : ''}`);
      }
      // ── 호실별 전용·공용면적 (전유공용면적 = 집합건축물의 개별 세대 정보) ──
      // exposPubuseGbCd 1=전유(전용) 2=공용. 같은 동·호의 전용+공용 = 공급면적.
      // 방 갯수는 건축물대장 어디에도 없어 공급 데이터로는 제공할 수 없다.
      const expAll = (d.exposPub || []).filter((x) => x.dongNm || x.hoNm);
      if (expAll.length) {
        const units = new Map();
        for (const x of expAll) {
          const key = (x.dongNm || '') + '|' + (x.hoNm || '');
          if (key === '|') continue;
          const u = units.get(key) || {
            ho: ((x.dongNm && x.dongNm.trim() && x.dongNm !== '1') ? x.dongNm + '-' : '') + (x.hoNm || ''),
            flr: Number(x.flrNo) || 0, jeon: 0, gong: 0,
            purps: x.mainPurpsCdNm || '', strct: x.strctCdNm || '',
          };
          const a = Number(x.area) || 0;
          if (String(x.exposPubuseGbCd) === '1') u.jeon += a;
          else if (String(x.exposPubuseGbCd) === '2') u.gong += a;
          if (x.mainPurpsCdNm) u.purps = x.mainPurpsCdNm;
          if (x.strctCdNm) u.strct = x.strctCdNm;
          units.set(key, u);
        }
        const arr = [...units.values()].filter((u) => u.jeon > 0 || u.gong > 0)
          .sort((a, b) => (a.flr - b.flr) || (a.ho > b.ho ? 1 : -1));
        if (arr.length) {
          const dongSet = new Set(expAll.map((x) => x.dongNm).filter((v) => v && v.trim() && v !== '1'));
          const MAX = 24;
          // 행 클릭 → 해당 호 상세(층·전용/공용/공급·주용도·구조)가 아래로 펼쳐진다. 호 하나로
          // 들어가는 모달 대신 팝업 안에서 같은 자리에 펼침 — 새 데이터 없이 UX만 정리했다.
          const list = arr.slice(0, MAX).map((u, i) => {
            const total = u.jeon + u.gong;
            const detail = [
              `층 <b>${u.flr || '?'}</b>`,
              `전용 <b>${u.jeon.toFixed(1)}㎡</b>`,
              u.gong ? `공용 <b>${u.gong.toFixed(1)}㎡</b>` : '',
              total ? `공급 <b>${total.toFixed(1)}㎡</b>` : '',
              u.purps ? `주용도 <b>${esc(u.purps)}</b>` : '',
              u.strct ? `구조 <b>${esc(u.strct)}</b>` : '',
            ].filter(Boolean).join(' · ');
            return `<button type="button" class="unit-row" data-i="${i}">`
              + `<span>${esc(u.ho)} <b>전용 ${u.jeon.toFixed(1)}㎡</b>${u.gong ? ` · 공급 <b>${total.toFixed(1)}㎡</b>` : ''}</span>`
              + `<span class="ur-chev">▸</span></button>`
              + `<div class="unit-detail" id="ud-${i}">${detail}</div>`;
          }).join('');
          rows.push(`<b>호실별 면적</b> <span style="color:var(--c-muted);font-size:10px;">${arr.length}세대${dongSet.size ? ` · ${dongSet.size}개동` : ''} · 전용+공용=공급 · 호실 클릭</span>${list}${arr.length > MAX ? `<br><span style="color:var(--c-muted);font-size:10px;">외 ${arr.length - MAX}세대</span>` : ''}`);
        }
      }
      if (!expAll.length) {
        const exx = (d.expos || []).filter((x) => x.dongNm || x.hoNm);
        if (exx.length) {
          const names = exx.slice(0, 12).map((x) => `${x.dongNm && x.dongNm.trim() && x.dongNm !== '1' ? x.dongNm + '-' : ''}${x.hoNm || ''}`).filter(Boolean).join(', ');
          rows.push(`<b>전유부</b> ${exx.length}호${names ? ' · ' + esc(names) + (exx.length > 12 ? ' 외' : '') : ''}`);
        }
      }
      const hp = (d.housePrice || []).filter((x) => Number(x.hsprc));
      if (hp.length) {
        const vs = hp.map((x) => Number(x.hsprc));
        const min = Math.min(...vs), max = Math.max(...vs);
        const day = (hp.map((x) => String(x.stdDay || '')).filter((s) => /^\d{8}$/.test(s))[0] || '')
          .replace(/^(\d{4})(\d{2})(\d{2})$/, '$1.$2.$3');
        rows.push(`<b>공시가격</b> ${(min / 1e8).toFixed(min >= 1e9 ? 1 : 2)}~${(max / 1e8).toFixed(max >= 1e9 ? 1 : 2)}억 <span style="color:var(--c-muted);font-size:10px;">${day ? day + ' 기준 · ' : ''}세대별 ${hp.length}건</span>`);
      }
      if (!rows.length) {
        const msg = d.fail
          ? `<div style="font-size:11px;color:var(--c-price);">상세 조회를 불러오지 못했어요</div>`
          : `<div style="font-size:11px;color:var(--c-muted);">상세 조회 결과가 없어요</div>`;
        return `<div style="margin-top:5px;padding-top:5px;border-top:1px dashed var(--c-border);">`
          + msg + retryHtml(d) + '</div>';
      }
      return `<div style="margin-top:5px;padding-top:5px;border-top:1px dashed var(--c-border);">`
        + `<div style="font-size:11px;color:var(--c-muted);margin-bottom:2px;">건축물대장 상세 <span style="font-size:10px;">국토교통부 건축HUB</span></div>`
        + rows.join('<br>') + retryHtml(d) + '</div>';
    }
    function retryHtml(d) {
      if (!d || !d.fail) return '';
      return `<div style="margin-top:5px;"><span style="color:var(--c-price);font-size:11px;">${d.fail}개 항목을 불러오지 못했어요</span>`
        + ` <button type="button" class="ld-retry" style="font-size:11px;color:var(--c-primary);background:none;border:1px solid var(--c-border);border-radius:6px;padding:2px 9px;cursor:pointer;">다시 시도</button></div>`;
    }

    // 팝업의 토지·건물 정보를 채운다. 호출 순서를 이렇게 잡은 이유:
    //  1) 용도지역 + 지적만 먼저 받아 즉시 그린다 (공시지가·지번은 이 둘로 끝난다)
    //  2) 지적이 준 PNU 로 건축물대장을 조회한다 (정확한 주용도·용적률)
    //  3) 대장에 기록이 없을 때에 한해 V-World 건물정보를 폴백으로 부른다
    // 예전엔 V-World 3종을 무조건 받았는데, 대장이 나오면 LT_C_BLDGINFO 는 쓰이지도
    // 않고 화면에 중복만 만들었다. 일반적인 경우 호출이 3회 → 2회로 줄었다.
    function fillLandInfo(popupEl, getPopup, lat, lng, onInfo, noDetail) {
      const slot = popupEl && popupEl.querySelector('.bld-info');
      if (!slot) return;
      const st = { zone: '', parcel: null, br: null, bld: null, house: null, detail: null };
      const render = () => {
        slot.innerHTML = landInfoHtml(st, noDetail);
        const btn = slot.querySelector('.ld-more');
        if (btn) btn.onclick = () => loadLedgerDetail(st, render);
        const rb = slot.querySelector('.ld-retry');
        if (rb) rb.onclick = () => {
          st.detail = null;
          st._ldBusy = false;
          loadLedgerDetail(st, render);
        };
        slot.querySelectorAll('.unit-row').forEach((row) => {
          row.onclick = () => {
            const d = slot.querySelector('#ud-' + row.dataset.i);
            if (!d) return;
            const opening = d.style.display === 'none';
            slot.querySelectorAll('.unit-detail').forEach((x) => { x.style.display = 'none'; });
            slot.querySelectorAll('.unit-row').forEach((r) => r.classList.remove('open'));
            if (opening) { d.style.display = 'block'; row.classList.add('open'); }
          };
        });
        if (onInfo) onInfo(st);
        const p = getPopup();
        repanPopup(p);  // update() 를 쓰면 방금 꽂은 내용이 지워진다
      };
      let left = 2;
      const afterBase = () => {
        if (--left > 0) return;
        render();
        // 이 동의 단독·다가구 시세 (지번 마스킹 때문에 개별 마커가 불가능한 대신 제공)
        const key = guDongKey(st.parcel && st.parcel.addr);
        if (key) {
          loadHouse().then(() => {
            if (houseStats && houseStats[key]) { st.house = houseStats[key]; render(); }
          });
        }
        const pnu = st.parcel && st.parcel.pnu;
        if (!pnu) return;
        buildingRegister(pnu, (it) => {
          if (it) { st.br = it; render(); return; }
          vworldFeature('LT_C_BLDGINFO', lat, lng, (ps) => {
            st.bld = (ps || []).find((x) => x.usability) || null;
            if (st.bld) render();
          });
        });
      };
      vworldFeature('LT_C_UQ111', lat, lng, (ps) => {
        st.zone = ((ps || []).find((x) => x.uname) || {}).uname || '';
        afterBase();
      });
      vworldFeature('LP_PA_CBND_BUBUN', lat, lng, (ps) => {
        st.parcel = (ps || [])[0] || null;
        afterBase();
      });
    }

    // ── 이 지점의 상호(POI) ──────────────────────────────────────
    // '뜰안애' 같은 가게 이름은 건물명이 아니라 장소(POI) 데이터다.
    // 역지오코딩은 건축물대장상 건물명까지만 주므로 상호는 원리상 나올 수 없다.
    // 그래서 카카오 장소 검색(인근 공인중개사 찾기에 쓰는 것과 같은 API)으로 좌표 주변을 훑는다.
    // 카카오는 카테고리 단위로만 주변 조회가 되어 카테고리 수만큼 호출해야 한다.
    // → 지도 클릭마다 8회씩 부르면 낭비라, 팝업의 버튼을 눌렀을 때만 실행한다.
    const POI_CATS = [
      ['FD6', '음식점'], ['CE7', '카페'], ['HP8', '병원'], ['PM9', '약국'],
      ['CS2', '편의점'], ['BK9', '은행'], ['AC5', '학원'], ['AG2', '중개업소'],
    ];
    function findPois(lat, lng, radius, cb) {
      if (!(window.kakao && kakao.maps && kakao.maps.services)) { cb(null); return; }
      const svc = new kakao.maps.services.Places();
      const loc = new kakao.maps.LatLng(lat, lng);
      const found = [];
      let left = POI_CATS.length;
      const done = () => {
        if (--left > 0) return;
        const seen = new Set();
        const uniq = [];
        for (const p of found.sort((a, b) => a.dist - b.dist)) {
          if (seen.has(p.id)) continue;
          seen.add(p.id);
          uniq.push(p);
        }
        cb(uniq.slice(0, 5));
      };
      POI_CATS.forEach(([code, label]) => {
        svc.categorySearch(code, (data, status) => {
          try {
            if (status === kakao.maps.services.Status.OK) {
              for (const p of data) {
                const d = Number(p.distance);
                if (d <= radius) found.push({ id: p.id, name: p.place_name, label, dist: d });
              }
            }
          } catch (e) {}
          done();
        }, { location: loc, radius, sort: kakao.maps.services.SortBy.DISTANCE });
      });
    }

    // 좌표를 함께 넘겨 네이버 지도가 그 지점으로 이동하게 한다 (동명이 단지 오검색 방지)
    const naverSearchUrl = (q, lat, lng) => `https://map.naver.com/p/search/${encodeURIComponent(q)}?c=${lng},${lat},17,0,0,0,dh`;
    // 팝업이 열린 뒤 제목·네이버 링크를 실제 건물명으로 교체.
    // 원본명과 서로 포함 관계일 때만 반영한다 (엉뚱한 인접 건물명으로 바뀌는 것을 막기 위함).
    // 카카오 장소 DB 에서 단지 통칭을 찾는다.
    // 공적 장부에는 '1단지' 같은 구분이 없다 — 실측으로 확인했다:
    //   동대문구 답십리동 990 → 건축물대장 표제부 13개 동 전부 bldNm "두산아파트",
    //   총괄표제부도 "두산아파트", 네이버 역지오코딩도 "두산아파트".
    //   같은 지번을 카카오 장소 DB 로 보면 "두산1단지아파트"(1m)와 "두산2단지아파트"(66m)로 나뉜다.
    //   국토부 실거래가는 둘 다 "두산"으로 축약해 내려주므로, 통칭이 있어야 구분된다.
    // 카테고리 필터가 핵심이다. 이름·거리만 보면 부속 시설이 이긴다:
    //   "삼성" → "종로 평창삼성 전기차충전소"(7m) 가 "삼성아파트"(8m) 보다 가깝다.

          + '<div id="sv-minimap" style="position:absolute;bottom:16px;left:16px;width:200px;height:150px;border-radius:8px;overflow:hidden;resize:both;border:2px solid rgba(255,255,255,.85);box-shadow:0 2px 10px rgba(0,0,0,.5);z-index:3001;min-width:100px;min-height:80px;max-width:400px;max-height:300px;background:#e8e8e8;"></div>'
          + '<button id="sv-close" style="position:absolute;top:10px;right:10px;z-index:3002;padding:6px 14px;background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600;">✕ 닫기</button>';

        backdrop.onclick = close;

        const panorama = new naver.maps.Panorama(document.getElementById('sv-pano'), {
          position: new naver.maps.LatLng(lat, lng),

        // 파노라마 이동 추적: 화살표로 이동하면 'pano_changed'가 발생한다.
        // 'position_changed'는 setPosition()을 직접 호출할 때만 발생해서, 이것만 듣고 있으면

    let routeOrigin = null, routeDest = null, routeLine = null, routeMode = 'car', originMarker = null, destMarker = null, routeCtrl = null;

        const mbtn = (m, t) => `<button class="rt-mode" data-m="${m}" style="flex:1;font:inherit;font-size:11px;font-weight:600;padding:5px 2px;border:1px solid var(--line);border-radius:6px;background:var(--card);cursor:pointer;color:var(--text);">${t}</button>`;
        div.innerHTML = '<div class="lc-title">길찾기</div>'
          + '<div id="rt-pts" style="font-size:11px;color:var(--muted);margin-bottom:6px;"></div>'
          + `<div style="display:flex;gap:4px;margin-bottom:6px;">${mbtn('walk', '도보')}${mbtn('transit', '대중교통')}${mbtn('car', '자차')}</div>`
          + '<div id="rt-info" style="font-size:11px;color:var(--text);min-height:16px;"></div>'
          + '<button id="rt-clear" style="margin-top:5px;width:100%;font:inherit;font-size:11px;font-weight:600;padding:5px;border:1px solid var(--line);border-radius:6px;background:var(--card);cursor:pointer;color:var(--text);">초기화</button>';
        L.DomEvent.disableClickPropagation(div);
        return div;
      };
      routeCtrl.addTo(map);
      setTimeout(() => {
        document.querySelectorAll('.rt-mode').forEach((b) => b.addEventListener('click', () => { routeMode = b.dataset.m; highlightMode(); drawRoute(); }));
        const c = document.getElementById('rt-clear'); if (c) c.addEventListener('click', clearRoute);
        highlightMode(); updatePts();
      }, 50);
    }
    function highlightMode() { document.querySelectorAll('.rt-mode').forEach((b) => { const on = b.dataset.m === routeMode; b.style.background = on ? 'var(--c-primary)' : 'var(--card)'; b.style.color = on ? '#fff' : 'var(--text)'; b.style.borderColor = on ? 'var(--c-primary)' : 'var(--line)'; }); }
    function updatePts() { const el = document.getElementById('rt-pts'); if (el) el.innerHTML = `출발 ${routeOrigin ? '✓' : '미지정'} · 도착 ${routeDest ? '✓' : '미지정'}`; }
    function setRoutePoint(kind, lat, lng) {
      ensureRouteCtrl();
      if (kind === 'start') { routeOrigin = { lat, lng }; if (originMarker) map.removeLayer(originMarker); originMarker = L.marker([lat, lng]).addTo(map).bindTooltip('출발', { permanent: true, direction: 'top' }); }
      else { routeDest = { lat, lng }; if (destMarker) map.removeLayer(destMarker); destMarker = L.marker([lat, lng]).addTo(map).bindTooltip('도착', { permanent: true, direction: 'top' }); }
      updatePts();
      if (routeOrigin && routeDest) drawRoute();
    }
    function clearRoute() {
      routeOrigin = routeDest = null;
      [routeLine, originMarker, destMarker].forEach((l) => { if (l) map.removeLayer(l); });
      routeLine = originMarker = destMarker = null;
      updatePts(); const info = document.getElementById('rt-info'); if (info) info.textContent = '';
    }
    async function drawRoute() {
      if (!(routeOrigin && routeDest)) return;
      const info = document.getElementById('rt-info'); if (info) info.textContent = '경로 계산 중…';
      if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
      const o = routeOrigin, d = routeDest;
      try {
        if (routeMode === 'transit') {
          const url = `https://api.odsay.com/v1/api/searchPubTransPathT?SX=${o.lng}&SY=${o.lat}&EX=${d.lng}&EY=${d.lat}&apiKey=${encodeURIComponent(ODSAY_KEY)}`;
          const j = await (await fetch(url)).json();
          const p = j.result && j.result.path && j.result.path[0];
          if (!p) { if (info) info.textContent = '대중교통 경로를 찾지 못했어요.'; return; }
          const i = p.info;
          routeLine = L.polyline([[o.lat, o.lng], [d.lat, d.lng]], { color: '#1c7ed6', weight: 4, dashArray: '6,8' }).addTo(map);
          map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });
          const steps = (p.subPath || []).filter((s) => s.trafficType !== 3 || s.sectionTime > 0).map((s) => {
            if (s.trafficType === 3) return `도보 ${s.sectionTime}분`;
            const lane = (s.lane && s.lane[0]) || {};
            const name = s.trafficType === 1 ? (lane.name || '지하철') : (lane.busNo ? lane.busNo + '번 버스' : '버스');
            return `${s.trafficType === 1 ? '지하철' : '버스'} <b>${esc(name)}</b> · ${esc(s.startName)}→${esc(s.endName)} (${s.stationCount}정거장)`;
          });
          if (info) info.innerHTML = `<div style="font-weight:700;margin-bottom:4px;">총 ${i.totalTime}분 · 환승 ${i.busTransitCount + i.subwayTransitCount}회 · ${i.payment.toLocaleString()}원</div><ol style="margin:0 0 2px;padding-left:16px;line-height:1.55;max-width:240px;word-break:keep-all;">${steps.map((x) => `<li>${x}</li>`).join('')}</ol>`;
        } else {
          const url = `https://router.project-osrm.org/route/v1/driving/${o.lng},${o.lat};${d.lng},${d.lat}?overview=full&geometries=geojson`;
          const j = await (await fetch(url)).json();
          const rt = j.routes && j.routes[0];
          if (!rt) { if (info) info.textContent = '경로를 찾지 못했어요.'; return; }
          const coords = rt.geometry.coordinates.map((c) => [c[1], c[0]]);
          const color = routeMode === 'walk' ? '#2f9e44' : '#e8590c';
          routeLine = L.polyline(coords, { color, weight: 5, opacity: 0.8 }).addTo(map);
          map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });
          const km = rt.distance / 1000;
          if (routeMode === 'walk') {
            if (info) info.innerHTML = `도보 약 <b>${Math.round(km / 4.5 * 60)}분</b> · ${km.toFixed(1)}km <span style="color:var(--c-muted);">(4.5km/h 추정)</span>`;
          } else {
            const taxi = Math.round((4800 + Math.max(0, km - 1.6) * 770) / 100) * 100; // 서울 중형 거리 기준 추정(시간요금 제외)
            if (info) info.innerHTML = `자차 약 <b>${Math.round(rt.duration / 60)}분</b> · ${km.toFixed(1)}km<br>예상 택시요금 ≈ <b>${taxi.toLocaleString()}원</b> <span style="color:var(--c-muted);">(거리 기준 추정)</span>`;
          }
