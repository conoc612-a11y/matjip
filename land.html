<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>맛집 탐방 — 부동산 지도</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    :root { --bg:#f4f5f7; --card:#fff; --line:#e6e8eb; --text:#1c1e21; --muted:#8a9099; --accent:#e8590c; --ok:#2f9e44; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif; }
    header { display:flex; justify-content:space-between; align-items:center; padding:12px 16px;
      background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:1000; }
    header h1 { font-size:18px; margin:0; }
    header .right { font-size:13px; color:var(--muted); display:flex; gap:10px; align-items:center; }
    header a, header button { color:var(--accent); background:none; border:none; cursor:pointer; font:inherit; text-decoration:none; }
    .nav-tab { color:var(--muted); padding:6px 10px; border-radius:7px; text-decoration:none; }
    .nav-tab:hover { background:#f1f3f5; }
    .nav-tab.active { background:var(--accent); color:#fff; }
    .profile { position:relative; }
    .profile-menu { position:absolute; right:0; top:calc(100% + 6px); background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 6px 18px rgba(0,0,0,.12); min-width:170px; display:none; z-index:2000; overflow:hidden; }
    .profile-menu.on { display:block; }
    .profile-menu a, .profile-menu button { display:block; width:100%; text-align:left; padding:9px 12px; font:inherit; font-size:13px; color:var(--text); background:none; border:none; border-bottom:1px solid #f1f3f5; cursor:pointer; text-decoration:none; }
    .profile-menu a:hover, .profile-menu button:hover { background:#f1f3f5; }
    .ac-wrap { position:relative; }
    .ac { position:absolute; left:0; right:0; top:100%; background:#fff; border:1px solid var(--accent); border-top:none; border-radius:0 0 8px 8px; z-index:1500; max-height:240px; overflow-y:auto; display:none; box-shadow:0 4px 10px rgba(0,0,0,.08); }
    .ac.on { display:block; }
    .ac-item { padding:8px 12px; font-size:13px; cursor:pointer; display:flex; gap:8px; align-items:center; }
    .ac-item:hover { background:#f1f3f5; }
    .ac-item .t { margin-left:auto; color:var(--muted); font-size:11px; }
    .layout { display:flex; flex-wrap:wrap; }
    #map { flex:7.5 1 380px; height:60vh; min-height:360px; }
    .panel { flex:2.5 1 220px; max-height:60vh; overflow-y:auto; padding:12px 16px; }
    .gps-btn { flex:1; min-width:42px; border:1px solid var(--line); background:#fff; color:var(--accent); border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .gps-btn:hover { border-color:var(--accent); background:#fff4e6; }
    .list-tabs { display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; margin:12px 0; }
    .list-tab { flex:1; font:inherit; font-size:12px; padding:8px; border:none; background:#fff; color:var(--muted); cursor:pointer; }
    .list-tab.active { background:var(--accent); color:#fff; }
    .fav-cats { display:none; gap:6px; flex-wrap:wrap; margin:-4px 0 12px; }
    .fav-cats.on { display:flex; }
    .fav-cat { font:inherit; font-size:12px; padding:5px 12px; border:1px solid var(--line); background:#fff; color:var(--muted); border-radius:16px; cursor:pointer; }
    .fav-cat.active { background:var(--accent); color:#fff; border-color:var(--accent); }
    .banner { background:#fff4e6; border:1px solid #ffd8a8; color:#a85; padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:12px; }
    .banner a { color:var(--accent); font-weight:600; }
    .search-inp { width:100%; font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:8px; margin-bottom:12px; }
    .search-inp:focus { outline:2px solid var(--accent); border-color:var(--accent); }
    .kakao-btn { width:100%; font:inherit; padding:9px; border:1px solid var(--accent); color:var(--accent); background:#fff; border-radius:8px; cursor:pointer; margin-bottom:12px; }
    .kakao-btn:hover { background:var(--accent); color:#fff; }
    .kakao-back { background:none; border:none; color:var(--accent); cursor:pointer; font:inherit; padding:2px 0 10px; }
    .rec { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:10px; cursor:pointer; }
    .rec:hover { border-color:var(--accent); }
    .rec h3 { margin:0 0 4px; font-size:16px; }
    .rec .meta { font-size:12px; color:var(--muted); }
    .rec .tags { margin:8px 0; display:flex; flex-wrap:wrap; gap:6px; }
    .tag { font-size:11px; background:#f1f3f5; border-radius:12px; padding:3px 9px; }
    .tag.hit { background:var(--accent); color:#fff; }
    .rec .why { font-size:12px; color:var(--ok); margin:6px 0; min-height:15px; }
    .rec .actions { display:flex; gap:8px; margin-top:8px; }
    .rec .actions a, .rec .actions button { font-size:13px; padding:6px 10px; border-radius:7px; border:1px solid var(--line); cursor:pointer; background:#fff; color:var(--text); text-decoration:none; }
    .rec .actions .save { background:var(--accent); color:#fff; border:none; }
    .score { float:right; font-size:12px; color:var(--accent); font-weight:700; }
  </style>
</head>
<body>
  <header>
    <a href="land.html" style="text-decoration:none;color:inherit;"><h1 style="cursor:pointer;">부동산 지도 🏙️</h1></a>
    <div class="right">
      <a href="main.html" class="nav-tab">🍜 맛집</a>
      <a href="land.html" class="nav-tab active">🏙️ 부동산</a>
      <div class="profile">
        <button id="profile-btn" class="nav-tab">👤 내 정보 ▾</button>
        <div id="profile-menu" class="profile-menu">
          <a href="#" id="who" style="color:var(--muted);font-size:11px;pointer-events:none;">로그인 안 됨</a>
          <a href="onboarding.html">⚙️ 취향 설정</a>
          <button id="logout" style="display:none;">🚪 로그아웃</button>
        </div>
      </div>
    </div>
  </header>

  <div class="layout">
    <div id="map"></div>
    <div class="panel">
      <div style="display:flex;gap:6px;">
        <div class="ac-wrap" style="flex:9;">
          <input type="text" id="search" class="search-inp" style="margin-bottom:0;" placeholder="🔍 주소·지명 검색 (Enter)" autocomplete="off" />
          <div id="ac" class="ac"></div>
        </div>
        <button id="geo-btn" class="gps-btn" title="내 위치" aria-label="내 위치"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="7"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/></svg></button>
      </div>
      <button id="kakao-btn" class="kakao-btn" style="display:none;">카카오</button>
      <div class="list-tabs">
        <button class="list-tab" data-mode="favorites">⭐ 즐겨찾기</button>
        <button class="list-tab active" data-mode="agents">🏢 인근 공인중개사 정보</button>
      </div>
      <div class="fav-cats" id="fav-cats">
        <button class="fav-cat active" data-cat="전체">전체</button>
        <button class="fav-cat" data-cat="아파트">아파트</button>
        <button class="fav-cat" data-cat="다세대">다세대</button>
        <button class="fav-cat" data-cat="다가구">다가구</button>
        <button class="fav-cat" data-cat="단독주택">단독주택</button>
      </div>
      <div class="banner" id="banner"></div>
      <div id="rec-list"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://bhgijvaxxjnocgfnaaeu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_rYaGd3kk5UuFBe3TSpFA8g_uGHWwkqM';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const $ = (id) => document.getElementById(id);

    // ── V-World 인증키: 발급받으면 아래에 넣으세요. 비어 있으면 OSM 지도로 자동 대체 ──
    const VWORLD_KEY = 'B2CDEEDD-D622-311B-883B-CC7890E50822';

    // ── 카카오 실시간 장소검색 (REST API, 도메인 등록 불필요) ──
    const KAKAO_JS_KEY = '725e7ddf965a3ffff3da1f2ac771cc57'; // developers.kakao.com 앱 > 앱키 > JavaScript 키 (Web 도메인 등록 필요). 비우면 버튼 숨김.
    let kakaoReady = false, kakaoMarkers = [];
    if (KAKAO_JS_KEY) {
      const ks = document.createElement('script');
      ks.src = `//dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_JS_KEY}&libraries=services&autoload=false`;
      ks.onload = () => window.kakao && kakao.maps.load(() => { kakaoReady = true; });
      document.head.appendChild(ks);
    }
    function clearKakaoMarkers() { kakaoMarkers.forEach((m) => map.removeLayer(m)); kakaoMarkers = []; }

    // ── 지도 초기화 (서울 중심) ──
    const map = L.map('map').setView([37.5665, 126.9780], 12);
    // V-World 다중 배경지도 (일반/항공영상/하이브리드) — S-Map 유사 룩.
    // Satellite는 jpeg, Base·Hybrid는 png (실측 확인). 우측 상단 레이어에서 전환.
    const vTile = (layer, ext) => L.tileLayer(
      `https://api.vworld.kr/req/wmts/1.0.0/${VWORLD_KEY}/${layer}/{z}/{y}/{x}.${ext}`,
      { maxZoom: 19, attribution: '© V-World' });
    const osmBase = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      { maxZoom: 19, attribution: '© OpenStreetMap' });
    const baseLayers = VWORLD_KEY ? {
      '🗺️ 일반지도': vTile('Base', 'png'),
      '🛰️ 항공영상': vTile('Satellite', 'jpeg'),
      '🏙️ 항공+라벨': L.layerGroup([vTile('Satellite', 'jpeg'), vTile('Hybrid', 'png')]),
      'OSM(대체)': osmBase,
    } : { 'OSM': osmBase };
    const defaultBase = baseLayers['🗺️ 일반지도'] || baseLayers['OSM'];
    defaultBase.addTo(map);
    // 기본(일반지도) 타일 실패 시 OSM 자동 대체
    if (VWORLD_KEY) { let fell = false; defaultBase.on('tileerror', () => { if (!fell) { fell = true; map.removeLayer(defaultBase); osmBase.addTo(map); } }); }

    // ── [토지 레이어] V-World 국토·토지정보 오버레이 (토글) ─────────────────
    // 근거: V-World 공개 WMS(api.vworld.kr) / 서울 토지정보 land.seoul.go.kr.
    // 우측 상단 레이어 버튼에서 켜고 '줌인'하면 필지·용도지역이 색으로 표시됩니다.
    // (광역 줌에서는 비어 보일 수 있음 — 지적/용도지역은 확대해야 그려짐.)
    if (VWORLD_KEY) {
      // 주의: STYLES는 넘기지 않는다 — Leaflet 기본값(styles:'')이 이미 있어,
      // 중복 지정하면 'STYLES=&STYLES='가 되어 V-World가 타일을 거부한다(빈 화면 원인).
      const wms = (layers, opacity) => L.tileLayer.wms('https://api.vworld.kr/req/wms', {
        layers, format: 'image/png', transparent: true, version: '1.3.0', uppercase: true,
        KEY: VWORLD_KEY, DOMAIN: location.origin,
        opacity, attribution: '© V-World', maxZoom: 19,
      });
      // 레이어 코드는 V-World 공식 WMS 가이드에서 확인함(추측 아님).
      // 일부(그린벨트·진흥지구)는 도심 중앙엔 데이터가 없어 외곽에서 보임 — 정상.
      // 토지거래허가구역(동 단위 근사) — 지정 동 경계 GeoJSON 색칠. 정확·최신은 land.seoul.go.kr.
      const tojiLayer = L.geoJSON(null, {
        style: { color: '#c92a2a', weight: 1, fillColor: '#e8590c', fillOpacity: 0.28 },
        onEachFeature: (f, layer) => layer.bindTooltip(`🚫 토지거래허가구역 · ${f.properties.name}`, { sticky: true }),
      });
      fetch('toji_heoga.geojson').then((r) => r.json()).then((gj) => tojiLayer.addData(gj)).catch(() => {});

      // ── 아파트 실거래가·노후도 (서울+경기 9천여 단지) : 필터 + 범례 + 카드 팝업 ──
      const ageColor = (b) => { const y = parseInt(b) || 0; return !y ? '#868e96' : y >= 2015 ? '#2f9e44' : y >= 2005 ? '#94d82d' : y >= 1995 ? '#fab005' : y >= 1985 ? '#fd7e14' : '#e03131'; };
      const realpriceCluster = L.markerClusterGroup({ chunkedLoading: true, maxClusterRadius: 60 });
      rpRows = null;
      const rpFilter = { price: 'all', age: 'all' };
      const inPrice = (p) => { if (rpFilter.price === 'all') return true; if (p == null) return false; const v = Number(p); return rpFilter.price === 'u10' ? v < 10 : rpFilter.price === '10_20' ? (v >= 10 && v < 20) : rpFilter.price === '20_30' ? (v >= 20 && v < 30) : v >= 30; };
      const inAge = (b) => { if (rpFilter.age === 'all') return true; const y = parseInt(b) || 0; return rpFilter.age === 'new' ? y >= 2015 : rpFilter.age === 'mid' ? (y >= 2000 && y < 2015) : (y > 0 && y < 2000); };
      function rpBuild() {
        if (!rpRows) return;
        realpriceCluster.clearLayers();
        realpriceCluster.addLayers(rpRows.filter((d) => inPrice(d.priceEok) && inAge(d.build)).map((d) => {
          const m = L.circleMarker([d.lat, d.lng], { radius: 5, color: '#fff', weight: 1, fillColor: ageColor(d.build), fillOpacity: 0.9 });
          m._rp = d;
          m.bindTooltip(d.priceEok == null ? d.name : d.priceEok + '억', { direction: 'top' });
          m.bindPopup(`<div style="min-width:180px;"><div style="font-weight:700;font-size:14px;">${d.name}</div><div style="font-size:12px;color:#8a9099;margin:2px 0 6px;">${d.gu} ${d.dong}</div><div style="font-size:15px;font-weight:700;color:#e8590c;">💰 실거래가 ${d.priceEok == null ? '-' : d.priceEok + '억'}</div><div style="font-size:12px;margin-top:3px;">${d.area}㎡ · ${d.floor}층 · 거래 ${d.ymd}</div><div style="font-size:12px;margin-top:4px;"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${ageColor(d.build)};margin-right:5px;"></span>🏗️ ${d.build || '?'}년 건축</div><button class="rp-save" style="margin-top:8px;width:100%;padding:7px;border:1px solid #e8590c;background:#fff;color:#e8590c;border-radius:7px;cursor:pointer;font:inherit;font-size:13px;">☆ 저장</button><div style="display:flex;gap:6px;margin-top:6px;"><button class="rt-start" style="flex:1;padding:6px;border:1px solid #e6e8eb;border-radius:6px;background:#fff;cursor:pointer;font:inherit;font-size:12px;">🚩 출발</button><button class="rt-end" style="flex:1;padding:6px;border:1px solid #e6e8eb;border-radius:6px;background:#fff;cursor:pointer;font:inherit;font-size:12px;">🏁 도착</button></div></div>`);
          return m;
        }));
      }
      const rpFilterCtrl = L.control({ position: 'topleft' });
      rpFilterCtrl.onAdd = () => {
        const div = L.DomUtil.create('div');
        div.style.cssText = 'background:#fff;padding:8px 10px;border-radius:8px;box-shadow:0 1px 5px rgba(0,0,0,.2);font-size:12px;';
        div.innerHTML = '<div style="font-weight:700;margin-bottom:5px;">🏢 실거래가 필터</div>'
          + '<label style="display:block;margin-bottom:4px;">실거래가 <select id="rp-price" style="font:inherit;font-size:12px;"><option value="all">전체</option><option value="u10">10억 이하</option><option value="10_20">10~20억</option><option value="20_30">20~30억</option><option value="o30">30억+</option></select></label>'
          + '<label style="display:block;">건축년도 <select id="rp-age" style="font:inherit;font-size:12px;"><option value="all">전체</option><option value="new">2015~ 신축</option><option value="mid">2000~2014</option><option value="old">2000 이전</option></select></label>';
        L.DomEvent.disableClickPropagation(div);
        return div;
      };
      const rpLegend = L.control({ position: 'bottomright' });
      rpLegend.onAdd = () => {
        const div = L.DomUtil.create('div');
        div.style.cssText = 'background:rgba(255,255,255,.94);padding:8px 10px;border-radius:8px;box-shadow:0 1px 5px rgba(0,0,0,.15);font-size:11px;line-height:1.6;';
        const row = (c, t) => `<div><span style="display:inline-block;width:10px;height:10px;background:${c};border-radius:50%;margin-right:5px;"></span>${t}</div>`;
        div.innerHTML = '<div style="font-weight:700;margin-bottom:3px;">건축년도(노후도)</div>' + row('#2f9e44', '신축 2015~') + row('#94d82d', '2005~') + row('#fab005', '1995~') + row('#fd7e14', '1985~') + row('#e03131', '노후 ~1985');
        return div;
      };
      map.on('overlayadd', (e) => {
        if (e.layer !== realpriceCluster) return;
        rpFilterCtrl.addTo(map); rpLegend.addTo(map);
        setTimeout(() => {
          const ps = document.getElementById('rp-price'), ag = document.getElementById('rp-age');
          if (ps && !ps._w) { ps._w = 1; ps.value = rpFilter.price; ps.addEventListener('change', () => { rpFilter.price = ps.value; rpBuild(); }); }
          if (ag && !ag._w) { ag._w = 1; ag.value = rpFilter.age; ag.addEventListener('change', () => { rpFilter.age = ag.value; rpBuild(); }); }
        }, 60);
        if (rpRows) return;
        fetch('realprice_seoul_gg.json').then((r) => r.json()).then((rows) => { rpRows = rows; rpBuild(); }).catch(() => {});
      });
      map.on('overlayremove', (e) => { if (e.layer === realpriceCluster) { map.removeControl(rpFilterCtrl); map.removeControl(rpLegend); } });

      // 실거래가 마커 팝업의 ☆저장 버튼 → localStorage 즐겨찾기 토글
      map.on('popupopen', (e) => {
        const m = e.popup._source;
        if (!m || !m._rp) return;
        const node = e.popup._contentNode || e.popup.getElement();
        const btn = node && node.querySelector('.rp-save');
        if (!btn) return;
        const d = m._rp;
        const paint = () => {
          const on = isPropSaved(d);
          btn.textContent = on ? '⭐ 저장됨 (해제)' : '☆ 저장';
          btn.style.background = on ? '#e8590c' : '#fff';
          btn.style.color = on ? '#fff' : '#e8590c';
        };
        paint();
        btn.onclick = () => { togglePropSave(d); paint(); if (landMode === 'favorites') render(); };
        const sBtn = node.querySelector('.rt-start'), eBtn = node.querySelector('.rt-end');
        if (sBtn) sBtn.onclick = () => { setRoutePoint('start', d.lat, d.lng); m.closePopup(); };
        if (eBtn) eBtn.onclick = () => { setRoutePoint('end', d.lat, d.lng); m.closePopup(); };
      });

      const landOverlays = {
        '🏢 아파트 실거래가·노후도': realpriceCluster,
        '🚫 토지거래허가구역': tojiLayer,
        '🗺️ 용도지역': wms('lt_c_uq111', 0.55),
        '📐 지적도(필지 경계)': wms('lp_pa_cbnd_bubun', 0.6),
        '🌳 개발제한구역(그린벨트)': wms('lt_c_ud801', 0.5),
        '🏗️ 개발진흥지구': wms('lt_c_uq129', 0.5),
        '📦 택지·사업지구': wms('lt_c_lhzone', 0.5),
      };
      L.control.layers(baseLayers, landOverlays, { collapsed: true, position: 'topright' }).addTo(map);
    }

    // ── [V-World 검색 API] 주소·지명 검색 → 지도 이동 (JSONP로 브라우저 CORS 회피) ──
    let vsMarker = null;
    function vworldSearch(q, type) {
      if (!q) return;
      const cb = '__vw_' + Date.now();
      const clean = () => { try { delete window[cb]; } catch (e) {} };
      window[cb] = (data) => {
        clean();
        const items = (data.response && data.response.result && data.response.result.items) || [];
        if (!items.length) {
          if (type === 'place') { vworldSearch(q, 'address'); return; } // 장소 없으면 주소로 재검색
          alert('검색 결과가 없어요: ' + q); return;
        }
        const it = items[0], x = Number(it.point.x), y = Number(it.point.y);
        map.setView([y, x], 16);
        if (vsMarker) map.removeLayer(vsMarker);
        vsMarker = L.marker([y, x]).addTo(map).bindPopup(`<b>${it.title || q}</b>`).openPopup();
      };
      const s = document.createElement('script');
      s.src = `https://api.vworld.kr/req/search?service=search&request=search&version=2.0&crs=EPSG:4326&size=5&page=1&query=${encodeURIComponent(q)}&type=${type}&format=json&key=${VWORLD_KEY}&callback=${cb}`;
      s.onerror = clean;
      document.head.appendChild(s);
    }
    // 검색 통합: 식당 필터는 #search 입력, 주소·지명 이동은 #search Enter로 처리(아래 참조).

    const markers = {}; // id -> marker
    let restaurants = [];
    let taste = null;
    let user = null;
    let query = '';
    let rpRows = null;  // 실거래가 원본 (실거래가 레이어 켜면 로드됨) — 지도 클릭 정보에서 참조

    // ── V-World 역지오코딩 (좌표→주소, JSONP CORS 회피) ──
    function reverseGeocode(lat, lng, cb) {
      const name = '__vwrev_' + Math.floor(lat * 1e6) + '_' + Math.floor(lng * 1e6);
      window[name] = (data) => {
        try { delete window[name]; } catch (e) {}
        let addr = '';
        try { const r = data.response.result; addr = (r && r[0] && r[0].text) || ''; } catch (e) {}
        cb(addr);
      };
      const s = document.createElement('script');
      s.src = `https://api.vworld.kr/req/address?service=address&request=getAddress&version=2.0&crs=epsg:4326&point=${lng},${lat}&format=json&type=both&key=${VWORLD_KEY}&callback=${name}`;
      s.onerror = () => { try { delete window[name]; } catch (e) {} cb(''); };
      document.head.appendChild(s);
    }

    // ── 지도 클릭 → 위치 정보(주소 + 근처 실거래가) 표시 ──
    let clickMarker = null;
    map.on('click', (e) => {
      const { lat, lng } = e.latlng;
      if (clickMarker) map.removeLayer(clickMarker);
      clickMarker = L.marker([lat, lng]).addTo(map).bindPopup('📍 위치 정보 불러오는 중…').openPopup();
      // 근처 실거래가(0.7km 내 건수 + 최근접 단지) — 레이어를 켜서 rpRows가 로드된 경우만
      let nearHtml = '';
      if (rpRows && rpRows.length) {
        const kmDist = (a, b, c, d) => { const dx = (a - c) * 111, dy = (b - d) * 88; return Math.sqrt(dx * dx + dy * dy); };
        let best = null, bd = 1e9, cnt = 0;
        rpRows.forEach((r) => { if (r.lat == null) return; const dist = kmDist(lat, lng, r.lat, r.lng); if (dist < 0.7) cnt++; if (dist < bd) { bd = dist; best = r; } });
        if (best && bd < 1.5) nearHtml = `<div style="font-size:12px;margin-top:6px;border-top:1px solid #eee;padding-top:6px;">🏢 반경 700m 실거래 <b>${cnt}건</b><br>최근접: <b>${esc(best.name)}</b> ${best.priceEok == null ? '' : best.priceEok + '억'} · ${esc(best.build || '?')}년</div>`;
      }
      reverseGeocode(lat, lng, (addr) => {
        if (!clickMarker) return;
        const rtBtns = `<div style="display:flex;gap:6px;margin-top:8px;"><button class="rt-start" style="flex:1;padding:6px;border:1px solid #e6e8eb;border-radius:6px;background:#fff;cursor:pointer;font:inherit;font-size:12px;">🚩 출발</button><button class="rt-end" style="flex:1;padding:6px;border:1px solid #e6e8eb;border-radius:6px;background:#fff;cursor:pointer;font:inherit;font-size:12px;">🏁 도착</button></div>`;
        clickMarker.setPopupContent(`<div style="min-width:190px;"><div style="font-weight:700;">📍 클릭 위치</div><div style="font-size:12px;color:#555;margin:3px 0;">${addr ? esc(addr) : '주소를 찾지 못했어요'}</div><div style="font-size:11px;color:#999;">${lat.toFixed(5)}, ${lng.toFixed(5)}</div>${nearHtml}${rtBtns}</div>`).openPopup();
        const el = clickMarker.getPopup().getElement();
        const sBtn = el && el.querySelector('.rt-start'), eBtn = el && el.querySelector('.rt-end');
        if (sBtn) sBtn.onclick = () => { setRoutePoint('start', lat, lng); clickMarker.closePopup(); };
        if (eBtn) eBtn.onclick = () => { setRoutePoint('end', lat, lng); clickMarker.closePopup(); };
      });
    });

    // ── 길찾기: 출발/도착 + 도보(OSRM)·대중교통(ODsay)·자차(OSRM) ──
    const ODSAY_KEY = 'H4Vo/z04g/E+AUShnTQIiQ';
    let routeOrigin = null, routeDest = null, routeLine = null, routeMode = 'car', originMarker = null, destMarker = null, routeCtrl = null;
    function ensureRouteCtrl() {
      if (routeCtrl) return;
      routeCtrl = L.control({ position: 'topleft' });
      routeCtrl.onAdd = () => {
        const div = L.DomUtil.create('div');
        div.style.cssText = 'background:#fff;padding:8px 10px;border-radius:8px;box-shadow:0 1px 5px rgba(0,0,0,.2);font-size:12px;min-width:160px;';
        const mbtn = (m, t) => `<button class="rt-mode" data-m="${m}" style="flex:1;font:inherit;font-size:11px;padding:4px 2px;border:1px solid #e6e8eb;border-radius:6px;background:#fff;cursor:pointer;">${t}</button>`;
        div.innerHTML = '<div style="font-weight:700;margin-bottom:5px;">🧭 길찾기</div>'
          + '<div id="rt-pts" style="font-size:11px;color:#555;margin-bottom:5px;"></div>'
          + `<div style="display:flex;gap:4px;margin-bottom:5px;">${mbtn('walk', '🚶도보')}${mbtn('transit', '🚌대중교통')}${mbtn('car', '🚗자차')}</div>`
          + '<div id="rt-info" style="font-size:11px;color:#333;min-height:16px;"></div>'
          + '<button id="rt-clear" style="margin-top:5px;width:100%;font:inherit;font-size:11px;padding:4px;border:1px solid #e6e8eb;border-radius:6px;background:#fff;cursor:pointer;">초기화</button>';
        L.DomEvent.disableClickPropagation(div);
        return div;
      };
      routeCtrl.addTo(map);
      setTimeout(() => {
        document.querySelectorAll('.rt-mode').forEach((b) => b.addEventListener('click', () => { routeMode = b.dataset.m; highlightMode(); drawRoute(); }));
        const c = document.getElementById('rt-clear'); if (c) c.addEventListener('click', clearRoute);
        highlightMode(); updatePts();
      }, 50);
    }
    function highlightMode() { document.querySelectorAll('.rt-mode').forEach((b) => { const on = b.dataset.m === routeMode; b.style.background = on ? '#e8590c' : '#fff'; b.style.color = on ? '#fff' : '#333'; }); }
    function updatePts() { const el = document.getElementById('rt-pts'); if (el) el.innerHTML = `🚩 ${routeOrigin ? '출발✓' : '출발 미지정'} · 🏁 ${routeDest ? '도착✓' : '도착 미지정'}`; }
    function setRoutePoint(kind, lat, lng) {
      ensureRouteCtrl();
      if (kind === 'start') { routeOrigin = { lat, lng }; if (originMarker) map.removeLayer(originMarker); originMarker = L.marker([lat, lng]).addTo(map).bindTooltip('🚩 출발', { permanent: true, direction: 'top' }); }
      else { routeDest = { lat, lng }; if (destMarker) map.removeLayer(destMarker); destMarker = L.marker([lat, lng]).addTo(map).bindTooltip('🏁 도착', { permanent: true, direction: 'top' }); }
      updatePts();
      if (routeOrigin && routeDest) drawRoute();
    }
    function clearRoute() {
      routeOrigin = routeDest = null;
      [routeLine, originMarker, destMarker].forEach((l) => { if (l) map.removeLayer(l); });
      routeLine = originMarker = destMarker = null;
      updatePts(); const info = document.getElementById('rt-info'); if (info) info.textContent = '';
    }
    async function drawRoute() {
      if (!(routeOrigin && routeDest)) return;
      const info = document.getElementById('rt-info'); if (info) info.textContent = '경로 계산 중…';
      if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
      const o = routeOrigin, d = routeDest;
      try {
        if (routeMode === 'transit') {
          const url = `https://api.odsay.com/v1/api/searchPubTransPathT?SX=${o.lng}&SY=${o.lat}&EX=${d.lng}&EY=${d.lat}&apiKey=${encodeURIComponent(ODSAY_KEY)}`;
          const j = await (await fetch(url)).json();
          const p = j.result && j.result.path && j.result.path[0];
          if (!p) { if (info) info.textContent = '대중교통 경로를 찾지 못했어요.'; return; }
          const i = p.info;
          routeLine = L.polyline([[o.lat, o.lng], [d.lat, d.lng]], { color: '#1c7ed6', weight: 4, dashArray: '6,8' }).addTo(map);
          map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });
          if (info) info.innerHTML = `🚌 총 <b>${i.totalTime}분</b> · ${(i.totalDistance / 1000).toFixed(1)}km<br>환승 ${i.busTransitCount + i.subwayTransitCount}회 · 요금 ${i.payment}원`;
        } else {
          const url = `https://router.project-osrm.org/route/v1/driving/${o.lng},${o.lat};${d.lng},${d.lat}?overview=full&geometries=geojson`;
          const j = await (await fetch(url)).json();
          const rt = j.routes && j.routes[0];
          if (!rt) { if (info) info.textContent = '경로를 찾지 못했어요.'; return; }
          const coords = rt.geometry.coordinates.map((c) => [c[1], c[0]]);
          const color = routeMode === 'walk' ? '#2f9e44' : '#e8590c';
          routeLine = L.polyline(coords, { color, weight: 5, opacity: 0.8 }).addTo(map);
          map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });
          const km = rt.distance / 1000;
          const min = routeMode === 'walk' ? Math.round(km / 4.5 * 60) : Math.round(rt.duration / 60);
          if (info) info.innerHTML = `${routeMode === 'walk' ? '🚶 도보' : '🚗 자차'} 약 <b>${min}분</b> · ${km.toFixed(1)}km${routeMode === 'walk' ? '<br><span style="color:#999;">(도보 4.5km/h 추정)</span>' : ''}`;
        }
      } catch (e) { if (info) info.textContent = '경로 계산 실패(네트워크).'; }
    }

    // ── 규칙기반 추천 점수 ──
    function score(r) {
      if (!taste) return { score: 0, hits: [] };
      const want = new Set([...(taste.flavor_tags || []), ...(taste.situation_tags || [])]);
      const hits = [];
      let s = 0;
      (r.tags || []).forEach((t) => { if (want.has(t)) { s += 2; hits.push(t); } });
      const spicy = taste.spicy_level ?? 2;
      if (spicy >= 3 && (r.tags || []).includes('매콤') && !hits.includes('매콤')) { s += 2; hits.push('매콤'); }
      if (spicy <= 1 && (r.tags || []).includes('담백') && !hits.includes('담백')) { s += 2; hits.push('담백'); }
      return { score: s, hits };
    }

    function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

    let landMode = 'agents';   // 'agents'(인근 공인중개사) | 'favorites'(부동산 즐겨찾기)
    const savedIds = new Set();
    let propCat = '전체';       // 부동산 즐겨찾기 유형 필터

    // ── 부동산 ⭐저장 (이 기기 localStorage에 보관) ──
    const PROP_KEY = 'mj_saved_props';
    function loadSavedProps() { try { return JSON.parse(localStorage.getItem(PROP_KEY) || '[]'); } catch (e) { return []; } }
    function saveSavedProps(a) { try { localStorage.setItem(PROP_KEY, JSON.stringify(a)); } catch (e) {} }
    function propId(d) { return `${d.name}|${d.dong}|${d.ymd}|${d.area}|${d.floor}`; }
    function isPropSaved(d) { const id = propId(d); return loadSavedProps().some((x) => x.id === id); }
    function togglePropSave(d) {
      let a = loadSavedProps();
      const id = propId(d);
      if (a.some((x) => x.id === id)) a = a.filter((x) => x.id !== id);
      else a.push({ id, name: d.name, gu: d.gu, dong: d.dong, lat: d.lat, lng: d.lng, priceEok: d.priceEok, area: d.area, floor: d.floor, ymd: d.ymd, build: d.build, type: d.type || '아파트' });
      saveSavedProps(a);
    }

    function render() {
      if (landMode === 'agents') { renderAgents(); return; }
      renderFavProps();
    }

    // ── 부동산 즐겨찾기 목록 (localStorage) ──
    function renderFavProps() {
      Object.values(markers).forEach((m) => map.removeLayer(m));
      agentMarkers.forEach((m) => map.removeLayer(m)); agentMarkers = [];
      let list = loadSavedProps();
      if (propCat !== '전체') list = list.filter((x) => (x.type || '아파트') === propCat);
      $('banner').textContent = '⭐ 저장한 부동산 목록이에요. (이 기기에 보관 · 실거래가 마커의 ☆저장 버튼으로 추가)';

      $('rec-list').innerHTML = list.length ? list.map((d, i) => `
        <div class="rec" data-i="${i}">
          <span class="score">${d.priceEok == null ? '' : d.priceEok + '억'}</span>
          <h3>${esc(d.name)}</h3>
          <div class="meta">${esc(d.gu || '')} ${esc(d.dong || '')} · ${esc(d.area || '?')}㎡ · ${esc(d.floor || '?')}층</div>
          <div class="tags"><span class="tag">${esc(d.type || '아파트')}</span><span class="tag">🏗️ ${esc(d.build || '?')}년</span><span class="tag">거래 ${esc(d.ymd || '')}</span></div>
          <div class="actions">
            <button class="unsave" data-i="${i}">⭐ 저장 해제</button>
          </div>
        </div>`).join('')
        : '<div style="text-align:center;color:var(--muted);padding:24px 0;">저장한 부동산이 없어요.<br>지도의 「🏢 아파트 실거래가」 마커를 클릭해 ☆저장을 눌러보세요.</div>';

      list.forEach((d) => {
        if (d.lat == null || d.lng == null) return;
        const m = L.circleMarker([d.lat, d.lng], { radius: 7, color: '#fff', weight: 2, fillColor: '#e8590c', fillOpacity: 0.95 }).addTo(map)
          .bindPopup(`<b>${esc(d.name)}</b><br>${esc(d.gu || '')} ${esc(d.dong || '')}<br>💰 ${d.priceEok == null ? '-' : d.priceEok + '억'}`);
        markers[d.id] = m;
      });
      const pts = list.map((d) => (d.lat != null ? [d.lat, d.lng] : null)).filter(Boolean);
      if (pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 15 });

      $('rec-list').querySelectorAll('.rec').forEach((card) => card.addEventListener('click', (e) => {
        if (e.target.closest('.actions')) return;
        const d = list[Number(card.dataset.i)];
        if (d && d.lat != null) { map.setView([d.lat, d.lng], 16); markers[d.id]?.openPopup(); }
      }));
      $('rec-list').querySelectorAll('.unsave').forEach((btn) => btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const d = list[Number(btn.dataset.i)];
        togglePropSave(d); render();
      }));
    }

    // ── 인근 공인중개사 (카카오 장소검색, 지도 중심 반경) ──
    let agentMarkers = [];
    function renderAgents() {
      Object.values(markers).forEach((m) => map.removeLayer(m));
      agentMarkers.forEach((m) => map.removeLayer(m)); agentMarkers = [];
      if (!(window.kakao && kakao.maps && kakao.maps.services)) { $('rec-list').innerHTML = '<div style="text-align:center;color:var(--muted);padding:24px 0;">장소검색 로딩 중…</div>'; setTimeout(() => { if (landMode === 'agents') renderAgents(); }, 900); return; }
      $('banner').textContent = '🏢 지도 중심 인근 공인중개사예요. 지도를 옮기고 📍버튼으로 갱신하세요.';
      const c = map.getCenter();
      new kakao.maps.services.Places().keywordSearch('공인중개사', (data, status) => {
        if (status !== kakao.maps.services.Status.OK || !data.length) { $('rec-list').innerHTML = '<div style="text-align:center;color:var(--muted);padding:24px 0;">인근 공인중개사가 없어요. 지도를 옮겨보세요.</div>'; return; }
        $('rec-list').innerHTML = data.map((p, i) => `<div class="rec" data-i="${i}"><h3>${esc(p.place_name)}</h3><div class="meta">${esc((p.category_name || '').split('>').pop().trim())} · ${esc(p.road_address_name || p.address_name || '')}</div><div class="actions">${p.phone ? `<a href="tel:${esc(p.phone)}">📞 ${esc(p.phone)}</a>` : ''}${p.place_url ? `<a href="${p.place_url}" target="_blank" rel="noopener">카카오맵</a>` : ''}</div></div>`).join('');
        data.forEach((p) => { const m = L.marker([Number(p.y), Number(p.x)]).addTo(map).bindPopup(`<b>${esc(p.place_name)}</b><br>${esc(p.phone || '')}`); agentMarkers.push(m); });
        $('rec-list').querySelectorAll('.rec').forEach((card) => card.addEventListener('click', (e) => { if (e.target.closest('.actions')) return; const p = data[Number(card.dataset.i)]; map.setView([Number(p.y), Number(p.x)], 17); }));
      }, { location: new kakao.maps.LatLng(c.lat, c.lng), radius: 3000, sort: kakao.maps.services.SortBy.DISTANCE, size: 15 });
    }
    // 목록 탭 전환 + GPS
    document.querySelectorAll('.list-tab').forEach((t) => t.addEventListener('click', () => {
      document.querySelectorAll('.list-tab').forEach((x) => x.classList.remove('active'));
      t.classList.add('active'); landMode = t.dataset.mode;
      $('fav-cats').classList.toggle('on', landMode === 'favorites');
      render();
    }));
    document.querySelectorAll('.fav-cat').forEach((c) => c.addEventListener('click', () => {
      document.querySelectorAll('.fav-cat').forEach((x) => x.classList.remove('active'));
      c.classList.add('active'); propCat = c.dataset.cat; render();
    }));
    $('geo-btn').addEventListener('click', () => {
      if (!navigator.geolocation) { alert('이 브라우저는 위치를 지원하지 않아요.'); return; }
      $('geo-btn').style.opacity = '.5';
      navigator.geolocation.getCurrentPosition((pos) => { $('geo-btn').style.opacity = ''; map.setView([pos.coords.latitude, pos.coords.longitude], 15); if (landMode === 'agents') renderAgents(); }, () => { $('geo-btn').style.opacity = ''; alert('위치 권한이 필요해요.'); });
    });

    // ── 데이터 로드 ──
    async function loadAll() {
      const { data: { session } } = await sb.auth.getSession();
      user = session ? session.user : null;
      if (user) {
        $('who').textContent = user.email;
        $('logout').style.display = '';
        const { data: t } = await sb.from('taste_profiles').select('*').eq('user_id', user.id).maybeSingle();
        taste = t || null;
        const { data: sv } = await sb.from('saved_restaurants').select('restaurant_id').eq('user_id', user.id);
        savedIds.clear(); (sv || []).forEach((s) => savedIds.add(Number(s.restaurant_id)));
      }
      const { data: rs } = await sb.from('mj_restaurants').select('*');
      restaurants = rs || [];
      render();
    }

    $('logout').addEventListener('click', async () => { await sb.auth.signOut(); location.href = 'index.html'; });
    $('profile-btn').addEventListener('click', (e) => { e.stopPropagation(); $('profile-menu').classList.toggle('on'); });
    document.addEventListener('click', () => $('profile-menu').classList.remove('on'));
    $('search').addEventListener('input', (e) => { query = e.target.value; if (landMode === 'favorites') render(); renderAC(); });
    $('search').addEventListener('keydown', (e) => { if (e.key === 'Enter') { $('ac').className = 'ac'; vworldSearch($('search').value.trim(), 'place'); } });
    $('search').addEventListener('blur', () => setTimeout(() => { $('ac').className = 'ac'; }, 150));
    function renderAC() {
      const raw = $('search').value.trim(), q = raw.toLowerCase(), ac = $('ac');
      if (!q) { ac.className = 'ac'; ac.innerHTML = ''; return; }
      const rs = restaurants.filter((r) => `${r.name} ${(r.tags || []).join(' ')}`.toLowerCase().includes(q)).slice(0, 6);
      ac.innerHTML = rs.map((r) => `<div class="ac-item" data-id="${r.id}"><span>🍜</span>${esc(r.name)}<span class="t">식당</span></div>`).join('')
        + `<div class="ac-item" data-place="1"><span>📍</span>'${esc(raw)}' 위치로 이동<span class="t">지명</span></div>`;
      ac.className = 'ac on';
      ac.querySelectorAll('.ac-item').forEach((it) => it.addEventListener('mousedown', (ev) => {
        ev.preventDefault();
        if (it.dataset.place) { vworldSearch(raw, 'place'); }
        else { const r = restaurants.find((x) => x.id == it.dataset.id); if (r && r.lat != null) map.setView([r.lat, r.lng], 16); $('search').value = r ? r.name : raw; query = $('search').value; render(); }
        ac.className = 'ac';
      }));
    }

    // ── 카카오 검색 (지도 SDK · services.Places) ──
    if (!KAKAO_JS_KEY) $('kakao-btn').style.display = 'none';
    $('kakao-btn').addEventListener('click', runKakaoSearch);

    function runKakaoSearch() {
      const q = $('search').value.trim();
      if (!q) { alert('검색어를 입력해 주세요.'); return; }
      if (!kakaoReady) { alert('장소검색 로딩 중… 잠시 후 다시 눌러 주세요.'); return; }
      $('kakao-btn').disabled = true;
      $('kakao-btn').textContent = '검색 중…';
      const ps = new kakao.maps.services.Places();
      ps.keywordSearch(q, (data, status) => {
        $('kakao-btn').disabled = false;
        $('kakao-btn').textContent = '🔎 카카오에서 실제 식당 검색';
        renderKakao(status === kakao.maps.services.Status.OK ? data : []);
      }, { category_group_code: 'FD6', size: 15 });
    }

    function renderKakao(data) {
      Object.values(markers).forEach((m) => map.removeLayer(m));
      clearKakaoMarkers();
      const back = '<button class="kakao-back" id="kakao-back">← 추천 목록으로</button>';
      if (!data.length) {
        $('rec-list').innerHTML = back + '<div style="text-align:center;color:var(--muted);padding:24px 0;">카카오 검색 결과가 없어요.</div>';
        $('kakao-back').addEventListener('click', render); return;
      }
      $('rec-list').innerHTML = back + data.map((p, i) => `
        <div class="rec" data-i="${i}">
          <h3>${esc(p.place_name)}</h3>
          <div class="meta">${esc((p.category_name || '').split('>').pop().trim())} · ${esc(p.road_address_name || p.address_name || '')}</div>
          <div class="actions">
            <button class="save ksave" data-i="${i}">내 목록에 저장</button>
            ${p.place_url ? `<a href="${p.place_url}" target="_blank" rel="noopener">카카오맵</a>` : ''}
          </div>
        </div>`).join('');
      const pts = [];
      data.forEach((p) => {
        const m = L.marker([Number(p.y), Number(p.x)]).addTo(map).bindPopup(`<b>${esc(p.place_name)}</b>`);
        kakaoMarkers.push(m); pts.push([Number(p.y), Number(p.x)]);
      });
      if (pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 16 });
      $('kakao-back').addEventListener('click', render);
      $('rec-list').querySelectorAll('.rec').forEach((card) => card.addEventListener('click', (e) => {
        if (e.target.closest('.actions')) return;
        const p = data[Number(card.dataset.i)]; map.setView([Number(p.y), Number(p.x)], 16);
      }));
      $('rec-list').querySelectorAll('.ksave').forEach((btn) => btn.addEventListener('click', (e) => {
        e.stopPropagation(); saveKakaoPlace(data[Number(btn.dataset.i)], btn);
      }));
    }

    async function saveKakaoPlace(p, btn) {
      if (!user) { alert('로그인 후 저장할 수 있어요.'); location.href = 'onboarding.html'; return; }
      btn.disabled = true; btn.textContent = '저장 중…';
      const { data: found } = await sb.from('mj_restaurants').select('id').eq('name', p.place_name).limit(1);
      let rid = found && found[0] && found[0].id;
      if (!rid) {
        const { data: ins, error } = await sb.from('mj_restaurants').insert({
          name: p.place_name, address: p.road_address_name || p.address_name || null,
          lat: Number(p.y), lng: Number(p.x),
          category: (p.category_name || '').split('>').pop().trim() || null, tags: []
        }).select('id').single();
        if (error) { btn.disabled = false; btn.textContent = '실패'; return; }
        rid = ins.id;
      }
      const { error: se } = await sb.from('saved_restaurants').upsert({ user_id: user.id, restaurant_id: rid }, { onConflict: 'user_id,restaurant_id' });
      btn.textContent = se ? '실패' : '저장됨 ✓';
      if (!se) { btn.style.background = 'var(--ok)'; const { data: rs } = await sb.from('mj_restaurants').select('*'); if (rs) restaurants = rs; }
    }

    loadAll();
  </script>
</body>
</html>
