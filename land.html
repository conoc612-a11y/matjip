        const spec = [d.area ? esc(d.area) + '㎡' : '', d.floor ? esc(d.floor) + '층' : ''].filter(Boolean).join(' · ');
        const tags = [esc(d.type || '아파트'), '건축 ' + (d.build ? esc(d.build) + '년' : '연도 미상')];
        if (d.ymd) tags.push('거래 ' + esc(d.ymd));
        return `
        <div class="rec" data-i="${i}" data-kind="prop">
          <label class="cmp-check"><input type="checkbox" class="cmp" data-i="${i}" ${cmpSel.has(d.id) ? 'checked' : ''} /> 비교</label>
          <span class="score">${d.priceEok == null ? '' : d.priceEok + '억'}</span>
          <h3>${esc(d.name)}</h3>
          <div class="meta">${esc(d.gu || '')} ${esc(d.dong || '')}${spec ? ' · ' + spec : ''}</div>
          <div class="meta" style="color:var(--muted);margin-top:2px;">${distLabel(d)}</div>
          <div class="tags">${tags.map((t) => `<span class="tag">${t}</span>`).join('')}</div>
          <div class="actions">
            <button class="unsave" data-i="${i}" data-kind="prop">저장 해제</button>
          </div>
        </div>`;
      });
      // 공인중개사 카드
      const agentCards = agentList.map((a, i) => {
        const dm = (a.lat != null && a.lng != null) ? map.distance([a.lat, a.lng], [ctr.lat, ctr.lng]) : 0;
        const dtxt = dm ? `${dm >= 1000 ? (dm / 1000).toFixed(1) + 'km' : Math.round(dm) + 'm'} · 도보 ${Math.max(1, Math.round(dm / 1000 / 4.5 * 60))}분` : '';
        return `
        <div class="rec" data-i="${i}" data-kind="agent" style="border-left:3px solid #7048e8;">
          <h3>${esc(a.name)}</h3>
          <div class="meta">${esc(a.category ? a.category.split('>').pop().trim() : '')} · ${esc(a.address || '')}</div>
          ${dtxt ? `<div class="meta" style="color:var(--muted);margin-top:2px;">${dtxt}</div>` : ''}
          <div class="actions">
            ${a.phone ? `<a href="tel:${esc(a.phone)}">${esc(a.phone)}</a>` : ''}
            ${a.url ? `<a href="${safeUrl(a.url)}" target="_blank" rel="noopener">카카오맵</a>` : ''}
            <button class="unsave" data-i="${i}" data-kind="agent">저장 해제</button>
          </div>
        </div>`;
      });
      const allCards = [...propCards, ...agentCards];
      $('rec-list').innerHTML = `<div class="fav-tools" style="display:flex;gap:6px;margin-bottom:8px;">
          <button class="fav-export" style="flex:1;font:inherit;font-size:13px;padding:7px 0;border:1px solid var(--c-primary);color:var(--c-primary);background:transparent;border-radius:8px;cursor:pointer;">⬇ 내보내기 (JSON)</button>
          <button class="fav-import" style="flex:1;font:inherit;font-size:13px;padding:7px 0;border:1px solid var(--c-primary);color:var(--c-primary);background:transparent;border-radius:8px;cursor:pointer;">⬆ 가져오기</button>
          <input type="file" id="fav-file" accept=".json,application/json" style="display:none;">
        </div>`
        + (allCards.length ? allCards.join('')
        : '<div style="text-align:center;color:var(--muted);padding:24px 0;">저장한 부동산·공인중개사가 없어요.<br>지도를 클릭해 「저장」을 누르거나 공인중개사 목록의 「☆ 저장」을 이용해보세요.</div>');

      // 부동산 마커 (오렌지)
      list.forEach((d) => {
        if (d.lat == null || d.lng == null) return;
        const m = L.circleMarker([d.lat, d.lng], { radius: 7, color: '#fff', weight: 2, fillColor: '#e8590c', fillOpacity: 0.95 }).addTo(map)
          .bindPopup(`<b>${esc(d.name)}</b><br>${esc(d.gu || '')} ${esc(d.dong || '')}<br>${d.priceEok == null ? '-' : d.priceEok + '억'}${d.type && d.type !== '아파트' ? '<br>' + esc(d.type) : ''}`);
        markers[d.id] = m;
      });
      // 공인중개사 마커 (보라색)
      agentList.forEach((a) => {
        if (a.lat == null || a.lng == null) return;
        const icon = L.divIcon({
          className: '',
          html: '<div style="width:22px;height:22px;background:#7048e8;border:2px solid #fff;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;">중</div>',
          iconSize: [22, 22],
          iconAnchor: [11, 11],
        });
        const m = L.marker([a.lat, a.lng], { icon }).addTo(map)
          .bindPopup(`<b>${esc(a.name)}</b><br>${esc(a.phone || '')}${a.url ? '<br><a href="' + safeUrl(a.url) + '" target="_blank" rel="noopener">카카오맵</a>' : ''}`);
        markers['agent_' + a.id] = m;
      });
      const pts = [...list, ...agentList].map((d) => (d.lat != null && d.lng != null ? [d.lat, d.lng] : null)).filter(Boolean);
      if (pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 15 });

      $('rec-list').querySelectorAll('.rec').forEach((card) => {
        card.addEventListener('click', (e) => {
          if (e.target.closest('.actions') || e.target.closest('.cmp-check')) return;
          const kind = card.dataset.kind;
          const d = kind === 'agent' ? agentList[Number(card.dataset.i)] : list[Number(card.dataset.i)];
          if (d && d.lat != null) { map.setView([d.lat, d.lng], 16); const mk = markers[d.id] || markers['agent_' + d.id]; if (mk) mk.openPopup(); document.querySelector('.panel').classList.remove('sheet-open'); }
        });
        card.addEventListener('mouseenter', () => { const kind = card.dataset.kind; const d = kind === 'agent' ? agentList[Number(card.dataset.i)] : list[Number(card.dataset.i)]; const mk = markers[d && d.id] || markers['agent_' + (d && d.id)]; if (mk && mk.setStyle) mk.setStyle({ radius: 11, fillColor: '#e8590c', weight: 3 }); });
        card.addEventListener('mouseleave', () => { const kind = card.dataset.kind; const d = kind === 'agent' ? agentList[Number(card.dataset.i)] : list[Number(card.dataset.i)]; const mk = markers[d && d.id] || markers['agent_' + (d && d.id)]; if (mk && mk.setStyle) mk.setStyle({ radius: 7, fillColor: '#e8590c', weight: 2 }); });
      });
      $('rec-list').querySelectorAll('.cmp').forEach((cb) => cb.addEventListener('change', (e) => {
        e.stopPropagation(); const d = list[Number(cb.dataset.i)];
        if (cb.checked) cmpSel.set(d.id, d); else cmpSel.delete(d.id);
        updateCmpBar();
      }));
      $('rec-list').querySelectorAll('.unsave').forEach((btn) => btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const kind = btn.dataset.kind;
        if (kind === 'agent') {
          const a = agentList[Number(btn.dataset.i)];
          if (a) toggleAgentSave(a);
        } else {
          const d = list[Number(btn.dataset.i)];
          togglePropSave(d);
        }
        render();
      }));
      // 즐겨찾기 내보내기 (props + agents 단일 JSON)
      const expBtn = $('rec-list').querySelector('.fav-export');
      if (expBtn) expBtn.addEventListener('click', () => {
        const blob = new Blob([JSON.stringify({ props: loadSavedProps(), agents: loadSavedAgents(), exportedAt: new Date().toISOString() }, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'matjip-favorites.json';
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      });
      // 즐겨찾기 가져오기 (중복 id는 병합하지 않음)
      const impBtn = $('rec-list').querySelector('.fav-import'), favFile = $('fav-file');
      if (impBtn) impBtn.addEventListener('click', () => favFile && favFile.click());
      if (favFile) favFile.addEventListener('change', (e) => {
        const f = e.target.files[0];
        e.target.value = '';
        if (!f) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const d = JSON.parse(reader.result);
            if (!Array.isArray(d.props) || !Array.isArray(d.agents)) throw new Error('bad');
            const props = loadSavedProps(), agents = loadSavedAgents();
            d.props.forEach((p) => { if (p && p.id && !props.some((x) => x.id === p.id)) props.push(p); });
            d.agents.forEach((a) => { if (a && a.id && !agents.some((x) => x.id === a.id)) agents.push(a); });
            saveSavedProps(props); saveSavedAgents(agents);
            render();
          } catch (err) { alert('파일 형식이 올바르지 않아요.'); }
        };
        reader.readAsText(f);
      });
    }

    // ── 인근 공인중개사 (카카오 장소검색) ──
    // 기준점: 마지막 클릭 지점 > 지도 중심. 지도 클릭 핸들러가 agentAnchor 를 갱신한다.
    // 예전엔 지도 중심 고정이라, 새 주소를 클릭해도 목록이 그대로여서 갱신이 안 되는 것처럼 보였다.
    let agentAnchor = null;
    let agentMarkers = [];
    let kakaoTries = 0;
    let lastAgentCenter = null;  // 마지막으로 에이전트를 로드한 지도 중심 좌표
    function renderAgents() {
      Object.values(markers).forEach((m) => map.removeLayer(m));
      agentMarkers.forEach((m) => map.removeLayer(m)); agentMarkers = [];
      if (!(window.kakao && kakao.maps && kakao.maps.services)) {
        if (kakaoTries++ < 8) { $('rec-list').innerHTML = '<div style="text-align:center;color:var(--muted);padding:24px 0;">장소검색 로딩 중…</div>'; setTimeout(() => { if (landMode === 'agents') renderAgents(); }, 800); }
        else { $('banner').textContent = '인근 공인중개사'; $('rec-list').innerHTML = '<div style="text-align:center;color:var(--muted);padding:24px 0;">장소검색(카카오)을 불러오지 못했어요.<br>즐겨찾기 탭은 정상 이용 가능합니다.</div>'; }
        return;
      }
      kakaoTries = 0;
      // 클릭한 지점이 있으면 그걸 기준으로 삼는다. 없을 때만 지도 중심.
      const c = agentAnchor || map.getCenter();
      $('banner').textContent = agentAnchor
        ? '클릭한 위치 기준 인근 공인중개사예요.'
        : '지도 중심 인근 공인중개사예요. 지도를 옮기고 위치 버튼으로 갱신하세요.';
      new kakao.maps.services.Places().keywordSearch('공인중개사', (data, status) => {
        if (status !== kakao.maps.services.Status.OK || !data.length) { $('rec-list').innerHTML = '<div style="text-align:center;color:var(--muted);padding:24px 0;">인근 공인중개사가 없어요. 지도를 옮겨보세요.</div>'; lastAgentCenter = { lat: c.lat, lng: c.lng }; return; }
        // 인근 공인중개사 즐겨찾기 불러오기
        const savedAgents = loadSavedAgents();
        $('rec-list').innerHTML = data.map((p, i) => {
          const dm = Number(p.distance) || 0;
          const dtxt = dm ? `${dm >= 1000 ? (dm / 1000).toFixed(1) + 'km' : dm + 'm'} · 도보 ${Math.max(1, Math.round(dm / 1000 / 4.5 * 60))}분` : '';
          const isSaved = savedAgents.some((a) => a.id === p.id);
          return `<div class="rec" data-i="${i}"><h3>${esc(p.place_name)}</h3><div class="meta">${esc((p.category_name || '').split('>').pop().trim())} · ${esc(p.road_address_name || p.address_name || '')}</div>${dtxt ? `<div class="meta" style="color:var(--muted);margin-top:2px;">${dtxt}</div>` : ''}<div class="actions">${p.phone ? `<a href="tel:${esc(p.phone)}">${esc(p.phone)}</a>` : ''}${p.place_url ? `<a href="${safeUrl(p.place_url)}" target="_blank" rel="noopener">카카오맵</a>` : ''}<button class="agent-save" data-i="${i}" style="font-size:13px;padding:5px 10px;border-radius:6px;cursor:pointer;border:1px solid var(--c-primary);${isSaved ? 'background:var(--c-primary);color:#fff;' : 'background:var(--card);color:var(--c-primary);'}">${isSaved ? '★ 저장됨' : '☆ 저장'}</button></div></div>`;
        }).join('');
        // 인근 공인중개사 마커 (보라색 커스텀 아이콘)
        data.forEach((p) => {
          const icon = L.divIcon({
            className: '',
            html: '<div style="width:24px;height:24px;background:#7048e8;border:2.5px solid #fff;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;">중</div>',
            iconSize: [24, 24],
            iconAnchor: [12, 12],
          });
          const m = L.marker([Number(p.y), Number(p.x)], { icon }).addTo(map).bindPopup(`<b>${esc(p.place_name)}</b><br>${esc(p.phone || '')}${p.place_url ? '<br><a href="' + safeUrl(p.place_url) + '" target="_blank" rel="noopener">카카오맵</a>' : ''}`);
          agentMarkers.push(m);
        });
        lastAgentCenter = { lat: c.lat, lng: c.lng };
        $('rec-list').querySelectorAll('.rec').forEach((card) => card.addEventListener('click', (e) => {
          if (e.target.closest('.actions')) return;
          const p = data[Number(card.dataset.i)]; map.setView([Number(p.y), Number(p.x)], 17);
        }));
        // 인근 공인중개사 저장/해제 버튼 바인딩
        $('rec-list').querySelectorAll('.agent-save').forEach((btn) => btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const p = data[Number(btn.dataset.i)];
          toggleAgentSave(p);
          const saved = loadSavedAgents().some((a) => a.id === p.id);
          btn.textContent = saved ? '★ 저장됨' : '☆ 저장';
          btn.style.background = saved ? 'var(--c-primary)' : 'var(--card)';
          btn.style.color = saved ? '#fff' : 'var(--c-primary)';
        }));
      }, { location: new kakao.maps.LatLng(c.lat, c.lng), radius: 3000, sort: kakao.maps.services.SortBy.DISTANCE, size: 15 });
    }
    // ── 상승률 랭킹 (자체 계산 — 외부 AI·유료 예측 아님) ──
    // rpRows(실거래가 원본)를 name+dong 기준으로 묶어 거래를 시점순 정렬 후 절반으로 나눠
    // 전반기 대비 후반기 평균가 변화율을 본다. 표본 3건 미만은 추세를 말할 수 없어 제외.
    function computeRanking() {
      if (!rpRows || !rpRows.length) return [];
      const groups = new Map();
      rpRows.forEach((d) => {
        if (d.priceEok == null || !d.ymd) return;
        const key = (d.name || '') + '|' + (d.dong || '');
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(d);
      });
      const avg = (arr) => arr.reduce((s, r) => s + r.priceEok, 0) / arr.length;
      const ranked = [];
      groups.forEach((rows) => {
        if (rows.length < 3) return;
        const sorted = rows.slice().sort((a, b) => String(a.ymd).localeCompare(String(b.ymd)));
        const mid = Math.floor(sorted.length / 2);
        const early = sorted.slice(0, mid), late = sorted.slice(mid);
        if (!early.length || !late.length) return;
        const a1 = avg(early), a2 = avg(late);
        if (!a1) return;
        const last = sorted[sorted.length - 1];
        ranked.push({ name: last.name, gu: last.gu, dong: last.dong, lat: last.lat, lng: last.lng, pct: ((a2 - a1) / a1) * 100, cnt: rows.length, latest: a2 });
      });
      ranked.sort((a, b) => b.pct - a.pct);
      return ranked;
    }
    function renderRanking() {
      Object.values(markers).forEach((m) => map.removeLayer(m));
      agentMarkers.forEach((m) => map.removeLayer(m)); agentMarkers = [];
      $('banner').textContent = '아파트 실거래가로 전반기 대비 후반기 평균가를 비교한 자체 계산 랭킹입니다 (AI 예측 아님).';
      loadRp().then(() => {
        if (landMode !== 'ranking') return;
        const list = computeRanking().slice(0, 20);
        if (!list.length) { $('rec-list').innerHTML = '<div style="text-align:center;color:var(--muted);padding:24px 0;">실거래 데이터가 부족해요. 잠시 후 다시 시도하세요.</div>'; return; }
        $('rec-list').innerHTML = list.map((r, i) => `<div class="rec" data-i="${i}"><h3>${esc(r.name)}</h3><div class="meta">${esc(r.gu || '')} ${esc(r.dong || '')} · 거래 ${r.cnt}건</div><div class="meta" style="margin-top:2px;"><b style="color:${r.pct >= 0 ? 'var(--c-danger)' : 'var(--c-primary)'};">${r.pct >= 0 ? '+' : ''}${r.pct.toFixed(1)}%</b> · 최근 평균 ${r.latest.toFixed(1)}억</div><div class="meta" style="color:var(--muted);font-size:12px;margin-top:3px;">전반기 대비 후반기 실거래 평균 비교(표본 ${r.cnt}건)</div></div>`).join('');
        $('rec-list').querySelectorAll('.rec').forEach((card) => card.addEventListener('click', () => {
          const r = list[Number(card.dataset.i)];
          if (r.lat != null && r.lng != null) map.setView([r.lat, r.lng], 17);
        }));
      });
    }
    // 목록 탭 전환 + GPS
    document.querySelectorAll('.list-tab').forEach((t) => t.addEventListener('click', () => {
      document.querySelectorAll('.list-tab').forEach((x) => x.classList.remove('active'));
      t.classList.add('active'); landMode = t.dataset.mode;
      $('fav-cats').classList.toggle('on', landMode === 'favorites');
      render();
    }));
    document.querySelectorAll('.fav-cat').forEach((c) => c.addEventListener('click', () => {
      document.querySelectorAll('.fav-cat').forEach((x) => x.classList.remove('active'));
      c.classList.add('active'); propCat = c.dataset.cat; render();
    }));
    $('geo-btn').addEventListener('click', () => {
      if (!navigator.geolocation) { alert('이 브라우저는 위치를 지원하지 않아요.'); return; }
      $('geo-btn').style.opacity = '.5';
      navigator.geolocation.getCurrentPosition((pos) => {
        $('geo-btn').style.opacity = '';
        map.setView([pos.coords.latitude, pos.coords.longitude], 15);
        if (landMode === 'agents') { lastAgentCenter = null; renderAgents(); }
      }, () => { $('geo-btn').style.opacity = ''; alert('위치 권한이 필요해요.'); });
    });
    // 지도 이동/줌 후 인근 공인중개사 자동 갱신 (중심이 500m 이상 이동할 때만)
    map.on('moveend', () => {
      if (landMode !== 'agents') return;
      const c = map.getCenter();
      if (!lastAgentCenter || map.distance([lastAgentCenter.lat, lastAgentCenter.lng], [c.lat, c.lng]) > 500) {
        renderAgents();
      }
    });

    // ── 푸터 통계 ──
    // 회원수 = member_count() RPC(security definer, 개인정보 미노출),
    // 방문자 = visit-count Edge Function(같은 IP 하루 1회 집계, x-forwarded-for 사용).
    // Edge Function 미배포/미설정 시 조용히 넘어가고 '—'로 남는다.
    async function loadFooterStats() {
      const set = (id, v) => { const el = document.getElementById(id); if (el && v != null) el.textContent = v.toLocaleString(); };
      const s = await ensureSb();
      if (!s) return;
      try {
        const { data: m, error: mErr } = await s.rpc('member_count');
        if (!mErr) set('f-members', Number(m));
      } catch (e) {}
      try {
        const v = await (await fetch(SUPABASE_URL + '/functions/v1/visit-count?page=land')).json();
        set('f-today', v.today);
        set('f-total', v.total);
      } catch (e) {}
    }

    // ── 데이터 로드 ──
    async function loadAll() {
      const s = await ensureSb();
      let session = null;
      if (s) { try { const r = await s.auth.getSession(); session = r.data.session; } catch (e) {} }
      user = session ? session.user : null;
      if (user) {
        $('who').textContent = user.email;
        $('logout').style.display = '';
        $('delete-account').style.display = '';
      }
      loadFooterStats();
      render();
      renderRecent();
      refreshStatBar();
    }
    // ── 상단 스탯바: 실측 데이터만 표시(가짜 카운터 없음). 로드 시점이 제각각이라 가볍게 폴링 ──
    function refreshStatBar() {
      const jbEl = $('stat-jb'), rpEl = $('stat-rp'), favEl = $('stat-fav');
      if (jbEl) jbEl.textContent = (_jbRowsGlobal ? _jbRowsGlobal.length : 0).toLocaleString();
      if (rpEl) rpEl.textContent = (rpRows ? rpRows.length : 0).toLocaleString();
      if (favEl) favEl.textContent = loadSavedProps().length.toLocaleString();
    }
    setInterval(refreshStatBar, 2000);
    $('panel-toggle-btn').addEventListener('click', () => {
      $('panel').classList.toggle('collapsed');
      setTimeout(refreshMapSize, 160);
    });

    (function initSheet() { const h = $('sheet-handle'), p = document.querySelector('.panel'); if (h && p) h.addEventListener('click', () => p.classList.toggle('sheet-open')); })();
    $('logout').addEventListener('click', async () => { const s = await ensureSb(); if (s) { try { await s.auth.signOut(); } catch (e) {} } location.href = 'index.html'; });
    $('delete-account').addEventListener('click', async () => {
      if (!confirm('정말 탈퇴하시겠습니까?\n회원 정보와 저장한 모든 데이터가 삭제되며 복구할 수 없습니다.')) return;
      const s = await ensureSb();
      const btn = $('delete-account');
      btn.disabled = true; btn.textContent = '탈퇴 처리 중…';
      try {
        const { data: { session } } = await s.auth.getSession();
        if (!session) { alert('로그인 정보가 없습니다.'); return; }
        const r = await fetch(SUPABASE_URL + '/functions/v1/delete-account', {
          method: 'POST', headers: { 'Authorization': 'Bearer ' + session.access_token, 'Content-Type': 'application/json' },
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
        localStorage.clear();
        location.href = 'index.html?deleted=1';
      } catch (e) {
        alert('탈퇴 실패: ' + (e.message || e) + '\n잠시 후 다시 시도해 주세요.');
        btn.disabled = false; btn.textContent = '회원 탈퇴';
      }
    });
    $('profile-btn').addEventListener('click', (e) => { e.stopPropagation(); $('profile-menu').classList.toggle('on'); });
    document.addEventListener('click', () => $('profile-menu').classList.remove('on'));
    // ── 통합 검색 (검색엔진 선택에 따라 분기) ──
    function runSearch() {
      var q = $('search').value.trim();
      if (!q) { alert('검색어를 입력해 주세요.'); return; }
      $('ac').className = 'ac';
      if (searchEngine === 'vworld') vworldSearch(q, 'place');
      else runKakaoSearch(q);
    }

    $('search').addEventListener('input', () => { renderAC(); });
    $('search').addEventListener('keydown', (e) => { if (e.key === 'Enter') runSearch(); });
    $('search').addEventListener('blur', () => setTimeout(() => { $('ac').className = 'ac'; }, 150));
    // 정비구역명 검색용 lazy preload (overlay와 무관하게 1회 로드, 폴리곤은 불필요)
    let _jbRowsLoading = false;
    function ensureJbRows() {
      if (_jbRowsGlobal || _jbRowsLoading) return;
      _jbRowsLoading = true;
      fetch('redevelop_seoul.json?v=4').then((r) => r.json()).then((rows) => { _jbRowsGlobal = rows; _jbRowsLoading = false; }).catch(() => { _jbRowsLoading = false; });
    }
    function renderAC() {
      const raw = $('search').value.trim(), ac = $('ac');
      if (!raw) { ac.className = 'ac'; ac.innerHTML = ''; return; }
      ensureJbRows();
      const q = raw.toLowerCase();
      const jb = (_jbRowsGlobal || []).filter((d) => (d.name || '').toLowerCase().includes(q)).slice(0, 5);
      const placeItem = `<div class="ac-item" data-place="1"><span style="opacity:.7;">⌖</span>'${esc(raw)}' 위치로 이동<span class="t">지명</span></div>`;
      const jbItems = jb.map((d, i) => `<div class="ac-item" data-jb="${i}"><span style="opacity:.7;">▣</span>${esc(d.name)}<span class="t">정비구역</span></div>`).join('');
      ac.innerHTML = placeItem + jbItems;
      ac.className = 'ac on';
      ac.querySelector('.ac-item[data-place="1"]').addEventListener('mousedown', (ev) => { ev.preventDefault(); runSearch(); ac.className = 'ac'; });
      ac.querySelectorAll('.ac-item[data-jb]').forEach((el) => el.addEventListener('mousedown', (ev) => {
        ev.preventDefault();
        const d = jb[Number(el.dataset.jb)];
        $('ac').className = 'ac';
        map.setView([d.lat, d.lng], 16);
        if (vsMarker) map.removeLayer(vsMarker);
        vsMarker = L.marker([d.lat, d.lng]).addTo(map);
        vsMarker._jb = d;  // 팝업에 출발/도착/실거래 통계까지 연결되도록 popupopen 핸들러와 동일 경로 사용
        vsMarker.bindPopup(() => jbPopupHtml(d)).openPopup();
      }));
    }

    // ── 카카오 장소검색 ──
    function runKakaoSearch(q) {
      if (!kakaoReady) { alert('카카오 SDK가 로딩 중이에요. 잠시 후 다시 시도해 주세요.'); return; }
      $('banner').textContent = '카카오 검색 중…';
      var ps = new kakao.maps.services.Places();
      ps.keywordSearch(q, function (data, status) {
        if (status !== kakao.maps.services.Status.OK || !data.length) {
          $('rec-list').innerHTML = '<button class="kakao-back" id="s-back">← 뒤로</button><div style="text-align:center;color:var(--muted);padding:24px 0;">카카오 검색 결과가 없어요.</div>';
          var sbe = document.getElementById('s-back'); if (sbe) sbe.addEventListener('click', render);
          return;
        }
        renderKakao(data);
      });
    }

    function renderKakao(data) {
      Object.values(markers).forEach((m) => map.removeLayer(m));
      clearKakaoMarkers();
      var back = '<button class="kakao-back" id="s-back">← 뒤로</button>';
      $('rec-list').innerHTML = back + data.map(function (p, i) {
        return '<div class="rec" data-i="' + i + '">' +
          '<h3>' + esc(p.place_name) + '</h3>' +
          '<div class="meta">' + esc((p.category_name || '').split('>').pop().trim()) + ' · ' + esc(p.road_address_name || p.address_name || '') + '</div>' +
          '<div class="actions">' +
          (p.place_url ? '<a href="' + safeUrl(p.place_url) + '" target="_blank" rel="noopener">카카오맵</a>' : '') +
          '</div></div>';
      }).join('');
      var pts = [];
      data.forEach(function (p) {
        var m = L.marker([Number(p.y), Number(p.x)]).addTo(map).bindPopup('<b>' + esc(p.place_name) + '</b>');
        kakaoMarkers.push(m); pts.push([Number(p.y), Number(p.x)]);
      });
      if (pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 16 });
      var sbe = document.getElementById('s-back'); if (sbe) sbe.addEventListener('click', render);
    }

    loadAll();
  </script>
</body>
</html>
