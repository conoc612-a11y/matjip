      } catch (e) { if (info) info.textContent = '경로 계산 실패(네트워크).'; }
    }

    // ── 공통 이스케이프 ──
    function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
    // 외부 URL은 http/https만 허용(javascript:·data: 스킴 차단)
    function safeUrl(u) { u = String(u || ''); return /^https?:\/\//i.test(u) ? esc(u) : '#'; }

    let landMode = 'agents';   // 'agents'(인근 공인중개사) | 'favorites'(부동산 즐겨찾기)
    let propCat = '전체';       // 부동산 즐겨찾기 유형 필터

    // ── 부동산 ⭐저장 (이 기기 localStorage에 보관) ──
    const PROP_KEY = 'mj_saved_props';
    function loadSavedProps() { try { return JSON.parse(localStorage.getItem(PROP_KEY) || '[]'); } catch (e) { return []; } }
    function saveSavedProps(a) { try { localStorage.setItem(PROP_KEY, JSON.stringify(a)); } catch (e) {} }
    function propId(d) { return d.id || `${d.name}|${d.dong}|${d.ymd}|${d.area}|${d.floor}`; }
    // 즐겨찾기 유형 필터(아파트/연립/다세대/단독·다가구/기타)로 묶는다.
    // 저장된 유형은 출처마다 표기가 제각각이라 정규화 없이는 필터가 동작하지 않는다.
    function propGroup(t) {
      t = t || '아파트';
      if (t.includes('아파트')) return '아파트';
      if (t.includes('연립')) return '연립';
      if (t.includes('다세대')) return '다세대';
      if (t.includes('단독') || t.includes('다가구') || t.includes('다중')) return '단독·다가구';
      return '기타';
    }
    // 클릭 저장용 유형 추정. 건축물대장의 주용도(정확)를 우선하고,
    // 대장에 기록이 없으면 V-World 건물정보의 용도 코드 계열로만 구분한다.
    function propType(st) {
      const br = st && st.br, bld = st && st.bld;
      const purps = br && (br.mainPurpsCdNm || br.etcPurps || '');
      if (purps) {
        if (/아파트/.test(purps)) return '아파트';
        if (/연립/.test(purps)) return '연립';
        if (/다세대/.test(purps)) return '다세대';
        if (/단독|다중|다가구/.test(purps)) return '단독·다가구';
        return '기타';
      }
      if (bld && bld.usability) {
        if (bld.usability === '01000') return '단독·다가구';
        if (bld.usability === '02000') return '공동주택';
        return '기타';
      }

    }
    function isPropSaved(d) { const id = propId(d); return loadSavedProps().some((x) => x.id === id); }
    function togglePropSave(d) {

      const id = propId(d);

      else a.push({ id, name: d.name, gu: d.gu, dong: d.dong, lat: d.lat, lng: d.lng, priceEok: d.priceEok, area: d.area, floor: d.floor, ymd: d.ymd, build: d.build, type: d.type || '아파트' });

    // ── 부동산 비교 ──
    const cmpSel = new Map(); // id -> item
    function updateCmpBar() {

        bar.style.display = '';
        bar.innerHTML = `비교 선택 <b>${cmpSel.size}</b>개 `
          + `<button id="cmp-go" style="font:inherit;font-size:12px;padding:4px 10px;border:none;background:var(--c-primary);color:#fff;border-radius:6px;cursor:pointer;margin-left:6px;">비교표 보기</button> `
          + `<button id="cmp-clear" style="font:inherit;font-size:12px;padding:4px 10px;border:1px solid var(--line);background:var(--card);border-radius:6px;cursor:pointer;">해제</button>`;
        $('cmp-go').onclick = openCompare;

    }
    function openCompare() {
      const items = [...cmpSel.values()];
      if (items.length < 2) { alert('2개 이상 선택해 주세요.'); return; }
      const pyeong = (a) => (a ? a / 3.3058 : 0);
      const perPyeong = (d) => { if (d.priceEok == null || !d.area) return '-'; return Math.round(d.priceEok * 10000 / pyeong(d.area)).toLocaleString() + '만/평'; };
      const rows = [['실거래가', (d) => d.priceEok == null ? '-' : d.priceEok + '억'], ['전용면적', (d) => (d.area || '?') + '㎡'], ['평단가', perPyeong], ['건축년도', (d) => (d.build || '?') + '년'], ['층', (d) => (d.floor || '?') + '층'], ['거래일', (d) => d.ymd || '-'], ['위치', (d) => `${d.gu || ''} ${d.dong || ''}`]];
      let modal = $('cmp-modal');
      if (!modal) { modal = document.createElement('div'); modal.id = 'cmp-modal'; modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:3000;display:flex;align-items:center;justify-content:center;padding:16px;'; document.body.appendChild(modal); modal.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; }); }

    function render() {

    // ── 부동산 즐겨찾기 목록 (localStorage) ──
    function renderFavProps() {
      Object.values(markers).forEach((m) => map.removeLayer(m));

      if (propCat !== '전체') list = list.filter((x) => propGroup(x.type) === propCat);

      const ctr = map.getCenter();
      const distLabel = (d) => { if (d.lat == null) return ''; const m = map.distance([d.lat, d.lng], [ctr.lat, ctr.lng]); const min = Math.max(1, Math.round(m / 1000 / 4.5 * 60)); return `${m >= 1000 ? (m / 1000).toFixed(1) + 'km' : Math.round(m) + 'm'} · 도보 ${min}분`; };
      $('rec-list').innerHTML = list.length ? list.map((d, i) => {
        const spec = [d.area ? esc(d.area) + '㎡' : '', d.floor ? esc(d.floor) + '층' : ''].filter(Boolean).join(' · ');
        const tags = [esc(d.type || '아파트'), '건축 ' + (d.build ? esc(d.build) + '년' : '연도 미상')];
        if (d.ymd) tags.push('거래 ' + esc(d.ymd));
        return `
        <div class="rec" data-i="${i}">
          <label class="cmp-check"><input type="checkbox" class="cmp" data-i="${i}" ${cmpSel.has(d.id) ? 'checked' : ''} /> 비교</label>
          <span class="score">${d.priceEok == null ? '' : d.priceEok + '억'}</span>
          <h3>${esc(d.name)}</h3>
          <div class="meta">${esc(d.gu || '')} ${esc(d.dong || '')}${spec ? ' · ' + spec : ''}</div>
          <div class="meta" style="color:var(--muted);margin-top:2px;">${distLabel(d)}</div>
          <div class="tags">${tags.map((t) => `<span class="tag">${t}</span>`).join('')}</div>
          <div class="actions">
            <button class="unsave" data-i="${i}">저장 해제</button>
          </div>
        </div>`;
      }).join('')
        : '<div style="text-align:center;color:var(--muted);padding:24px 0;">저장한 부동산이 없어요.<br>지도를 클릭해 「저장」을 누르거나 실거래가 마커의 저장 버튼을 이용해보세요.</div>';

      list.forEach((d) => {
        if (d.lat == null || d.lng == null) return;
        const m = L.circleMarker([d.lat, d.lng], { radius: 7, color: '#fff', weight: 2, fillColor: '#e8590c', fillOpacity: 0.95 }).addTo(map)
          .bindPopup(`<b>${esc(d.name)}</b><br>${esc(d.gu || '')} ${esc(d.dong || '')}<br>${d.priceEok == null ? '-' : d.priceEok + '억'}${d.type && d.type !== '아파트' ? '<br>' + esc(d.type) : ''}`);
        markers[d.id] = m;
      });
      const pts = list.map((d) => (d.lat != null ? [d.lat, d.lng] : null)).filter(Boolean);
      if (pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 15 });

      $('rec-list').querySelectorAll('.rec').forEach((card) => {
        card.addEventListener('click', (e) => {
          if (e.target.closest('.actions') || e.target.closest('.cmp-check')) return;
          const d = list[Number(card.dataset.i)];
          if (d && d.lat != null) { map.setView([d.lat, d.lng], 16); markers[d.id]?.openPopup(); document.querySelector('.panel').classList.remove('sheet-open'); }
        });
        card.addEventListener('mouseenter', () => { const d = list[Number(card.dataset.i)]; const m = markers[d && d.id]; if (m) m.setStyle({ radius: 11, fillColor: '#e8590c', weight: 3 }); });
        card.addEventListener('mouseleave', () => { const d = list[Number(card.dataset.i)]; const m = markers[d && d.id]; if (m) m.setStyle({ radius: 7, fillColor: '#e8590c', weight: 2 }); });
      });
      $('rec-list').querySelectorAll('.cmp').forEach((cb) => cb.addEventListener('change', (e) => {
        e.stopPropagation(); const d = list[Number(cb.dataset.i)];
        if (cb.checked) cmpSel.set(d.id, d); else cmpSel.delete(d.id);
        updateCmpBar();
      }));
      $('rec-list').querySelectorAll('.unsave').forEach((btn) => btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const d = list[Number(btn.dataset.i)];
        togglePropSave(d); render();
      }));
    }

    // ── 인근 공인중개사 (카카오 장소검색, 지도 중심 반경) ──
    let agentMarkers = [];
    let kakaoTries = 0;
    function renderAgents() {
      Object.values(markers).forEach((m) => map.removeLayer(m));
      agentMarkers.forEach((m) => map.removeLayer(m)); agentMarkers = [];
      if (!(window.kakao && kakao.maps && kakao.maps.services)) {
        if (kakaoTries++ < 8) { $('rec-list').innerHTML = '<div style="text-align:center;color:var(--muted);padding:24px 0;">장소검색 로딩 중…</div>'; setTimeout(() => { if (landMode === 'agents') renderAgents(); }, 800); }
        else { $('banner').textContent = '인근 공인중개사'; $('rec-list').innerHTML = '<div style="text-align:center;color:var(--muted);padding:24px 0;">장소검색(카카오)을 불러오지 못했어요.<br>즐겨찾기 탭은 정상 이용 가능합니다.</div>'; }
        return;
      }
      kakaoTries = 0;
      $('banner').textContent = '지도 중심 인근 공인중개사예요. 지도를 옮기고 위치 버튼으로 갱신하세요.';
      const c = map.getCenter();
      new kakao.maps.services.Places().keywordSearch('공인중개사', (data, status) => {
        if (status !== kakao.maps.services.Status.OK || !data.length) { $('rec-list').innerHTML = '<div style="text-align:center;color:var(--muted);padding:24px 0;">인근 공인중개사가 없어요. 지도를 옮겨보세요.</div>'; return; }
        $('rec-list').innerHTML = data.map((p, i) => { const dm = Number(p.distance) || 0; const dtxt = dm ? `${dm >= 1000 ? (dm / 1000).toFixed(1) + 'km' : dm + 'm'} · 도보 ${Math.max(1, Math.round(dm / 1000 / 4.5 * 60))}분` : ''; return `<div class="rec" data-i="${i}"><h3>${esc(p.place_name)}</h3><div class="meta">${esc((p.category_name || '').split('>').pop().trim())} · ${esc(p.road_address_name || p.address_name || '')}</div>${dtxt ? `<div class="meta" style="color:var(--muted);margin-top:2px;">${dtxt}</div>` : ''}<div class="actions">${p.phone ? `<a href="tel:${esc(p.phone)}">${esc(p.phone)}</a>` : ''}${p.place_url ? `<a href="${safeUrl(p.place_url)}" target="_blank" rel="noopener">카카오맵</a>` : ''}</div></div>`; }).join('');
        data.forEach((p) => { const m = L.marker([Number(p.y), Number(p.x)]).addTo(map).bindPopup(`<b>${esc(p.place_name)}</b><br>${esc(p.phone || '')}`); agentMarkers.push(m); });
        $('rec-list').querySelectorAll('.rec').forEach((card) => card.addEventListener('click', (e) => { if (e.target.closest('.actions')) return; const p = data[Number(card.dataset.i)]; map.setView([Number(p.y), Number(p.x)], 17); }));
      }, { location: new kakao.maps.LatLng(c.lat, c.lng), radius: 3000, sort: kakao.maps.services.SortBy.DISTANCE, size: 15 });
    }
    // 목록 탭 전환 + GPS
    document.querySelectorAll('.list-tab').forEach((t) => t.addEventListener('click', () => {
      document.querySelectorAll('.list-tab').forEach((x) => x.classList.remove('active'));
      t.classList.add('active'); landMode = t.dataset.mode;
      $('fav-cats').classList.toggle('on', landMode === 'favorites');
      render();
    }));
    document.querySelectorAll('.fav-cat').forEach((c) => c.addEventListener('click', () => {
      document.querySelectorAll('.fav-cat').forEach((x) => x.classList.remove('active'));
      c.classList.add('active'); propCat = c.dataset.cat; render();
    }));
    $('geo-btn').addEventListener('click', () => {
      if (!navigator.geolocation) { alert('이 브라우저는 위치를 지원하지 않아요.'); return; }
      $('geo-btn').style.opacity = '.5';
      navigator.geolocation.getCurrentPosition((pos) => { $('geo-btn').style.opacity = ''; map.setView([pos.coords.latitude, pos.coords.longitude], 15); if (landMode === 'agents') renderAgents(); }, () => { $('geo-btn').style.opacity = ''; alert('위치 권한이 필요해요.'); });
    });

    // ── 푸터 통계 ──
    // 회원수 = taste_profiles, 방문자 = visits 테이블(페이지 로드마다 1건씩 기록).
    // visits 테이블이 아직 없으면(스키마 미실행) 조용히 넘어가고 '—'로 남는다.
    async function loadFooterStats() {
      const set = (id, v) => { const el = document.getElementById(id); if (el && v != null) el.textContent = v.toLocaleString(); };
      const s = await ensureSb();
      if (!s) return;
      try {
        const { count: m } = await s.from('taste_profiles').select('*', { count: 'exact', head: true });
        set('f-members', m);
      } catch (e) {}
      try {
        await s.from('visits').insert({ page: 'land' });
        const today = new Date().toISOString().slice(0, 10);
        const [tRes, totRes] = await Promise.allSettled([
          s.from('visits').select('*', { count: 'exact', head: true }).gte('created_at', today),
          s.from('visits').select('*', { count: 'exact', head: true }),
        ]);
        set('f-today', tRes.status === 'fulfilled' ? tRes.value.count : null);
        set('f-total', totRes.status === 'fulfilled' ? totRes.value.count : null);
      } catch (e) {}
    }

    // ── 데이터 로드 ──
    async function loadAll() {
      const s = await ensureSb();
      let session = null;
      if (s) { try { const r = await s.auth.getSession(); session = r.data.session; } catch (e) {} }
      user = session ? session.user : null;
      if (user) {
        $('who').textContent = user.email;
        $('logout').style.display = '';
      }
      loadFooterStats();
      render();
      renderRecent();
    }

    (function initSheet() { const h = $('sheet-handle'), p = document.querySelector('.panel'); if (h && p) h.addEventListener('click', () => p.classList.toggle('sheet-open')); })();
    $('logout').addEventListener('click', async () => { const s = await ensureSb(); if (s) { try { await s.auth.signOut(); } catch (e) {} } location.href = 'index.html'; });
    $('profile-btn').addEventListener('click', (e) => { e.stopPropagation(); $('profile-menu').classList.toggle('on'); });
    document.addEventListener('click', () => $('profile-menu').classList.remove('on'));
    // ── 통합 검색 (검색엔진 선택에 따라 분기) ──
    function runSearch() {
      var q = $('search').value.trim();
      if (!q) { alert('검색어를 입력해 주세요.'); return; }
      $('ac').className = 'ac';
      if (searchEngine === 'vworld') vworldSearch(q, 'place');
      else runKakaoSearch(q);
    }

    $('search').addEventListener('input', () => { renderAC(); });
    $('search').addEventListener('keydown', (e) => { if (e.key === 'Enter') runSearch(); });
    $('search').addEventListener('blur', () => setTimeout(() => { $('ac').className = 'ac'; }, 150));
    function renderAC() {
      const raw = $('search').value.trim(), ac = $('ac');
      if (!raw) { ac.className = 'ac'; ac.innerHTML = ''; return; }
      ac.innerHTML = `<div class="ac-item" data-place="1"><span style="opacity:.7;">⌖</span>'${esc(raw)}' 위치로 이동<span class="t">지명</span></div>`;
      ac.className = 'ac on';
      ac.querySelector('.ac-item').addEventListener('mousedown', (ev) => {
        ev.preventDefault(); runSearch(); ac.className = 'ac';
      });
    }

    // ── 카카오 장소검색 ──
    function runKakaoSearch(q) {
      if (!kakaoReady) { alert('카카오 SDK가 로딩 중이에요. 잠시 후 다시 시도해 주세요.'); return; }
      $('banner').textContent = '카카오 검색 중…';
      var ps = new kakao.maps.services.Places();
      ps.keywordSearch(q, function (data, status) {
        if (status !== kakao.maps.services.Status.OK || !data.length) {
          $('rec-list').innerHTML = '<button class="kakao-back" id="s-back">← 뒤로</button><div style="text-align:center;color:var(--muted);padding:24px 0;">카카오 검색 결과가 없어요.</div>';
          var sbe = document.getElementById('s-back'); if (sbe) sbe.addEventListener('click', render);
          return;
        }
        renderKakao(data);
      });
    }

    function renderKakao(data) {
      Object.values(markers).forEach((m) => map.removeLayer(m));
      clearKakaoMarkers();
      var back = '<button class="kakao-back" id="s-back">← 뒤로</button>';
      $('rec-list').innerHTML = back + data.map(function (p, i) {
        return '<div class="rec" data-i="' + i + '">' +
          '<h3>' + esc(p.place_name) + '</h3>' +
          '<div class="meta">' + esc((p.category_name || '').split('>').pop().trim()) + ' · ' + esc(p.road_address_name || p.address_name || '') + '</div>' +
          '<div class="actions">' +
          (p.place_url ? '<a href="' + safeUrl(p.place_url) + '" target="_blank" rel="noopener">카카오맵</a>' : '') +
          '</div></div>';
      }).join('');
      var pts = [];
      data.forEach(function (p) {
        var m = L.marker([Number(p.y), Number(p.x)]).addTo(map).bindPopup('<b>' + esc(p.place_name) + '</b>');
        kakaoMarkers.push(m); pts.push([Number(p.y), Number(p.x)]);
      });
      if (pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 16 });
      var sbe = document.getElementById('s-back'); if (sbe) sbe.addEventListener('click', render);
    }

    loadAll();
  </script>
</body>
</html>
