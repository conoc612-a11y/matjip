<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="js/auth-guard.js"></script>
  <title>맛집 탐방 — 부동산 지도</title>
  <link rel="preconnect" href="https://unpkg.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://api.vworld.kr" crossorigin />
  <link rel="preconnect" href="https://openapi.map.naver.com" crossorigin />
  <link rel="preconnect" href="https://dapi.kakao.com" crossorigin />
  <link rel="preconnect" href="https://bhgijvaxxjnocgfnaaeu.supabase.co" crossorigin />
  <link rel="dns-prefetch" href="https://tile.openstreetmap.org" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <style>
    :root {
      --c-primary:#1971c2; --c-primary-soft:#e7f0fb; --c-price:#d9480f;
      --c-success:#2f9e44; --c-danger:#e03131; --c-text:#1f2937; --c-muted:#6b7280;
      --c-border:#e5e7eb; --c-bg:#f3f5f8; --c-card:#ffffff; --c-hover:#f5f7fa;
      --c-shadow:0 1px 3px rgba(16,24,40,.06); --c-shadow-lg:0 10px 30px rgba(16,24,40,.14);
      --bg:var(--c-bg); --card:var(--c-card); --line:var(--c-border);
      --text:var(--c-text); --muted:var(--c-muted); --accent:var(--c-primary); --ok:var(--c-success);
    }
    :root.dark {
      --bg:#101216; --card:#1b1e25; --line:#2a2e37; --text:#e8ecf2; --muted:#8b93a3;
      --c-primary-soft:#1b2a40; --c-hover:#242a34; --c-border:#2a2e37; --c-bg:#101216;
      --c-text:#e8ecf2; --c-muted:#8b93a3;
      --c-shadow:0 1px 3px rgba(0,0,0,.4); --c-shadow-lg:0 10px 30px rgba(0,0,0,.5);
    }
    * { box-sizing:border-box; }
    html, body { height:100%; }
    body { margin:0; background:var(--bg); color:var(--text);
      font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif;
      font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
      display:flex; flex-direction:column; }
    /* ── Header ── */
    header { display:flex; justify-content:space-between; align-items:center; height:58px; padding:0 18px;
      background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:1000; flex-shrink:0; }
    .brand { display:flex; align-items:center; gap:9px; text-decoration:none; color:var(--text); }
    .brand-mark { width:30px; height:30px; border-radius:8px; background:var(--c-primary); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .brand-mark svg { width:18px; height:18px; }
    .brand-title { font-size:16px; font-weight:700; margin:0; letter-spacing:-.2px; }
    .brand-group { display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-width:0; }
    .info-chip { display:flex; align-items:center; gap:5px; padding:4px 9px; border-radius:999px; background:var(--c-hover); font-size:13px; color:var(--muted); white-space:nowrap; border:none; cursor:default; font-family:inherit; }
    .info-chip b { color:var(--text); font-weight:700; }
    .info-chip svg { width:16px; height:16px; flex-shrink:0; }
    .info-chip.fx-up b { color:var(--c-danger); }
    .info-chip.fx-down b { color:var(--c-primary); }
    @media (max-width:640px) { .info-chip.fx-chip { display:none; } }
    header .right { display:flex; gap:6px; align-items:center; font-size:14px; }
    header a, header button { cursor:pointer; font:inherit; text-decoration:none; }
    .nav-tab { color:var(--muted); padding:7px 12px; border-radius:8px; text-decoration:none; font-weight:500; border:none; background:none; transition:background .15s,color .15s; }
    .nav-tab:hover { background:var(--c-hover); color:var(--text); }
    .nav-tab.active { background:var(--c-primary); color:#fff; }
    .icon-btn { width:34px; height:34px; border:none; background:var(--c-hover); color:var(--text); border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:16px; line-height:1; }
    .icon-btn svg { width:18px; height:18px; }
    .icon-btn:hover { background:var(--line); }
    .profile { position:relative; }
    .profile-tab { display:flex; align-items:center; gap:3px; }
    .profile-menu { position:absolute; right:0; top:calc(100% + 8px); background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--c-shadow-lg); min-width:170px; display:none; z-index:2000; overflow:hidden; }
    .profile-menu.on { display:block; }
    .profile-menu a, .profile-menu button { display:block; width:100%; text-align:left; padding:10px 14px; font:inherit; font-size:14px; color:var(--text); background:none; border:none; border-bottom:1px solid var(--line); cursor:pointer; text-decoration:none; }
    .profile-menu a:hover, .profile-menu button:hover { background:var(--c-hover); }
    /* ── Autocomplete ── */
    .ac-wrap { position:relative; flex:1; }
    .ac { position:absolute; left:0; right:0; top:calc(100% + 4px); background:var(--card); border:1px solid var(--line); border-radius:10px; z-index:1500; max-height:240px; overflow-y:auto; display:none; box-shadow:var(--c-shadow-lg); }
    .ac.on { display:block; }
    .ac-item { padding:10px 14px; font-size:14px; cursor:pointer; display:flex; gap:8px; align-items:center; }
    .ac-item:hover { background:var(--c-hover); }
    .ac-item .t { margin-left:auto; color:var(--muted); font-size:12px; }
    /* 지도를 최대한 크게. 세로 9.4:0.6(푸터), 가로 9:1(우측 패널).
       basis를 0으로 둬야 flex 비율이 그대로 화면 비율이 된다(basis가 남아 있으면 비율이 왜곡됨).
       패널은 min-width로 하한만 둔다 — 9:1을 그대로 두면 넓은 화면에서 카드가 깨진다. */
    /* flex-wrap:wrap 이면 플렉스 줄 높이가 '내용'에 끌려간다. 우측 패널(공인중개사 목록)이
       길어지면 줄 전체가 늘어나고 지도까지 같이 늘어나, overflow:hidden 으로 잘려 보였다.
       실측: 컨테이너 608px 인데 #map 이 2527px 이었고 map.getSize().y 가 0 이었다.
       (지도 크기를 0 으로 알면 타일·클러스터·팝업 위치 계산이 전부 어긋난다)
       2단 레이아웃이라 줄바꿈이 필요 없다. 모바일은 아래 미디어쿼리에서 display:block 으로 바뀐다.
       min-height:0 은 플렉스 자식이 내용 때문에 줄어들지 않는 기본값을 풀어 준다. */
    .stat-bar { display:flex; gap:16px; align-items:center; height:34px; padding:0 18px; background:var(--c-primary-soft); color:var(--c-primary); font-size:13px; font-weight:600; flex-shrink:0; }
    .stat-bar b { font-weight:800; }
    .layout { display:flex; flex-wrap:nowrap; align-items:stretch; flex:9.4; min-height:0; overflow:hidden; }
    #map { flex:9 1 0; min-width:0; min-height:0; }
    .panel { flex:1 1 0; min-width:280px; min-height:0; overflow-y:auto; padding:14px 16px; transition:min-width .15s, padding .15s; }
    /* 패널 왼쪽 가장자리를 끌어 폭을 조절한다. 폭이 바뀌면 안쪽 카드는 %/flex 기반이라
       글자가 저절로 다시 흐른다(고정 px 폭을 쓰지 않는 이유). */
    .panel-resizer { width:6px; flex:0 0 6px; cursor:col-resize; background:transparent; position:relative; }
    .panel-resizer::before { content:''; position:absolute; inset:0 2px; border-radius:3px; background:var(--line); opacity:0; transition:opacity .15s; }
    .panel-resizer:hover::before, .panel-resizer.dragging::before { opacity:1; }
    body.panel-resizing { cursor:col-resize; -webkit-user-select:none; user-select:none; }
    .panel.collapsed + .panel-resizer, .panel.collapsed ~ .panel-resizer { display:none; }
    @media (max-width:820px) { .panel-resizer { display:none; } }
    .panel.collapsed { flex:0 0 0; min-width:0; width:0; padding:0; overflow:hidden; border:none; }
    /* ── Panel widgets ── */
    .engine-bar { display:flex; gap:4px; margin-bottom:10px; background:var(--c-hover); padding:4px; border-radius:10px; }
    .tool-btn { flex:1; font:inherit; font-size:13px; font-weight:600; padding:7px 10px; border:none; background:transparent; color:var(--muted); border-radius:7px; cursor:pointer; transition:all .15s; }
    .tool-btn:hover { color:var(--text); }
    .tool-btn.on { background:var(--card); color:var(--c-primary); box-shadow:var(--c-shadow); }
    .search-row { display:flex; gap:8px; margin-bottom:12px; }
    .search-inp { width:100%; font:inherit; font-size:14px; padding:11px 14px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--text); }
    .search-inp::placeholder { color:var(--muted); }
    .search-inp:focus { outline:2px solid var(--c-primary); outline-offset:-1px; border-color:var(--c-primary); }
    .gps-btn { width:44px; flex-shrink:0; border:1px solid var(--line); background:var(--card); color:var(--c-primary); border-radius:10px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .gps-btn:hover { border-color:var(--c-primary); background:var(--c-primary-soft); }
    .list-tabs { display:flex; background:var(--c-hover); border-radius:10px; padding:4px; margin:4px 0 14px; }
    .list-tab { flex:1; font:inherit; font-size:13px; font-weight:600; padding:8px 6px; border:none; background:transparent; color:var(--muted); border-radius:7px; cursor:pointer; transition:all .15s; }
    .list-tab.active { background:var(--card); color:var(--c-primary); box-shadow:var(--c-shadow); }
    .fav-cats { display:none; gap:6px; flex-wrap:wrap; margin:-4px 0 14px; }
    .fav-cats.on { display:flex; }
    .fav-cat { font:inherit; font-size:13px; padding:6px 14px; border:1px solid var(--line); background:var(--card); color:var(--muted); border-radius:999px; cursor:pointer; transition:all .15s; }
    .fav-cat:hover { border-color:var(--c-primary); color:var(--c-primary); }
    .fav-cat.active { background:var(--c-primary); color:#fff; border-color:var(--c-primary); }
    .banner { background:var(--c-primary-soft); color:var(--text); padding:11px 14px; border-radius:10px; font-size:14px; margin-bottom:12px; line-height:1.55; }
    .banner a { color:var(--c-primary); font-weight:600; }
    #recent { font-size:13px; margin-bottom:12px; color:var(--muted); line-height:2; }
    .recent-chip { display:inline-block; margin:2px 4px 2px 0; padding:3px 10px; border:1px solid var(--line); border-radius:999px; text-decoration:none; color:var(--text); background:var(--card); font-size:13px; }
    .recent-chip:hover { border-color:var(--c-primary); color:var(--c-primary); }
    #cmp-bar { background:var(--card); border:1px solid var(--line); border-left:3px solid var(--c-primary); border-radius:10px; padding:10px 14px; font-size:14px; margin-bottom:12px; box-shadow:var(--c-shadow); }
    .kakao-back { background:none; border:none; color:var(--c-primary); cursor:pointer; font:inherit; padding:2px 0 10px; }
    /* ── Result cards ── */
    .rec { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:10px; cursor:pointer; box-shadow:var(--c-shadow); transition:box-shadow .15s,border-color .15s,transform .15s; }
    .rec:hover { border-color:var(--c-primary); box-shadow:var(--c-shadow-lg); transform:translateY(-1px); }
    .rec h3 { margin:0 0 5px; font-size:16px; font-weight:600; letter-spacing:-.2px; }
    .rec .meta { font-size:13px; color:var(--muted); }
    .rec .tags { margin:9px 0; display:flex; flex-wrap:wrap; gap:6px; }
    .tag { font-size:12px; background:var(--c-hover); color:var(--muted); border-radius:999px; padding:3px 10px; font-weight:500; }
    .tag.hit { background:var(--c-primary); color:#fff; }
    .rec .why { font-size:13px; color:var(--ok); margin:6px 0; min-height:15px; }
    /* 버튼 3개(전화번호·카카오맵·저장)가 좁은 패널에서 한 줄에 안 들어가 '저 장' 처럼
       글자가 줄바꿈되던 문제 — 줄바꿈은 버튼 사이에서만 하고 글자는 자르지 않는다. */
    /* align-items:flex-start — flex 기본값 stretch 면 줄바꿈된 행에서 버튼이 줄 높이만큼
       세로로 늘어나(실측 34px → 52px) 들쭉날쭉해 보인다. 제 높이를 유지시킨다. */
    .rec .actions { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; align-items:flex-start; }
    .rec .actions a, .rec .actions button { font-size:13px; font-weight:500; padding:7px 10px; border-radius:8px; border:1px solid var(--line); cursor:pointer; background:var(--card); color:var(--text); text-decoration:none; white-space:nowrap; flex:0 0 auto; line-height:1.2; }
    .rec .actions a:hover, .rec .actions button:hover { border-color:var(--c-primary); color:var(--c-primary); }
    .rec .actions .save { background:var(--c-primary); color:#fff; border:none; }
    .rec .actions .save:hover { color:#fff; }
    .score { float:right; font-size:15px; color:var(--c-price); font-weight:700; margin-left:8px; }
    .cmp-check { float:right; font-size:12px; color:var(--muted); cursor:pointer; user-select:none; margin-left:8px; }
    /* ── 드래그 시 엉뚱한 곳의 글자가 잡히는 문제 ──────────────────────────
       지도를 끌거나 컨트롤을 누를 때 헤더·패널의 텍스트가 선택돼 파랗게 드래그되는
       현상이 있었다. 조작용 UI(헤더·탭·버튼·지도 컨트롤·팝업 버튼)는 선택을 끄고,
       사용자가 복사할 만한 내용(주소·전화번호·팝업 본문)만 선택을 허용한다. */
    header, .stat-bar, .engine-bar, .list-tabs, .fav-cats, .banner,
    .leaflet-control, .leaflet-control-layers-list, .lc, .bm-picker, .ctl-row,
    .pc-actions, .rec .actions, .jb-chip, .jb-stage, .sheet-handle {
      -webkit-user-select:none; user-select:none;
    }
    /* 내용은 복사할 수 있어야 한다 */
    .pc-body, .rec h3, .rec .meta, .leaflet-popup-content .ld-body,
    .rec .actions a[href^="tel:"] { -webkit-user-select:text; user-select:text; }
    /* 지도 위에서 드래그할 때 커서가 텍스트 선택 모양으로 바뀌지 않도록 */
    .leaflet-container { -webkit-user-select:none; user-select:none; }
    .sheet-handle { display:none; }
    /* ── Leaflet custom controls ── */
    /* 폰트 크기는 서울도시공간포털(urban.seoul.go.kr) 실측 기준에 맞춘다 —
       대분류 13px/w500, 중분류 13px/w400. 지도 위 작은 글씨는 가독성이 급격히 떨어져
       기존 12px/10.5px에서 한 단계씩 올렸다. 글자가 커진 만큼 max-width도 함께 넓힌다. */
    /* 정비사업 메뉴는 대분류 4개 + 중분류 9개 + 진행단계 8칩이라 세로가 길다(13px 기준 605px).
       지도 높이(실측 577px)를 넘겨 진행단계 칩이 화면 밖으로 잘리던 문제가 있어 스크롤로 처리한다.
       방식은 서울도시공간포털을 따랐다 — 그쪽 범례는 뷰포트가 아니라 부모 기준으로
       `height:calc(100% - 46px)` + `overflow-y:auto` + 얇은 스크롤바(.thinScroll)를 쓴다.
       여기서도 부모(지도) 기준을 1차 제약으로 두되, 모바일에서는 지도 컨테이너 자체가
       뷰포트를 92px 넘기 때문에(헤더 높이만큼 밀려서 100vh가 잘림) 뷰포트 제약을 함께 건다.
       둘 중 작은 값이 적용돼 데스크톱·모바일 모두에서 패널이 화면 안에 들어온다.
       스크롤이 지도로 전파되면 메뉴를 훑을 때 지도가 확대/축소되므로
       jbCtrl 쪽에 disableScrollPropagation 을 반드시 함께 걸어야 한다. */
    .leaflet-top.leaflet-left { max-height:100%; display:flex; flex-direction:column; }
    .lc { background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:var(--c-shadow); font-size:14px; color:var(--text); padding:11px 13px; line-height:1.7; max-width:232px; min-height:0; max-height:calc(100vh - 240px); overflow-y:auto; overscroll-behavior:contain; }
    .lc-rp { width:190px; min-width:150px; max-width:380px; resize:both; overflow:auto; }
    .lc::-webkit-scrollbar { width:5px; background-color:var(--line); border-radius:2.5px; }
    .lc::-webkit-scrollbar-thumb { border-radius:2.5px; background-color:#c1c1c1; background-clip:padding-box; }
    .lc-title { font-weight:700; font-size:14px; margin-bottom:7px; color:var(--text); letter-spacing:-.1px; }
    .lc-check { display:block; cursor:pointer; font-size:14px; font-weight:400; }
    .lc-check input { vertical-align:middle; margin-right:5px; accent-color:var(--c-primary); }
    .lc-sep { margin:9px 0 6px; padding-top:8px; border-top:1px solid var(--line); }
    .lc-sub { font-weight:600; font-size:14px; margin-bottom:6px; }
    .lc-dot { display:inline-block; width:9px; height:9px; border-radius:50%; vertical-align:middle; margin-right:5px; }
    .jb-stage { font:inherit; font-size:13px; padding:3px 9px; border:1px solid var(--line); border-radius:999px; background:var(--card); color:var(--muted); cursor:pointer; }
    .jb-stage.active { background:var(--c-primary); border-color:var(--c-primary); color:#fff; }
    /* 배경지도 선택 — 네이버지도처럼 썸네일 3종을 나란히 보여준다.
       썸네일은 실제 V-World 타일이라 각 지도가 어떤 모습인지 그대로 미리 보인다. */
    .bm-picker { display:flex; gap:6px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:6px; box-shadow:var(--c-shadow); }
    .bm-item { font:inherit; padding:0; border:2px solid transparent; border-radius:8px; background:var(--card); cursor:pointer; overflow:hidden; width:72px; }
    .bm-thumb { display:block; width:100%; height:44px; background-size:cover; background-position:center; background-color:var(--line); }
    .bm-label { display:block; padding:4px 2px; font-size:13px; font-weight:600; color:var(--muted); white-space:nowrap; }
    .bm-item.on { border-color:var(--c-primary); }
    .bm-item.on .bm-label { color:var(--c-primary); }
    /* 줌(+/−) 버튼과 배경지도 피커를 한 줄로 나란히 놓는 래퍼.
       Leaflet 이 .leaflet-control 에 걸어 두는 코너 여백을 래퍼가 대신 갖는다. */
    /* ── 레이어 트리 패널 (대분류 > 중분류 > 소분류) ──────────────────────
       참조 사이트(서울도시공간포털) 범례가 3단이라 그 구조를 그대로 따랐다.
       Leaflet 기본 레이어 컨트롤은 평평한 목록뿐이라 전용 패널을 쓴다. */
    .lp { position:relative; }
    .lp-toggle { width:34px; height:34px; border:1px solid var(--line); background:var(--card); color:var(--text);
      border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:var(--c-shadow); }
    .lp-toggle svg { width:20px; height:20px; }
    .lp-body { display:none; position:absolute; right:0; top:40px; width:250px; background:var(--card);
      border:1px solid var(--line); border-radius:10px; box-shadow:var(--c-shadow-lg); padding:6px 4px;
      max-height:calc(100vh - 220px); overflow-y:auto; overscroll-behavior:contain; font-size:14px; }
    .lp.open .lp-body { display:block; }
    .lp-body::-webkit-scrollbar { width:14px; }
    .lp-body::-webkit-scrollbar-track { background:var(--line); border-radius:7px; }
    .lp-body::-webkit-scrollbar-thumb { border-radius:7px; background-color:#c1c1c1; border:4px solid var(--card); }
    .lp-body::-webkit-scrollbar-thumb:hover { background-color:#a8a8a8; }
    .lp-sec + .lp-sec { border-top:1px solid var(--line); margin-top:4px; padding-top:4px; }
    .lp-head { display:flex; align-items:center; gap:6px; padding:5px 8px; font-weight:700; cursor:pointer; border-radius:6px; }
    .lp-head:hover { background:var(--c-hover); }
    .lp-arrow { margin-left:auto; color:var(--muted); font-size:16px; line-height:1; padding:4px 2px 4px 8px; cursor:pointer; }
    .lp-sec.closed .lp-kids { display:none; }
    .lp-sec.closed .lp-arrow { transform:rotate(-90deg); display:inline-block; }
    .lp-midhead { display:flex; align-items:center; gap:5px; padding:4px 8px 4px 14px; border-radius:6px; }
    .lp-midhead:hover { background:var(--c-hover); }
    .lp-exp { width:20px; text-align:center; color:var(--muted); cursor:pointer; font-size:16px; line-height:1; flex-shrink:0; padding:4px 0; }
    .lp-exp-none { visibility:hidden; }
    .lp-mid.open .lp-exp { }
    .lp-subs { display:none; padding:2px 0 4px 34px; }
    .lp-mid.open .lp-subs { display:block; }
    .lp-sub { display:flex; align-items:center; gap:5px; padding:3px 4px; cursor:pointer; color:var(--muted); border-radius:5px; }
    .lp-sub:hover { background:var(--c-hover); color:var(--text); }
    .lp-sw { width:14px; height:12px; flex-shrink:0; border:1px solid var(--line); border-radius:2px; object-fit:cover; }
    .lp-cb { flex-shrink:0; accent-color:var(--c-primary); margin:0; }
    .lp-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .ctl-row { display:flex; align-items:stretch; gap:6px; margin:10px 0 0 10px; }
    .ctl-row > .leaflet-control { margin:0 !important; float:none; }
    /* 줌(+/−)은 기본 26px×2 라 썸네일 피커(약 82px)보다 28px 짧아, 피커만 아래로 튀어나왔다.
       줌 버튼을 피커 높이에 맞춰 늘려(각 버튼이 절반씩) 위·아래 끝을 정확히 맞춘다. */
    .ctl-row .leaflet-control-zoom { display:flex; flex-direction:column; }
    .ctl-row .leaflet-control-zoom a { flex:1; height:auto; display:flex; align-items:center; justify-content:center; }
    @media (max-width:760px) {
      /* 좁은 화면에서 줌 버튼 + 썸네일 4개가 가로를 넘기지 않도록 줄인다. */
      .bm-item { width:52px; }
      .bm-thumb { height:32px; }
      .bm-label { font-size:12px; }
      .bm-picker { gap:4px; padding:4px; }
    }
    .rp-stat { font-size:12px; color:var(--muted); margin-top:5px; }
    .jb-perm-badge { color:#fff; font-size:12px; font-weight:600; padding:2px 7px; border-radius:999px; white-space:nowrap; box-shadow:var(--c-shadow); }
    .leaflet-tooltip.jb-perm-tt { background:none; border:none; box-shadow:none; padding:0; }
    .leaflet-tooltip.jb-perm-tt::before { display:none; }
    /* 청약예정 배지 — land.html renderSubscriptions() */
    .sub-badge { display:inline-block; background:#0ca678; color:#fff; font-size:12px; font-weight:700; padding:2px 7px; border-radius:999px; white-space:nowrap; box-shadow:0 1px 3px rgba(0,0,0,.35); border:1.5px solid #fff; cursor:pointer; }
    .sub-badge-wrap { background:none; border:none; }
    /* ── Popup card system ── */
    /* width:100% — 팝업을 리사이즈하면 그 폭에 맞춰 내용이 다시 흐르도록.
       예전엔 264px 고정이라 팝업을 키워도 카드가 그대로여서 여백만 늘었다. */
    .pc { width:100%; min-width:200px; padding:16px; box-sizing:border-box; }
    .pc-head { font-weight:700; font-size:15px; margin-bottom:8px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; line-height:1.35; color:var(--text); }
    .pc-body { font-size:13px; color:var(--muted); margin-bottom:12px; line-height:1.6; }
    .pc-body b { color:var(--text); }
    .pc-actions { display:flex; flex-direction:column; gap:7px; }
    .pc-btn { display:block; width:100%; padding:9px 10px; border-radius:8px; font-family:inherit; font-size:14px; font-weight:500; cursor:pointer; text-align:center; text-decoration:none; box-sizing:border-box; background:var(--card); border:1px solid var(--line); color:var(--text); transition:all .15s; }
    .pc-btn:hover { border-color:var(--c-primary); color:var(--c-primary); }
    .pc-btn-primary { background:var(--c-primary); color:#fff; border:1px solid var(--c-primary); }
    .pc-btn-primary:hover { background:#1a63a8; color:#fff; }
    /* ── CCTV (ITS 국가교통정보센터) ── */
    .cctv-icon { width:26px; height:26px; margin:-26px 0 0 -13px; border-radius:50% 50% 50% 0; background:var(--c-danger); transform:rotate(-45deg); display:flex; align-items:center; justify-content:center; box-shadow:var(--c-shadow); }
    .cctv-icon svg { width:13px; height:13px; color:#fff; transform:rotate(45deg); }
    .cctv-pc { width:min(320px, calc(100vw - 56px)); padding:0; box-sizing:border-box; overflow:hidden; }
    .cctv-pc-head { display:flex; align-items:center; justify-content:space-between; padding:11px 13px; border-bottom:1px solid var(--line); font-weight:700; font-size:14px; }
    .cctv-pc-close { width:24px; height:24px; border-radius:7px; border:none; background:var(--c-hover); color:var(--muted); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .cctv-pc-close:hover { background:var(--line); color:var(--text); }
    .cctv-pc-video { position:relative; height:180px; background:#12151b; display:flex; align-items:center; justify-content:center; color:#9aa3af; font-size:13px; }
    .cctv-pc-video video, .cctv-pc-video img { width:100%; height:100%; object-fit:cover; display:block; }
    .cctv-pc-live { position:absolute; top:8px; left:8px; background:var(--c-danger); color:#fff; font-size:12px; font-weight:700; padding:2px 7px; border-radius:5px; display:flex; align-items:center; gap:4px; }
    .cctv-pc-live span { width:5px; height:5px; border-radius:50%; background:#fff; animation:cctv-blink 1.4s infinite; }
    @keyframes cctv-blink { 50%{opacity:.25;} }
    .cctv-pc-meta { padding:9px 13px 12px; font-size:12px; color:var(--muted); }
    /* Leaflet 이 .leaflet-container a { color:#0078A8 } 를 깔아 두어 흰 글씨 버튼이 파란 배경에
       묻힌다(실측 대비 1.02:1). a + 클래스로 상세도를 높여 흰 글씨를 지킨다. */
    a.pc-btn-primary { color:#fff; }
    a.pc-btn-primary:hover { color:#fff; }
    .pc-btn-outline { background:var(--card); border:1px solid var(--line) !important; color:var(--c-text); }
    .pc-btn-row { display:flex; gap:7px; }
    .pc-btn-row .pc-btn { flex:1; }
    .pc-price { font-size:16px; font-weight:700; color:var(--c-price); margin-top:2px; }
    .unit-row { display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; padding:6px 8px; margin-top:4px; background:var(--card); border:1px solid var(--line); border-radius:8px; cursor:pointer; font:inherit; font-size:13px; color:var(--text); text-align:left; box-sizing:border-box; }
    .unit-row:hover { border-color:var(--c-primary); }
    .unit-row b { color:var(--text); }
    .unit-row .ur-chev { color:var(--muted); font-size:11px; transition:transform .15s; flex-shrink:0; }
    .unit-row.open .ur-chev { transform:rotate(90deg); }
    .unit-detail { display:none; margin:2px 0 2px; padding:7px 9px; border-left:2px solid var(--c-primary); border-radius:0 8px 8px 0; background:var(--c-primary-soft); font-size:12px; color:var(--muted); line-height:1.75; }
    .unit-detail b { color:var(--text); }
    /* ── Leaflet 팝업 (다크모드 배경 + 화면 크기에 맞는 크기) ── */
    .leaflet-popup-content-wrapper { background:var(--card); color:var(--text); border-radius:12px; box-shadow:var(--c-shadow-lg); }
    /* 세로만 스크롤한다. overflow-x 를 막지 않으면 긴 한 줄이 컨테이너를 밀어내 가로 스크롤바가 생긴다
       (예: '공시지가 4,984,000원/㎡ (평당 16,476,032원 · 2025.01 기준)').
       --popup-max-h 는 지도 높이에 맞춰 JS 가 갱신한다. vh 로 고정하면 지도가 화면 일부일 때 팝업이 넘친다. */
    .leaflet-popup-content > * { max-width:100%; }
    /* resize:both — 팝업이 고정 크기라 답답하다는 지적에 따라 사용자가 우하단 모서리를
       끌어 크기를 조절할 수 있게 한다. overflow 가 visible 이 아니어야 동작한다(아래 auto).
       max-width 는 리사이즈 상한이 되어 '넓히기'를 막으므로 넉넉히 준다(화면 폭까지).
       내용은 .pc 가 width:100% 라 늘어난 폭에 맞춰 자동으로 다시 흐른다. */
    .leaflet-popup-content { max-height:var(--popup-max-h, min(62vh, 520px)); overflow:auto; overflow-wrap:anywhere; word-break:break-word; min-width:220px; max-width:calc(100vw - 40px); resize:both; }
    /* 리사이즈 그립이 둥근 모서리에 잘리지 않도록 */
    .leaflet-popup-content-wrapper { overflow:visible; }
    .leaflet-popup-tip { background:var(--card); }
    .leaflet-container a.leaflet-popup-close-button { color:var(--muted); }
    /* ── 호버 툴팁 (건물 위 커서 정지 시 주소·토지·건물 정보) ── */
    .leaflet-tooltip.hov-tip { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 10px; box-shadow:var(--c-shadow-lg); font-size:13px; line-height:1.55; }
    .leaflet-tooltip-top.hov-tip::before { border-top-color:var(--card); }
    .hov-tip .hov-addr { color:var(--muted); }
    .hov-tip .hov-name { font-weight:700; color:var(--text); }
    /* 네이버 부동산 링크는 방문 후 색이 갈리면 안 보이므로 유지한다 */
    a.pc-btn-primary:visited { color:#fff; }
    /* Leaflet 기본 컨트롤은 배경이 흰색으로 고정돼 있어 다크모드에서 메뉴 글씨가 사라진다(실측 1.19:1).
       테마 변수로 따라가게 만든다. */
    .leaflet-control-layers, .leaflet-control-layers-expanded { background:var(--card); color:var(--text); }
    .leaflet-control-layers-separator { border-top-color:var(--line); }
    .leaflet-control-layers-toggle { background-color:var(--card); }
    .leaflet-control-zoom a { background-color:var(--card); color:var(--text); border-color:var(--line); }
    .leaflet-control-zoom a:hover { background-color:var(--c-hover); }
    .leaflet-control-attribution { color:var(--muted); }
    :root.dark .leaflet-control-attribution { background:rgba(27,30,37,.85); }
    /* ── Stage chip bar ── */
    #jb-stage-bar { position:absolute; bottom:18px; left:50%; transform:translateX(-50%); display:flex; gap:6px; padding:6px 10px; background:var(--card); border-radius:999px; box-shadow:var(--c-shadow-lg); z-index:900; max-width:90vw; overflow-x:auto; white-space:nowrap; }
    .jb-chip { padding:6px 14px; border-radius:999px; border:1px solid var(--line); background:var(--card); font-size:13px; cursor:pointer; font-family:inherit; color:var(--muted); transition:all .15s; }
    .jb-chip:hover { border-color:var(--c-primary); color:var(--c-primary); }
    .jb-chip.active { border-color:var(--c-primary); background:var(--c-primary); color:#fff; }
    /* ── Footer ── */
    .site-footer { flex:0 0 auto; position:relative; background:var(--card); border-top:1px solid var(--line);
      padding:9px 18px; display:flex; flex-direction:column; justify-content:center; gap:4px; }
    .footer-resize { position:absolute; top:-6px; left:0; right:0; height:12px; cursor:ns-resize; z-index:5; }
    .footer-resize::after { content:''; position:absolute; top:4px; left:50%; transform:translateX(-50%); width:48px; height:4px; border-radius:2px; background:#c1c4c9; }
    .footer-top { display:flex; align-items:center; gap:16px; }
    .footer-links { flex:1; display:flex; gap:14px; white-space:nowrap; }
    .footer-links a { font-size:13px; color:var(--muted); text-decoration:none; }
    .footer-links a:hover { color:var(--c-primary); }
    .footer-right { flex:1; display:flex; justify-content:flex-end; align-items:center; gap:16px; }
    .footer-stats { flex:0 0 auto; }
    .footer-stats { display:flex; gap:14px; align-items:center; font-size:13px; color:var(--muted); white-space:nowrap; }
    .footer-stats b { font-weight:600; color:var(--text); }
    .footer-stats .footer-note { color:var(--muted); font-size:11px; }
    .footer-admin { flex:none; font-size:12px; font-weight:600; color:var(--accent); text-decoration:none;
      border:1px solid var(--accent); border-radius:6px; padding:2px 10px; margin-left:8px; white-space:nowrap; }
    .footer-admin:hover { background:var(--accent); color:#fff; }
    .footer-contact { font-size:13px; color:var(--muted); white-space:nowrap; }
    .build-tag { opacity:.55; }
    @media (max-width:640px) {
      .layout { display:block; flex:none; }
      #map { height:100vh; min-height:0; }
      .panel { position:fixed; left:0; right:0; bottom:0; max-height:84vh; height:auto; z-index:1200;
        background:var(--card); border-radius:18px 18px 0 0; box-shadow:0 -6px 24px rgba(0,0,0,.18);
        transform:translateY(calc(100% - 138px)); transition:transform .28s ease; }
      .panel.sheet-open { transform:translateY(0); }
      .sheet-handle { display:block; text-align:center; padding:8px 0 6px; position:sticky; top:0; background:var(--card); border-radius:18px 18px 0 0; cursor:pointer; z-index:2; }
      .sheet-handle::before { content:''; display:inline-block; width:42px; height:5px; border-radius:3px; background:#c1c4c9; }
      .site-footer { display:none; }
      header { padding:0 12px; }
      .brand-title { font-size:16px; }
    }
  </style>
</head>

  <script>
    const SUPABASE_URL = 'https://bhgijvaxxjnocgfnaaeu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_rYaGd3kk5UuFBe3TSpFA8g_uGHWwkqM';
    // supabase SDK는 무겁고 초기 지도 렌더와 무관하므로(푸터 통계·로그아웃 전용) 첫 필요 시 로드한다.
    let sb = null;
    let _sbPromise = null;
    function ensureSb() {
      if (_sbPromise) return _sbPromise;
      if (window.supabase) { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); _sbPromise = Promise.resolve(sb); return _sbPromise; }
      _sbPromise = new Promise((resolve) => {

        s.async = true;
        s.onload = () => { try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch (e) { sb = null; } resolve(sb); };
        s.onerror = () => resolve(null);

    }
    const $ = (id) => document.getElementById(id);

    // ── 다크모드 (localStorage 저장, 맛집 지도와 동일 키) ──
    const ICON_SUN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
    const ICON_MOON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
    function applyTheme(dark) { document.documentElement.classList.toggle('dark', dark); const b = $('theme-btn'); if (b) b.innerHTML = dark ? ICON_SUN : ICON_MOON; }
    applyTheme(localStorage.getItem('mj_theme') === 'dark');
    function initThemeBtn() { const b = $('theme-btn'); if (b) b.addEventListener('click', () => { const dark = !document.documentElement.classList.contains('dark'); localStorage.setItem('mj_theme', dark ? 'dark' : 'light'); applyTheme(dark); }); }
    initThemeBtn();

    // ── 최근 본 곳 (부동산 전용 키, 최대 8개) ──
    const RECENT_KEY = 'mj_recent_land';
    function loadRecent() { try { return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); } catch (e) { return []; } }
    function pushRecent(item) { let a = loadRecent().filter((x) => x.key !== item.key); a.unshift(item); a = a.slice(0, 8); try { localStorage.setItem(RECENT_KEY, JSON.stringify(a)); } catch (e) {} renderRecent(); }
    function renderRecent() {
      const a = loadRecent(), el = $('recent'); if (!el) return;
      if (!a.length) { el.style.display = 'none'; return; }
      el.style.display = '';
      el.innerHTML = '최근 본 곳: ' + a.map((x, i) => `<span class="recent-chip" data-i="${i}" style="cursor:pointer;">${esc(x.name)} <b class="recent-del" data-i="${i}" title="삭제" style="cursor:pointer;color:#e03131;margin-left:1px;">✕</b></span>`).join('') + ` <a href="#" class="recent-clear" style="color:var(--muted);font-size:12px;">전체삭제</a>`;
      el.querySelectorAll('.recent-chip').forEach((c) => c.addEventListener('click', (e) => {
        if (e.target.closest('.recent-del')) return;
        e.preventDefault(); const x = a[Number(c.dataset.i)];
        if (x && x.lat != null) map.setView([x.lat, x.lng], 16);
      }));
      el.querySelectorAll('.recent-del').forEach((d) => d.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); const b = loadRecent(); b.splice(Number(d.dataset.i), 1); try { localStorage.setItem(RECENT_KEY, JSON.stringify(b)); } catch (er) {} renderRecent(); }));
      const cl = el.querySelector('.recent-clear'); if (cl) cl.addEventListener('click', (e) => { e.preventDefault(); try { localStorage.removeItem(RECENT_KEY); } catch (er) {} renderRecent(); });
    }

    // ── V-World 인증키: 발급받으면 아래에 넣으세요. 비어 있으면 OSM 지도로 자동 대체 ──
    const VWORLD_KEY = 'B2CDEEDD-D622-311B-883B-CC7890E50822';

    // ── 청약예정 배지 (한국부동산원 청약홈 분양정보 — Edge Function 프록시 경유) ──
    // data.go.kr serviceKey는 프론트에 두지 않는다. supabase/functions/chungak-proxy가
    // 중계하고 키는 서버 secret(CHUNGAK_API_KEY)에만 둔다.
    // ?chungakEndpoint=... 로 로컬 테스트용 엔드포인트를 잠시 바꿀 수 있다.
    const SUBSCRIPTION_ENDPOINT = new URLSearchParams(location.search).get('chungakEndpoint')
      || 'https://bhgijvaxxjnocgfnaaeu.supabase.co/functions/v1/chungak-proxy';
    let _subPromise = null;
    function loadSubscriptions() {
      if (!SUBSCRIPTION_ENDPOINT) return Promise.resolve([]);
      if (_subPromise) return _subPromise;
      const q = new URLSearchParams({
        op: 'getAPTLttotPblancDetail', page: '1', perPage: '50', returnType: 'JSON',
        'cond[SUBSCRPT_AREA_CODE_NM::EQ]': '서울',
      });
      _subPromise = fetch(SUBSCRIPTION_ENDPOINT + '?' + q)
        .then((r) => (r.ok ? r.json() : Promise.reject(new Error('청약API HTTP ' + r.status))))
        .then((j) => {
          const d = new Date();
          const ymd = (x) => `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
          const todayStr = ymd(d);
          const seen = new Set();
          return (Array.isArray(j && j.data) ? j.data : [])
            // 접수가 아직 끝나지 않은(접수중·접수예정) 공고만 배지로 띄운다.
            .filter((x) => x && x.RCEPT_ENDDE && x.RCEPT_ENDDE >= todayStr && x.HSSPLY_ADRES)
            .filter((x) => (seen.has(x.PBLANC_NO) ? false : (seen.add(x.PBLANC_NO), true)))
            .map((x) => ({
              pblancNo: x.PBLANC_NO, name: x.HOUSE_NM || x.PBLANC_NO, addr: x.HSSPLY_ADRES,
              supply: x.TOT_SUPLY_HSHLDCO, pblancDe: x.RCRIT_PBLANC_DE,
              spStart: x.SPSPLY_RCEPT_BGNDE, spEnd: x.SPSPLY_RCEPT_ENDDE,
              rcptStart: x.RCEPT_BGNDE, rcptEnd: x.RCEPT_ENDDE, url: x.PBLANC_URL,
            }));
        })
        .catch((err) => { _subPromise = null; console.warn('청약예정 불러오기 실패:', err); return []; });
      return _subPromise;
    }

    // ── 사업자등록증 조회 (국세청 진위확인·상태조회 — Edge Function 프록시 경유) ──
    // data.go.kr data/15081808. serviceKey는 프론트 금지 → supabase/functions/bizno-proxy가 중계.
    // ?biznoEndpoint=... 로 로컬 테스트용 엔드포인트를 잠시 바꿀 수 있다.
    const BIZNO_ENDPOINT = new URLSearchParams(location.search).get('biznoEndpoint')
      || 'https://bhgijvaxxjnocgfnaaeu.supabase.co/functions/v1/bizno-proxy';
    const _bizFmt = (v) => { const d = v.replace(/[^0-9]/g, '').slice(0, 10); return d.length > 5 ? d.slice(0, 3) + '-' + d.slice(3, 5) + '-' + d.slice(5) : d.length > 3 ? d.slice(0, 3) + '-' + d.slice(3) : d; };
    function openBiznoModal() {
      let m = $('bizno-modal');
      if (!m) {
        m = document.createElement('div'); m.id = 'bizno-modal';
        m.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:3000;display:flex;align-items:center;justify-content:center;padding:16px;';
        m.innerHTML = `<div style="background:var(--card);color:var(--text);border-radius:14px;max-width:440px;width:100%;max-height:82vh;overflow:auto;padding:20px;box-shadow:var(--c-shadow-lg);">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <b style="font-size:16px;">사업자등록증 조회</b>
            <button id="bizno-close" style="border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:7px;padding:6px 10px;cursor:pointer;font:inherit;">닫기</button>
          </div>
          <div style="font-size:13px;color:var(--muted);margin-bottom:12px;">사업자등록번호를 입력하세요(하이픈 자동 입력). 대표자·개업일을 함께 입력하면 국세청 등록 정보와 <b>진위 일치</b> 여부까지 확인합니다.</div>
          <div style="font-size:13px;color:var(--muted);margin-bottom:4px;">사업자등록번호 <span style="color:var(--c-primary);">*</span></div>
          <input id="bizno-input" inputmode="numeric" maxlength="12" placeholder="123-45-67890"
            style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit;font-size:15px;margin-bottom:10px;">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">
            <div>
              <div style="font-size:13px;color:var(--muted);margin-bottom:4px;">대표자</div>
              <input id="bizno-name" maxlength="30" placeholder="홍길동" style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit;font-size:15px;">
            </div>
            <div>
              <div style="font-size:13px;color:var(--muted);margin-bottom:4px;">개업일자</div>
              <input id="bizno-date" type="date" max="${new Date().toISOString().slice(0, 10)}" style="width:100%;box-sizing:border-box;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit;font-size:15px;">
            </div>
          </div>
          <div style="font-size:13px;color:var(--muted);margin-bottom:10px;">상호(선택)</div>
          <input id="bizno-bname" maxlength="50" placeholder="(주)OO부동산"
            style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit;font-size:15px;margin-bottom:12px;">
          <button id="bizno-go" style="width:100%;padding:11px;border:none;border-radius:8px;background:var(--c-primary);color:#fff;font:inherit;font-size:15px;font-weight:700;cursor:pointer;">조회하기</button>
          <div id="bizno-hist" style="display:none;"></div>
          <div id="bizno-result" style="margin-top:14px;display:none;"></div>
        </div>`;
        document.body.appendChild(m);
        m.addEventListener('click', (e) => { if (e.target === m) m.style.display = 'none'; });
        $('bizno-close').onclick = () => { m.style.display = 'none'; };
        $('bizno-go').onclick = lookupBizno;
        $('bizno-input').addEventListener('input', (e) => { const f = _bizFmt(e.target.value || ''); if (f !== e.target.value) { e.target.value = f; try { e.target.setSelectionRange(f.length, f.length); } catch (er) {} } });
        ['bizno-input', 'bizno-name', 'bizno-date', 'bizno-bname'].forEach((id) => $(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') lookupBizno(); }));
      }
      m.style.display = 'flex';
      renderBiznoHist();
      setTimeout(() => $('bizno-input').focus(), 50);
    }
    // ── 최근 조회 기록 (localStorage) ──
    const BIZNO_HIST_KEY = 'bizno_history';
    const _bizColor = (b) => b === '계속사업자' || b === '진위 일치' ? '#0ca678' : b === '휴업자' ? '#f59f00' : b === '불일치' || b === '폐업자' ? '#e03131' : '#868e96';
    const _bizHistLoad = () => { try { const a = JSON.parse(localStorage.getItem(BIZNO_HIST_KEY) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } };
    const _bizHistSave = (a) => { try { localStorage.setItem(BIZNO_HIST_KEY, JSON.stringify(a.slice(0, 10))); } catch (e) {} };
    const _bizHistAdd = (h) => { const a = _bizHistLoad(); a.unshift(Object.assign({ id: Date.now() + '-' + Math.random().toString(36).slice(2, 7) }, h)); _bizHistSave(a); };
    function renderBiznoHist() {
      const el = $('bizno-hist'); if (!el) return;
      const a = _bizHistLoad();
      if (!a.length) { el.style.display = 'none'; el.innerHTML = ''; return; }
      const fmt = (bno) => `${bno.slice(0, 3)}-${bno.slice(3, 5)}-${bno.slice(5)}`;
      el.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
          <b style="font-size:14px;">최근 조회</b>
          <button id="bizno-hist-clear" style="border:none;background:none;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline;">전체 삭제</button>
        </div>
        ${a.map((h) => `<div data-bno="${h.bno}" data-name="${esc(h.name || '')}" data-bname="${esc(h.bname || '')}" data-start="${h.startDt || ''}"
          style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer;">
          <div style="min-width:0;">
            <div style="font-size:14px;font-weight:600;">${fmt(h.bno)}${h.bname ? ' · ' + esc(h.bname) : ''}</div>
            <div style="font-size:12px;color:var(--muted);">${esc(h.name || '번호만 조회')} · ${new Date(h.ts).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</div>
          </div>
          <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
            <span style="display:inline-block;padding:2px 8px;border-radius:999px;background:${_bizColor(h.badge)};color:#fff;font-size:12px;font-weight:700;">${esc(h.badge || '')}</span>
            <button data-del="${h.id}" title="기록 삭제" aria-label="기록 삭제" style="border:none;background:none;color:var(--c-danger);font:inherit;font-size:14px;cursor:pointer;line-height:1;">✕</button>
          </div>
        </div>`).join('')}`;
      el.style.display = 'block';
      el.onclick = (e) => {
        if (e.target.id === 'bizno-hist-clear') { _bizHistSave([]); renderBiznoHist(); return; }
        const del = e.target.closest('[data-del]');
        if (del) { _bizHistSave(_bizHistLoad().filter((h) => h.id !== del.dataset.del)); renderBiznoHist(); return; }
        const row = e.target.closest('[data-bno]');
        if (row) {
          $('bizno-input').value = `${row.dataset.bno.slice(0, 3)}-${row.dataset.bno.slice(3, 5)}-${row.dataset.bno.slice(5)}`;
          $('bizno-name').value = row.dataset.name || '';
          const sd = row.dataset.start || '';
          $('bizno-date').value = sd ? `${sd.slice(0, 4)}-${sd.slice(4, 6)}-${sd.slice(6, 8)}` : '';
          $('bizno-bname').value = row.dataset.bname || '';
        }
      };
    }
    function lookupBizno() {
      const box = $('bizno-result');
      const digits = ($('bizno-input').value || '').replace(/[^0-9]/g, '');
      const name = ($('bizno-name').value || '').trim();
      const bname = ($('bizno-bname').value || '').trim();
      const startDt = ($('bizno-date').value || '').replace(/-/g, '');
      box.style.display = 'block';
      if (!/^[0-9]{10}$/.test(digits)) { box.innerHTML = '<span style="color:var(--c-danger);font-size:14px;">사업자등록번호 10자리를 입력하세요.</span>'; return; }
      const validate = !!(name && startDt);
      if ((name || startDt) && !validate) {
        box.innerHTML = '<span style="color:var(--c-danger);font-size:14px;">진위확인은 대표자와 개업일자를 <b>모두</b> 입력해야 합니다. 번호만 입력하면 상태조회만 됩니다.</span>';
        if (name && $('bizno-date')) $('bizno-date').focus();
        if (startDt && $('bizno-name')) $('bizno-name').focus();
        return;
      }
      box.innerHTML = '<span style="color:var(--muted);font-size:14px;">조회 중…</span>';
      $('bizno-go').disabled = true;
      const url = BIZNO_ENDPOINT + '?op=' + (validate ? 'validate' : 'status');
      const payload = validate ? { businesses: [{ b_no: digits, start_dt: startDt, p_nm: name, b_nm: bname }] } : { b_no: [digits] };
      fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload) })
        .then((r) => (r.ok ? r.json() : Promise.reject(new Error('조회 API HTTP ' + r.status))))
        .then((j) => {
          const row = Array.isArray(j && j.data) ? j.data[0] : null;
          if (!row) throw new Error('응답에 조회 결과가 없습니다.');
          const badge = (txt, color) => `<span style="display:inline-block;padding:3px 10px;border-radius:999px;background:${color};color:#fff;font-size:13px;font-weight:700;">${txt}</span>`;
          const fmtBno = `${digits.slice(0, 3)}-${digits.slice(3, 5)}-${digits.slice(5)}`;
          let badgeTxt = '';
          if (validate) {
            const ok = String(row.valid) === '01';
            badgeTxt = ok ? '진위 일치' : '불일치';
            const stt = row.b_stt;
            const endDt = row.end_dt ? `${row.end_dt.slice(0, 4)}-${row.end_dt.slice(4, 6)}-${row.end_dt.slice(6, 8)}` : '';
            const rows = [
              ['사업자등록번호', fmtBno],
              ['상호', bname || '—'],
              ['대표자', name],
              ['개업일자', `${startDt.slice(0, 4)}-${startDt.slice(4, 6)}-${startDt.slice(6, 8)}`],
              ...(ok && stt ? [['사업 상태', stt]] : []),
              ...(ok && row.tax_type ? [['과세유형', row.tax_type]] : []),
              ...(ok && endDt ? [['폐업일자', endDt]] : []),
            ];
            box.innerHTML = `<div style="margin-bottom:10px;">${badge(ok ? '진위 일치' : '불일치', ok ? '#0ca678' : '#e03131')}</div>
              <table style="width:100%;border-collapse:collapse;font-size:14px;">
              ${rows.map(([k, v]) => `<tr><td style="padding:6px 4px;color:var(--muted);white-space:nowrap;">${k}</td><td style="padding:6px 4px;font-weight:600;">${v}</td></tr>`).join('')}

    // ── 카카오 실시간 장소검색 (REST API, 도메인 등록 불필요) ──
    const KAKAO_JS_KEY = '725e7ddf965a3ffff3da1f2ac771cc57'; // developers.kakao.com 앱 > 앱키 > JavaScript 키 (Web 도메인 등록 필요). 비우면 버튼 숨김.

    // ── 지도 초기화 (서울 중심) ──
    // preferCanvas: 벡터(마커 9천개 + 폴리곤 정점 4.2만개)를 SVG DOM 대신 캔버스 1장에 그린다.
    // SVG 렌더러는 도형마다 <path> DOM을 만들고 팬/줌마다 전부 좌표를 재계산해서 지도가 버벅인다.
    // 팝업 폭 기본값. 정하지 않으면 Leaflet 이 내용 폭을 그대로 재서 지도를 넘는 팝업이 나온다.
    L.Popup.mergeOptions({ maxWidth: 340, minWidth: 220, autoPanPadding: [16, 24] });

    // 팝업 최대 높이를 지도 높이에 맞춘다. vh 고정이면 지도가 화면 일부일 때 팝업이 지도 밖으로 넘친다.
    // 내용은 건드리지 않는다 — popup.update() 는 innerHTML 을 다시 그려서 비동기로 채운 내용을 지운다.
    function syncPopupMaxHeight() {
      // getSize() 는 캐시값이라 레이아웃이 잡히기 전엔 0 이 나온다. 그때는 실제 DOM 높이를 쓴다.

    // 타일·클러스터·팝업 위치를 계산해 화면과 어긋난다.

    // 초기 1회 보정은 타이밍을 놓치기 쉽다. 실측: whenReady + 300ms + ResizeObserver 를 모두
    // 걸었는데도 map._size 가 {0,0} 인 채 남아 타일이 1장만 그려졌다(수동 invalidateSize 로는 즉시 복구).
    // ResizeObserver 는 '크기 변화'에만 발화하므로, 관측 시작 시점이 어긋나면 다시 오지 않는다.
    // 그래서 실제로 크기가 잡힐 때까지 짧게 재시도하고, 확인되면 멈춘다.
    let _sizeTries = 0;
    (function ensureMapSize() {
      const el = map.getContainer();
      if (el.clientWidth > 0 && el.clientHeight > 0) {
        refreshMapSize();
        if (map.getSize().y > 0) return;   // 확정 — 폴링 종료
      }
      if (_sizeTries++ < 40) setTimeout(ensureMapSize, 100);   // 최대 4초
    })();

    // 이후의 컨테이너 크기 변화(창 리사이즈, 패널 접기 등)는 관측으로 따라간다
    if (window.ResizeObserver) new ResizeObserver(refreshMapSize).observe(map.getContainer());
    else window.addEventListener('resize', refreshMapSize);
    // V-World 다중 배경지도 (일반/항공영상/하이브리드) — S-Map 유사 룩.
    // Satellite는 jpeg, Base·Hybrid는 png (실측 확인). 우측 상단 레이어에서 전환.
    const vTile = (layer, ext) => L.tileLayer(
      `https://api.vworld.kr/req/wmts/1.0.0/${VWORLD_KEY}/${layer}/{z}/{y}/{x}.${ext}`,
      { maxZoom: 19, attribution: '© V-World' });
    const osmBase = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      { maxZoom: 19, attribution: '© OpenStreetMap' });
    const baseLayers = VWORLD_KEY ? {
      '일반지도': vTile('Base', 'png'),
      '항공영상': vTile('Satellite', 'jpeg'),
      '항공+라벨': L.layerGroup([vTile('Satellite', 'jpeg'), vTile('Hybrid', 'png')]),
      'OSM (대체)': osmBase,
    } : { 'OSM': osmBase };
    const defaultBase = baseLayers['일반지도'] || baseLayers['OSM'];
    defaultBase.addTo(map);
    // 기본(일반지도) 타일 실패 시 OSM 자동 대체
    if (VWORLD_KEY) { let fell = false; defaultBase.on('tileerror', () => { if (!fell) { fell = true; map.removeLayer(defaultBase); osmBase.addTo(map); } }); }

    // 실거래가 JSON은 딱 한 번만 받는다 (Promise 메모이즈). 이전엔 페이지 로드 + 레이어 켤 때 중복 다운로드됨.
    //
    // 파일이 두 종류다. 새 파일을 먼저 시도하고 없으면 옛 파일로 물러선다.
    //  realprice_apt.json      (신) 압축 포맷. 지번을 지오코딩한 정확한 좌표 + 전세가율·거래유형.
    //  realprice_seoul_gg.json (구) 객체 배열. 좌표 출처가 불명확해 클릭 지점과 건물이 어긋났다.
    // 두 포맷을 같은 객체 모양으로 되살려서, 이후 코드(마커·팝업·근처 통계)는 차이를 모르게 한다.
    let _rpPromise = null;
    let rpSource = '';        // 어느 파일을 썼는지 (팝업 표시 판단에 사용)
    function decodeCompactRp(j) {
      const F = {};
      j.fields.forEach((f, i) => { F[f] = i; });
      const pick = (r, k) => (F[k] === undefined ? undefined : r[F[k]]);
      return j.rows.map((r) => ({
        name: r[F.name], gu: j.gus[r[F.gu]], dong: j.dongs[r[F.dong]],
        lat: r[F.lat], lng: r[F.lng], priceEok: r[F.price], area: r[F.area],
        floor: r[F.floor], build: r[F.build], ymd: r[F.ymd],
        cnt: pick(r, 'cnt'), pmin: pick(r, 'pmin'), pmax: pick(r, 'pmax'),
        jeonse: pick(r, 'jeonse') || 0, jrate: pick(r, 'jrate') || 0,
        gbn: j.gbns && F.gbn !== undefined ? j.gbns[r[F.gbn]] : '',
        cancel: pick(r, 'cancel') ? 1 : 0, lease: pick(r, 'lease') ? 1 : 0,
      }));
    }
    // realprice_apt.json 이 없는 동안 매 로드마다 404 를 헛으로 쏘지 않도록,
    // 404 (파일 진짜 부재)를 세션 동안 기억한다. 배포로 파일이 생기면 6시간 안에
    // 그 사실만으로 못 보게 되는 건 막고 싶어 TTL 을 준다. 네트워크 오류는 404 가
    // 아니므로 캐시하지 않는다 — 일시 장애가 '파일 없음'으로 고착되는 것을 방지.
    const APT_MISS_KEY = 'rp_apt_missing', APT_MISS_TTL = 6 * 3600 * 1000;
    function aptMissingCached() {
      try {
        const v = sessionStorage.getItem(APT_MISS_KEY);
        const t = Number(v);
        return Boolean(v) && Number.isFinite(t) && Date.now() - t < APT_MISS_TTL;
      } catch (e) { return false; }
    }
    function loadRp() {
      if (_rpPromise) return _rpPromise;
      const tryApt = !aptMissingCached();
      _rpPromise = (tryApt
        ? fetch('realprice_apt.json')
        : Promise.reject({ _missing: true }))
        .then((r) => {
          if (r.ok) return r.json();
          const e = new Error('no apt file'); e._missing = true; throw e;
        })
        .then((j) => {
          try { sessionStorage.removeItem(APT_MISS_KEY); } catch (e) {}
          rpSource = 'apt'; rpRows = decodeCompactRp(j); return rpRows;
        })
        .catch((err) => {
          if (err && err._missing) { try { sessionStorage.setItem(APT_MISS_KEY, String(Date.now())); } catch (e) {} }
          return fetch('realprice_seoul_gg.json')
            .then((r) => r.json())
            .then((rows) => { rpSource = 'legacy'; rpRows = rows; return rows; })
            .catch(() => null);
        });
      return _rpPromise;
    }
    let rpRows = null;  // 실거래가 원본 (실거래가 레이어 켜면 로드됨) — 지도 클릭 정보/근처 실거래에서 참조. VWORLD 블록보다 먼저 선언(TDZ 방지)
    let _jbRowsGlobal = null; // 정비사업 행 전역 참조 (VWORLD 블록 밖 클릭 핸들러에서 참조)
    // ── 공용 헬퍼 ────────────────────────────────────────────────
    // 아래 3개는 반드시 최상위 스코프에 둔다.
    // 과거에 이 함수들을 `if (VWORLD_KEY) { }` 블록 안에 두었다가 두 가지 사고가 났다:
    //  (1) 블록 밖 지도 클릭 핸들러에서 ageColor 호출 → ReferenceError →
    //      팝업이 '정보 불러오는 중…'에서 영구 정지
    //  (2) 밖에서 쓰려고 같은 로직을 복사해 둔 사본이 생겨 4벌/2벌로 늘어남
    // 새 헬퍼를 추가할 때도 블록 안이 아니라 여기에 둘 것.

    // 노후도(건축년도) 색상
    const ageColor = (b) => { const y = parseInt(b) || 0; return !y ? '#868e96' : y >= 2015 ? '#2f9e44' : y >= 2005 ? '#94d82d' : y >= 1995 ? '#fab005' : y >= 1985 ? '#fd7e14' : '#e03131'; };
    // 두 좌표 사이 대략 거리(km). 서울권 한정 근사식(위도 1도≈111km, 경도 1도≈88km).
    const kmDist = (lat1, lng1, lat2, lng2) => { const dy = (lat1 - lat2) * 111, dx = (lng1 - lng2) * 88; return Math.sqrt(dx * dx + dy * dy); };
    // 정비사업 유형 분류 + 색상 — 대분류 구조는 서울도시공간포털 도시계획사업 메뉴(BZ1xx 정비 / BZ2xx 소규모 /
    // BZ3xx 역세권 / BZ4xx 재정비 / BZ5xx 국토부 / BZ6xx 기타)를 따름. 분류는 bz(사업유형코드)가 1순위.
    const JB_COLOR = { '신통': '#e8590c', '재개발': '#e03131', '재건축': '#7048e8', '지역주택': '#1c7ed6', '재정비촉진': '#f08c00', '모아': '#2f9e44', '역세권': '#0c8599', '노후계획도시': '#5c7cfa', '기타': '#868e96' };
    // 대분류(도시계획사업 메뉴 구조) → 표시 그룹 순서
    const JB_SEC = [['정비사업', ['신통', '재개발', '재건축', '지역주택', '재정비촉진']], ['소규모정비', ['모아']], ['역세권', ['역세권']], ['국토부·기타', ['노후계획도시', '기타']]];
    function jbGroup(d) {
      const bz = (d && d.bz) || '';
      const g = (d && d.gubun) || (typeof d === 'string' ? d : '') || '';
      const n = (d && d.name) || '';
      if (bz) {
        if (bz.indexOf('BZ101') === 0) return '신통';
        if (bz.indexOf('BZ2') === 0) return '모아';
        if (bz.indexOf('BZ3') === 0) return '역세권';
        if (bz.indexOf('BZ4') === 0) return '재정비촉진';
        if (bz.indexOf('BZ5') === 0) return '노후계획도시';
        if (bz.indexOf('BZ6') === 0) return '기타';
        if (g.indexOf('지역주택') >= 0) return '지역주택';
        if (g.indexOf('재건축') >= 0) return '재건축';
        return '재개발';
      }
      // 이전 수동 시드(정보몽땅, bz 없음)와의 호환 fallback
      if (n && /신속통합기획|신통|통합구역/.test(n)) return '신통';
      if (g.indexOf('신통') >= 0) return '신통';
      if (g.indexOf('가로') >= 0 || g.indexOf('소규모') >= 0 || g.indexOf('모아') >= 0) return '모아';
      if (g.indexOf('재건축') >= 0) return '재건축';
      if (g.indexOf('재개발') >= 0) return '재개발';
      if (g.indexOf('지역주택') >= 0) return '지역주택';
      return '기타';
    }

    // ── [토지 레이어] V-World 국토·토지정보 오버레이 (토글) ─────────────────
    // 근거: V-World 공개 WMS(api.vworld.kr) / 서울 토지정보 land.seoul.go.kr.
    // 우측 상단 레이어 버튼에서 켜고 '줌인'하면 필지·용도지역이 색으로 표시됩니다.
    // (광역 줌에서는 비어 보일 수 있음 — 지적/용도지역은 확대해야 그려짐.)
    if (VWORLD_KEY) {
      // 주의: STYLES는 넘기지 않는다 — Leaflet 기본값(styles:'')이 이미 있어,
      // 중복 지정하면 'STYLES=&STYLES='가 되어 V-World가 타일을 거부한다(빈 화면 원인).
      // CRS도 넘기지 않는다 — Leaflet 1.9의 TileLayer.WMS가 onAdd에서 자동으로
      // 'crs=EPSG:3857'(지도 CRS)을 주입하며, V-World는 이를 수용한다.
      // 명시적으로 넣으면 'CRS=...&CRS=...' 중복 파라미터가 되어 거부될 수 있다.
      // (행정경계 레이어는 CRS 미지정 시 빈 타일을 반환하므로 Leaflet 자동 CRS가 필수.)
      const wms = (layers, opacity) => L.tileLayer.wms('https://api.vworld.kr/req/wms', {
        layers, format: 'image/png', transparent: true, version: '1.3.0', uppercase: true,
        KEY: VWORLD_KEY, DOMAIN: location.origin,
        opacity, attribution: '© V-World', maxZoom: 19,
      });
      // ── 서울 UPIS 주제도 (참조: urban.seoul.go.kr) ────────────────────────
      // 참조 사이트가 쓰는 ArcGIS MapServer 를 그대로 타일로 붙인다. 데이터·기호·라벨은
      // 물론 minScale(축척이 작으면 서버가 빈 이미지를 준다)까지 그쪽과 동일하게 동작한다.
      // MapServer 는 http 라 https 페이지에서 직접 못 부르고, 서울시가 열어 둔 프록시를 탄다.
      const UPIS_PROXY = 'https://urban.seoul.go.kr/proxy/proxy.jsp?';
      const UPIS_MAP = 'http://98.33.2.225:6080/arcgis/rest/services/UPIS/20200526_WMS/MapServer';
      const UpisTile = L.TileLayer.extend({
        getTileUrl(coords) {
          const crs = this._map.options.crs;
          const [nwLL, seLL] = this._tileCoordsToNwSe(coords);
          const nw = crs.project(nwLL), se = crs.project(seLL);
          const s = this.getTileSize();
          return UPIS_PROXY + UPIS_MAP + '/export'
            + `?bbox=${nw.x},${se.y},${se.x},${nw.y}&bboxSR=102100&imageSR=102100`
            + `&size=${s.x},${s.y}&format=png32&transparent=true&dpi=96`
            + `&layers=show:${this.options.upisLayers}&f=image`;
        },
      });
      // 레이어 id 는 MapServer 의 ?f=pjson 목록에서 확인했고, 각 묶음이 실제로 그려지는지
      // export 호출로 하나씩 검증했다(빈 이미지 2.2KB 와 비교).
      const upis = (ids, opacity) => new UpisTile('', {
        upisLayers: ids, opacity: opacity == null ? 0.75 : opacity, maxZoom: 19,
        attribution: '© 서울도시공간포털',
      });

      // 레이어 코드는 V-World 공식 WMS 가이드에서 확인함(추측 아님).
      // 일부(그린벨트·진흥지구)는 도심 중앙엔 데이터가 없어 외곽에서 보임 — 정상.
      // 토지거래허가구역 — 서울시 UPIS 실제 경계(tools/collect_toji.js 로 생성).
      // 예전엔 '지정 동 전체를 칠하는 근사치'였는데, 서울 행정동 경계가 한강 수면까지
      // 포함해 압구정·여의도 앞 한강이 통째로 칠해졌다(사용자 제보). 지금은 필지 단위
      // 실제 경계에서 하천 폴리곤을 뺀 데이터라 강기슭에서 정확히 끊긴다.
      // 렌더러는 캔버스 대신 SVG를 강제: 캔버스는 팬/줌 후 이전 transform(scale/translate)이
      // 남아 폴리곤이 지도와 어긋나 보이는 스테일 버그가 있었음. SVG는 moveend마다 좌표를
      // 다시 투영해 항상 타일·마커와 일치한다. (손으로 켜는 단일 오버레이라 SVG 비용 허용
      // 범위 — 무거운 9천 마커 계열은 캔버스 유지)
      const tojiLayer = L.geoJSON(null, {
        // noClip: 줌인하면 구역 상당수가 뷰포트(렌더러 패딩) 밖으로 밀려나 'M0 0'으로
        // 접히는 Leaflet 클리핑을 회피. 수백 개 규모라 항상 전부 그려도 감당 가능하다.
        noClip: true,
        renderer: L.svg(),
        // 참조 사이트(서울도시공간포털)와 동일하게 '외곽선만' 그린다.
        // 채우면 자치구 전역 지정(서초 46.9㎢·강남 39.5㎢ 등)이 도시 전체를 덮어
        // 한강까지 색칠된 것처럼 보인다. 그쪽도 채움 없이 얇은 테두리 + 라벨만 쓴다.
        style: () => tojiStyle(),
        onEachFeature: (f, layer) => layer.bindTooltip(`토지거래허가구역 · ${f.properties.name}`, { sticky: true }),
      });
      // 참조 사이트는 이 레이어에 minScale 1:50,000 을 걸어, 축척이 그보다 작으면(=많이 축소하면)
      // 아예 그리지 않는다. 서울 전역이 한꺼번에 보이는 축척에서 구역선이 도시를 뒤덮는 걸 막는 장치다.
      // Leaflet 줌 14 ≈ 1:35,000, 줌 13 ≈ 1:70,000 이라 14를 경계로 잡는다.
      const TOJI_MIN_ZOOM = 14;
      const tojiStyle = () => ({
        color: '#e8590c', weight: 1.5, fill: false,
        opacity: map.getZoom() >= TOJI_MIN_ZOOM ? 1 : 0,
      });
      function applyTojiZoom() { if (map.hasLayer(tojiLayer)) tojiLayer.setStyle(tojiStyle()); }
      map.on('zoomend', applyTojiZoom);
      // 2.5MB 지오JSON이라 시작 시 로드를 피하고, 레이어 첫 활성화(overlayadd) 때만 1회 fetch.
      // ?v= 는 캐시 무효화용 — 데이터를 갈아끼울 때마다 올린다(정비사업 json 과 같은 방식).
      let _tojiLoaded = false;
      map.on('overlayadd', (e) => {
        if (e.layer !== tojiLayer) return;
        applyTojiZoom();
        if (_tojiLoaded) return;
        _tojiLoaded = true;
        fetch('toji_heoga.geojson?v=2').then((r) => r.json()).then((gj) => { tojiLayer.addData(gj); applyTojiZoom(); }).catch(() => {});
      });

      // ── 아파트 실거래가·노후도 (서울+경기 9천여 단지) : 필터 + 범례 + 카드 팝업 ──
      const realpriceCluster = L.markerClusterGroup({ chunkedLoading: true, maxClusterRadius: 60 });
      // 팝업·툴팁은 마우스가 닿는 순간에만 생성 (9천개 미리 만들면 지도가 멈춘다)
      realpriceCluster.on('mouseover', (e) => {
        const m = e.layer, d = m && m._rp;
        if (!d || m._ttDone) return;
        m._ttDone = 1;
        m.bindTooltip(d.priceEok == null ? esc(d.name) : d.priceEok + '억', { direction: 'top' }).openTooltip();
      });
      realpriceCluster.on('click', (e) => {
        const m = e.layer;
        if (!m || !m._rp) return;
        if (!m.getPopup() && m._pop) m.bindPopup(m._pop());
        m.openPopup();
      });
      rpRows = null;
      const rpFilter = { price: 'all', age: 'all' };
      const inPrice = (p) => { if (rpFilter.price === 'all') return true; if (p == null) return false; const v = Number(p); return rpFilter.price === 'u10' ? v < 10 : rpFilter.price === '10_20' ? (v >= 10 && v < 20) : rpFilter.price === '20_30' ? (v >= 20 && v < 30) : v >= 30; };
      const inAge = (b) => { if (rpFilter.age === 'all') return true; const y = parseInt(b) || 0; return rpFilter.age === 'new' ? y >= 2015 : rpFilter.age === 'mid' ? (y >= 2000 && y < 2015) : (y > 0 && y < 2000); };
      function rpBuild() {
        if (!rpRows) return;
        realpriceCluster.clearLayers();
        realpriceCluster.addLayers(rpRows.filter((d) => inPrice(d.priceEok) && inAge(d.build)).map((d) => {
          const m = L.circleMarker([d.lat, d.lng], { radius: 5, color: '#fff', weight: 1, fillColor: ageColor(d.build), fillOpacity: 0.9 });
          m._rp = d;
          m._pop = (() => `<div class="pc"><div class="pc-head"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${ageColor(d.build)};flex-shrink:0;"></span><span class="rp-name">${esc(d.name)}</span></div><div class="pc-body"><div style="margin-bottom:4px;">${esc(d.gu)} ${esc(d.dong)}</div><div class="pc-price">매매 ${d.priceEok == null ? '-' : d.priceEok + '억'}</div><div style="margin-top:3px;">평단가: ${d.area && d.priceEok ? Math.round(d.priceEok * 10000 / d.area).toLocaleString() + '만원/㎡' : '-'}</div><div style="margin-top:3px;">전용 ${esc(d.area)}㎡ · ${esc(d.floor)}층 · 거래 ${esc(d.ymd)}</div><div style="margin-top:3px;">${esc(d.build || '?')}년 건축${parseInt(d.build) <= 1994 ? '<span style="background:#e03131;color:#fff;font-size:12px;padding:2px 8px;border-radius:999px;margin-left:6px;">재건축연한 초과</span>' : ''}</div>${jeonseHtml(d, '평형 기준')}${rpFlagsHtml(d)}<div class="rp-radius-stat rp-stat" style="display:none;"></div></div><div class="pc-actions"><button class="rp-save pc-btn pc-btn-outline" style="border-color:var(--c-price) !important;color:var(--c-price);">저장</button><a href="https://map.naver.com/p/search/${encodeURIComponent(d.name + ' ' + (d.dong || d.gu || ''))}?c=${d.lng},${d.lat},17,0,0,0,dh" target="_blank" rel="noopener" class="pc-btn pc-btn-primary rp-naver">네이버 부동산</a><div class="pc-btn-row"><button class="rt-start pc-btn pc-btn-outline">출발</button><button class="rt-end pc-btn pc-btn-outline">도착</button></div><button class="sv-btn pc-btn pc-btn-outline">거리뷰</button></div></div>`);
          return m;
        }));
      }
      const rpFilterCtrl = L.control({ position: 'topleft' });
      rpFilterCtrl.onAdd = () => {
        const div = L.DomUtil.create('div');
        div.className = 'lc lc-rp';
        div.innerHTML = '<div class="lc-title">실거래가 필터</div>'
          + '<label style="display:block;margin-bottom:6px;">실거래가 <select id="rp-price" style="font:inherit;font-size:13px;"><option value="all">전체</option><option value="u10">10억 이하</option><option value="10_20">10~20억</option><option value="20_30">20~30억</option><option value="o30">30억+</option></select></label>'
          + '<label style="display:block;">건축년도 <select id="rp-age" style="font:inherit;font-size:13px;"><option value="all">전체</option><option value="new">2015~ 신축</option><option value="mid">2000~2014</option><option value="old">2000 이전</option></select></label>';
        L.DomEvent.disableClickPropagation(div);
        return div;
      };
      const rpLegend = L.control({ position: 'topleft' });
      rpLegend.onAdd = () => {
        const div = L.DomUtil.create('div');
        div.className = 'lc lc-rp';
        const row = (c, t) => `<div><span class="lc-dot" style="background:${c};"></span>${t}</div>`;
        div.innerHTML = '<div class="lc-title">건축년도 (노후도)</div>' + row('#2f9e44', '신축 2015~') + row('#94d82d', '2005~2014') + row('#fab005', '1995~2004') + row('#fd7e14', '1985~1994') + row('#e03131', '노후 ~1984') + row('#868e96', '미상');
        // 코너 드래그로 크기 조절할 때 mousedown이 지도까지 전파돼 지도가 함께 팬되는 것 방지
        L.DomEvent.disableClickPropagation(div);
        return div;
      };
      // 가격·건축년도 필터와 노후도 범례는 아파트/연립다세대 두 레이어가 공용으로 쓴다.
      // 레이어별로 배선 코드를 복사하면 또 갈라지므로 한 곳에 모아둔다.
      function showPriceFilter() {
        rpFilterCtrl.addTo(map);
        rpLegend.addTo(map);
        setTimeout(() => {
          const ps = document.getElementById('rp-price'), ag = document.getElementById('rp-age');
          if (ps && !ps._w) { ps._w = 1; ps.value = rpFilter.price; ps.addEventListener('change', () => { rpFilter.price = ps.value; rpBuild(); villaBuild(); }); }
          if (ag && !ag._w) { ag._w = 1; ag.value = rpFilter.age; ag.addEventListener('change', () => { rpFilter.age = ag.value; rpBuild(); villaBuild(); }); }
        }, 60);
      }
      map.on('overlayadd', (e) => {
        if (e.layer !== realpriceCluster) return;
        showPriceFilter();
        // 이미 받아둔 경우에도 반드시 rpBuild()를 호출해야 마커가 그려진다 (예전엔 early-return으로 빈 레이어가 됐음)
        loadRp().then(() => rpBuild());
      });
      map.on('overlayremove', (e) => {
        // 연립·다세대 레이어가 아직 켜져 있으면 공용 컨트롤을 지우지 않는다
        if (e.layer !== realpriceCluster || map.hasLayer(villaCluster)) return;
        map.removeControl(rpFilterCtrl);
        map.removeControl(rpLegend);
      });

      // ── 연립·다세대 실거래가 (서울 23,708개 건물) ──────────────────
      // 국토부 '연립다세대 매매' 12개월치를 건물(지번) 단위로 묶은 것. tools/collect_realprice.js 산출물.
      // 파일이 1.86MB 라 레이어를 켤 때만 받는다. 아파트 파일과 같은 지연 로딩 방식.
      // 저장 포맷이 압축돼 있다(키 이름 1회 + 값 배열 + 구·동·유형 사전 인덱스).
      // 같은 정보를 아파트 파일 포맷으로 담으면 6MB 라 초기 로딩을 망친다.
      const villaCluster = L.markerClusterGroup({ chunkedLoading: true, maxClusterRadius: 60 });
      villaCluster.on('mouseover', (e) => {
        const m = e.layer, d = m && m._rp;
        if (!d || m._ttDone) return;
        m._ttDone = 1;
        m.bindTooltip(d.priceEok == null ? esc(d.name) : d.priceEok + '억', { direction: 'top' }).openTooltip();
      });
      villaCluster.on('click', (e) => {
        const m = e.layer;
        if (!m || !m._rp) return;
        if (!m.getPopup() && m._pop) m.bindPopup(m._pop());
        m.openPopup();
      });

      // 전세가율 표시. 연립·다세대는 매매를 '건물' 단위로 묶었기 때문에 전세도 건물 단위로
      // 짝지어진다. 같은 건물이라도 평형이 다르면 짝이 어긋나 값이 튈 수 있다.
      // 실측: 9,891건 중 90건(0.9%)이 20~130% 밖으로 벗어났다(571% 같은 값).
      // 신뢰 구간을 벗어난 값은 숨긴다 — 틀린 숫자를 보여주는 것보다 안 보여주는 편이 낫다.
      // note: 짝짓는 단위를 사용자에게 알려준다. 아파트는 평형까지 맞춰서 더 정확하고,
      // 연립·다세대는 건물 단위라 평형이 다르면 값이 어긋날 수 있다.
      function jeonseHtml(d, note) {
        if (!(d.jeonse > 0) || !(d.jrate >= 20 && d.jrate <= 130)) return '';
        const col = d.jrate >= 80 ? 'var(--c-danger)' : d.jrate >= 65 ? 'var(--c-price)' : 'var(--c-success)';
        return `<div style="margin-top:3px;">전세 ${d.jeonse}억 · 전세가율 <b style="color:${col};">${d.jrate}%</b>`
          + (note ? ` <span style="font-size:12px;color:var(--c-muted);">${note}</span>` : '') + `</div>`;
      }

      // 시세를 왜곡시키는 거래는 표시해서 걸러 볼 수 있게 한다.
      // 직거래는 중개 시장가와 어긋나기 쉽고, 계약 해제 건은 실제로 성사되지 않은 거래다.
      // 구 데이터 파일에는 이 필드가 없으므로 값이 있을 때만 그린다.
      function rpFlagsHtml(d) {
        const f = [];
        if (d.cancel) f.push('<span style="background:var(--c-danger);color:#fff;font-size:12px;padding:1px 6px;border-radius:9px;">계약해제</span>');
        if (d.gbn && d.gbn.indexOf('직거래') >= 0) f.push('<span style="background:#f08c00;color:#fff;font-size:12px;padding:1px 6px;border-radius:9px;">직거래</span>');
        if (d.lease) f.push('<span style="background:#7048e8;color:#fff;font-size:12px;padding:1px 6px;border-radius:9px;">토지임대부</span>');
        return f.length ? `<div style="margin-top:4px;display:flex;gap:4px;flex-wrap:wrap;">${f.join('')}</div>` : '';
      }

      function villaPopupHtml(d) {
        const ppm = d.area && d.priceEok ? Math.round(d.priceEok * 10000 / d.area).toLocaleString() + '만원/㎡' : '-';
        const oldTag = parseInt(d.build) <= 1994
          ? '<span style="background:#e03131;color:#fff;font-size:12px;padding:2px 8px;border-radius:999px;margin-left:6px;">재건축연한 초과</span>' : '';
        // 12개월 거래가 여러 건이면 가격 범위를 함께 보여준다 (한 건물의 시세 폭을 알 수 있다)
        const range = d.cnt > 1 && d.pmax > d.pmin
          ? `<div style="margin-top:3px;font-size:12px;color:var(--c-muted);">12개월 ${d.cnt}건 · ${d.pmin}~${d.pmax}억</div>`
          : `<div style="margin-top:3px;font-size:12px;color:var(--c-muted);">12개월 ${d.cnt}건</div>`;
        return `<div class="pc"><div class="pc-head"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${ageColor(d.build)};flex-shrink:0;"></span><span class="rp-name">${esc(d.name)}</span><span style="font-size:12px;background:var(--c-primary);color:#fff;padding:1px 8px;border-radius:999px;">${esc(d.type)}</span></div><div class="pc-body"><div style="margin-bottom:4px;">${esc(d.gu)} ${esc(d.dong)}</div><div class="pc-price">매매 ${d.priceEok}억</div><div style="margin-top:3px;">평단가: ${ppm}</div><div style="margin-top:3px;">전용 ${esc(d.area)}㎡ · ${esc(d.floor)}층 · 거래 ${esc(d.ymd)}</div><div style="margin-top:3px;">${esc(d.build)}년 건축${oldTag}</div>${jeonseHtml(d, '건물 기준 참고')}${range}<div class="rp-radius-stat" style="display:none;"></div></div><div class="pc-actions"><button class="rp-save pc-btn pc-btn-outline" style="border-color:var(--c-price) !important;color:var(--c-price);">저장</button><a href="${naverSearchUrl(d.name + ' ' + (d.dong || d.gu || ''), d.lat, d.lng)}" target="_blank" rel="noopener" class="pc-btn pc-btn-primary rp-naver">네이버 부동산</a><div class="pc-btn-row"><button class="rt-start pc-btn pc-btn-outline">출발</button><button class="rt-end pc-btn pc-btn-outline">도착</button></div><button class="sv-btn pc-btn pc-btn-outline">거리뷰</button></div></div>`;
      }

      let villaRows = null, _villaPromise = null;
      function loadVilla() {
        if (!_villaPromise) {
          _villaPromise = fetch('realprice_villa.json').then((r) => r.json()).then((j) => {
            // 압축 포맷 → 아파트 마커와 같은 객체 모양으로 되살린다.
            // 이후 코드(팝업·저장·근처 통계)가 아파트와 동일하게 동작하도록 필드명을 맞춘다.
            const F = {};
            j.fields.forEach((f, i) => { F[f] = i; });
            villaRows = j.rows.map((r) => ({
              name: r[F.name], gu: j.gus[r[F.gu]], dong: j.dongs[r[F.dong]], type: j.types[r[F.type]],
              lat: r[F.lat], lng: r[F.lng], priceEok: r[F.price], area: r[F.area], floor: r[F.floor],
              build: r[F.build], ymd: r[F.ymd], cnt: r[F.cnt], pmin: r[F.pmin], pmax: r[F.pmax],
              jeonse: r[F.jeonse] || 0, jrate: r[F.jrate] || 0,
            }));
            return villaRows;
          }).catch(() => null);
        }
        return _villaPromise;
      }

      function villaBuild() {
        if (!villaRows) return;
        villaCluster.clearLayers();
        villaCluster.addLayers(villaRows.filter((d) => inPrice(d.priceEok) && inAge(d.build)).map((d) => {
          const m = L.circleMarker([d.lat, d.lng], { radius: 4, color: '#fff', weight: 1, fillColor: ageColor(d.build), fillOpacity: 0.9 });
          m._rp = d;                       // 아파트 마커와 같은 키를 쓴다 → 저장·길찾기·거리뷰 핸들러 공용
          m._isVilla = 1;                  // 팝업의 '구 데이터' 배지를 아파트(구폴백)에만 붙이기 위한 표시
          m._pop = (() => villaPopupHtml(d));
          return m;
        }));
      }
      map.on('overlayadd', (e) => {
        if (e.layer !== villaCluster) return;
        showPriceFilter();
        loadVilla().then(() => villaBuild());
      });
      map.on('overlayremove', (e) => {
        // 두 레이어가 공용이므로, 다른 하나가 아직 켜져 있으면 컨트롤을 남겨둔다
        if (e.layer !== villaCluster || map.hasLayer(realpriceCluster)) return;
        map.removeControl(rpFilterCtrl);
        map.removeControl(rpLegend);
      });

      // 팝업 안의 클릭이 지도로 새어나가지 않게 막는다.
      // 이게 없으면 '건축물대장 상세 보기' 같은 팝업 내부 버튼을 누를 때
      // map click 이 한 번 더 발생해, 버튼이 놓인 화면 지점의 좌표로 새 팝업이 열린다.
      // 실측: 논현동 171-22 에서 상세 보기를 누르자 138-3(109m 북쪽) 팝업으로 바뀌었다.
      // 스크롤도 함께 막아, 팝업 안을 스크롤할 때 지도가 확대/축소되지 않게 한다.
      map.on('popupopen', (e) => {

      // 실거래가 마커 팝업의 ☆저장 버튼 → localStorage 즐겨찾기 토글

        const paint = () => {

        enrichAptName(node, d.name, d.dong || d.gu, d.lat, d.lng);  // '두산' → '두산1단지아파트'
        // 아파트가 구 폴백 파일(realprice_seoul_gg.json)로 뜨는 동안엔 투자 판단에 중요한 한계를 알린다.
        // 좌표가 근사값이라 실제 건물과 어긋날 수 있고, 전세가율·거래유형 필드가 없어 보이지 않는다.
        // realprice_apt.json 이 배포되면 rpSource='apt' 가 되어 이 배지는 자동으로 사라진다.
        if (rpSource === 'legacy' && !m._isVilla) {
          const body = node.querySelector('.pc-body');
          if (body) {

        // 반경 700m 실거래 통계
        if (rpRows && rpRows.length) {
          let cnt700 = 0, sum = 0, sumCnt = 0;
          rpRows.forEach((r) => {

          });
