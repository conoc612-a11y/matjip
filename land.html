      });

      // ── [정비사업] 서울 정비사업 2,964개 구역 (서울도시공간포털 urban.seoul.go.kr UQ120, 2026-08-05 수집) ──
      // 사업구분 → 표시 그룹/색상. jaegebal 처럼 유형별로 색 구분 + 진행단계 표시.
      // 모아 = 소규모주택정비(가로주택정비·소규모재건축·소규모재개발) → 모아타운/모아주택 계열
      const jbCluster = L.markerClusterGroup({ chunkedLoading: true, maxClusterRadius: 50 });
      const jbPolyLayer = L.featureGroup();
      let jbRows = null, jbPolys = null;
      const jbFilter = { '신통': true, '재개발': true, '재건축': true, '지역주택': true, '재정비촉진': true, '모아': true, '역세권': true, '노후계획도시': true, '기타': true };
      let jbActiveStage = 'all';
      const STAGE_COLOR_MAP = { '착공': '#2f9e44', '준공': '#1c7ed6', '관리처분': '#7048e8', '사업시행': '#e8590c', '조합설립': '#f08c00', '추진위': '#aaa', '기획': '#e8590c', '대상지선정': '#f08c00' };
      function stageColor(s) { s = s || ''; for (const [k, v] of Object.entries(STAGE_COLOR_MAP)) { if (s.includes(k)) return v; } return '#868e96'; }
      const STAGE_PCT = { '대상지선정':10,'추진위':20,'조합설립':35,'사업시행':50,'관리처분':65,'착공':80,'준공':95,'조합해산':100,'정비구역해제':0,'기획':15 };
      function stagePct(s) { s=s||''; for(const [k,v] of Object.entries(STAGE_PCT)) { if(s.includes(k)) return v; } return 15; }
      function jbPopupHtml(d) {
        const g = jbGroup(d), c = JB_COLOR[g];
        const stageBadge = d.stage ? `<span style="display:inline-block;background:${stageColor(d.stage)};color:#fff;font-size:12px;padding:2px 8px;border-radius:999px;margin-left:4px;">${esc(d.stage)}</span>` : '';
        // 구역 면적: 폴리곤 링에서 실제로 계산 (데이터 위조 아님)
        let areaTxt = '';
        if (d.rc && jbPolys && jbPolys[d.rc]) {
          const rings = usableRings(d.rc, jbPolys[d.rc]);
          if (rings && rings.length) {
            const m2 = rings.reduce((a, r) => a + _ringArea(r), 0);
            areaTxt = ` · <b>${(m2 / 10000).toFixed(1)}만㎡</b>`;
          }
        }
        const linkBtns = (d.rc || d.cafe) ? `<div class="pc-btn-row">${d.rc ? `<a href="https://urban.seoul.go.kr/view/map/mapPopup.html?recordCode=${encodeURIComponent(d.rc)}" target="_blank" rel="noopener" class="pc-btn pc-btn-outline" style="border-color:#7048e8 !important;color:#7048e8;">경계지도</a>` : ''}${d.cafe ? `<a href="https://cleanup.seoul.go.kr/cafe/mainIndx.do?cafeUrl=${encodeURIComponent(d.cafe)}" target="_blank" rel="noopener" class="pc-btn pc-btn-outline" style="border-color:var(--c-primary) !important;color:var(--c-primary);">정보공개</a>` : ''}</div>` : '';
        return `<div class="pc"><div class="pc-head"><span style="display:inline-block;background:${c};color:#fff;font-size:12px;padding:2px 8px;border-radius:999px;">${g}</span>${stageBadge}</div><div class="pc-body"><div style="font-weight:700;font-size:15px;margin-bottom:2px;color:var(--c-text);">${esc(d.name)}</div><div>${esc(d.gu)} ${esc(d.jibun)}${areaTxt}${d.approx ? ' <span style="color:var(--c-price);">(동 근사위치)</span>' : ''}</div><div style="font-size:12px;color:var(--c-muted);margin-top:3px;">사업구분: ${esc(d.gubun)}${d.method ? ' · ' + esc(d.method) : ''}</div><div style="margin:8px 0 4px;"><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--c-muted);margin-bottom:3px;"><span>진행단계</span><span>${stagePct(d.stage)}%</span></div><div style="height:5px;background:var(--line);border-radius:3px;overflow:hidden;"><div style="height:100%;width:${stagePct(d.stage)}%;background:${stageColor(d.stage)};border-radius:3px;transition:width .3s;"></div></div></div><div class="jb-rp-stat rp-stat" style="display:none;padding:5px 0;border-top:1px solid var(--c-border);"></div><div class="jb-community" style="display:none;margin-top:6px;"></div></div><div class="pc-actions">${linkBtns}<button class="jb-community-btn pc-btn pc-btn-outline" style="border-color:#2f9e44 !important;color:#2f9e44;">💬 커뮤니티</button><button class="jb-cmp pc-btn pc-btn-outline" style="border-color:var(--c-primary) !important;color:var(--c-primary);">＋ 비교</button><div class="pc-btn-row"><button class="rt-start pc-btn pc-btn-outline" style="border-color:var(--c-success) !important;color:var(--c-success);">출발</button><button class="rt-end pc-btn pc-btn-outline" style="border-color:var(--c-danger) !important;color:var(--c-danger);">도착</button></div><button class="sv-btn pc-btn pc-btn-outline">거리뷰</button></div></div>`;
      }
      // ── 정비구역 커뮤니티(익명 방명록형) — Supabase jb_posts, anon insert/select RLS (schema.sql 참고) ──
      async function renderJbCommunity(container, d) {
        const zoneKey = d.rc || ('name:' + d.name + '|' + (d.jibun || ''));
        container.innerHTML = '<div style="font-size:12px;color:var(--c-muted);">불러오는 중…</div>';
        const s = await ensureSb();
        if (!s) { container.innerHTML = '<div style="font-size:12px;color:var(--c-muted);">커뮤니티를 불러오지 못했어요.</div>'; return; }
        const { data, error } = await s.from('jb_posts').select('nickname,content,created_at').eq('zone_rc', zoneKey).order('created_at', { ascending: false }).limit(5);
        const listHtml = error
          ? '<div style="font-size:12px;color:var(--c-muted);">커뮤니티 준비 중이에요.</div>'
          : (data && data.length
            ? data.map((p) => `<div style="font-size:13px;padding:5px 0;border-bottom:1px solid var(--line);"><b>${esc(p.nickname)}</b> <span style="color:var(--c-muted);font-size:12px;">${esc(new Date(p.created_at).toLocaleDateString())}</span><div>${esc(p.content)}</div></div>`).join('')
            : '<div style="font-size:12px;color:var(--c-muted);padding:4px 0;">아직 글이 없어요. 첫 글을 남겨보세요.</div>');
        container.innerHTML = `<div style="font-size:12px;font-weight:700;margin:4px 0;">이 구역 이야기</div>${listHtml}<div style="display:flex;gap:5px;margin-top:6px;"><input type="text" class="jb-post-nick" placeholder="닉네임" maxlength="20" style="width:64px;font:inherit;font-size:12px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--text);"><input type="text" class="jb-post-content" placeholder="한마디 남기기" maxlength="300" style="flex:1;min-width:0;font:inherit;font-size:12px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--text);"><button class="jb-post-submit pc-btn pc-btn-outline" style="padding:5px 9px;font-size:12px;">등록</button></div>`;
        const submitBtn = container.querySelector('.jb-post-submit');
        submitBtn.onclick = async () => {
          const nick = container.querySelector('.jb-post-nick').value.trim() || '익명';
          const content = container.querySelector('.jb-post-content').value.trim();
          if (!content) return;
          submitBtn.disabled = true;
          const { error: insErr } = await s.from('jb_posts').insert({ zone_rc: zoneKey, zone_name: d.name, nickname: nick, content });
          submitBtn.disabled = false;
          if (!insErr) renderJbCommunity(container, d);
        };
      }
      // ── 폴리곤 링 정제 ──────────────────────────────────────────
      // 원본 데이터에 두 종류의 쓰레기가 섞여 있다. 둘 다 "선만 보이는 폴리곤"의 원인이다.
      //  (1) 중복 링: 246개 레코드 중 91개에 동일한 경계가 2~4번 저장돼 있다.
      //      Leaflet 기본 fill-rule(evenodd)에서 같은 링이 두 번 겹치면 채움이 상쇄돼 사라진다.
      //      → 면적·정점수 서명으로 제거 (실측 397 → 281개, 데이터 손실 0)
      //  (2) 퇴화 링: 면적이 수십 ㎡에 불과한 실 조각. 정비구역일 수 없는 값이다.
      //      채워도 2.5px 선에 덮여 별 모양 선 뭉치로만 보인다.
      //      실측 면적 분포에 절벽이 있다 — 5% 지점 87㎡ / 10% 지점 6,590㎡.
      //      그 사이인 1,000㎡를 기준으로 자르면 진짜 구역은 하나도 안 잘린다.
      //      (레코드 11000AGZ201311228317 은 링 20개가 전부 87㎡ 이하라 통째로 탈락 →
      //       폴리곤 대신 마커로 표시된다. jbBuild 의 rings.length 검사가 그 처리를 한다.)
      const MIN_RING_M2 = 1000;
      const _ringCache = new Map();
      // 위경도 → ㎡ 근사 (서울권: 위도 1도≈111km, 경도 1도≈88km)
      const _ringArea = (r) => {
        let s = 0;
        for (let i = 0, n = r.length; i < n; i++) {
          const a = r[i], b = r[(i + 1) % n];
          s += (a[1] * 88000) * (b[0] * 111000) - (b[1] * 88000) * (a[0] * 111000);
        }
        return Math.abs(s / 2);
      };
      function usableRings(key, rings) {
        let out = _ringCache.get(key);
        if (out) return out;
        const seen = new Set();
        out = [];
        for (const r of rings) {
          if (!r || r.length < 3) continue;          // 면이 될 수 없음
          const a = _ringArea(r);
          if (a < MIN_RING_M2) continue;             // 퇴화 링(실 조각) 제외
          const sig = r.length + '|' + a.toExponential(8);
          if (seen.has(sig)) continue;               // 중복 링 제외
          seen.add(sig);
          out.push(r);
        }
        _ringCache.set(key, out);
        return out;
      }
      function jbBuild() {
        if (!jbRows) return;
        _jbRowsGlobal = jbRows;
        // 메뉴에 유형별 구역 수 표시
        document.querySelectorAll('.jb-cnt').forEach((el) => { el.textContent = jbRows.filter((r) => jbGroup(r) === el.dataset.g).length.toLocaleString(); });
        // 열려 있던 팝업 기록: 팝업 autoPan → moveend → 재빌드 → clearLayers가
        // 팝업을 닫아버리는 루프를 막기 위해 재빌드 후 같은 구역 팝업을 다시 연다.
        const openSrc = (map._popup && map._popup._source && map._popup._source._jb) ? map._popup._source._jb : null;
        const openKey = openSrc ? openSrc.name + '|' + (openSrc.jibun || '') : null;
        jbCluster.clearLayers();
        jbPolyLayer.clearLayers();
        // 뷰포트 필터링: 현재 지도 경계 + 마진 내의 폴리곤만 렌더링
        const bounds = map.getBounds().pad(0.1);  // 10% 마진
        const dots = [];
        // 줌 14 이상에서만 배지를 상시 노출 — 그 이하에서는 구역이 너무 많아 겹쳐 뭉개진다.
        const showStageBadge = map.getZoom() >= 14;
        const stageBadgeHtml = (d) => `<span class="jb-perm-badge" style="background:${stageColor(d.stage)}">${esc(d.name)} · ${stagePct(d.stage)}%</span>`;
        jbRows.forEach((d) => {
          if (d.lat == null || d.lng == null) return;  // 좌표 미확보 레코드(수집 데이터 중 소수)는 건너뜀
          if (!jbFilter[jbGroup(d)]) return;
          if (jbActiveStage !== 'all' && !(d.stage || '').includes(jbActiveStage)) return;
          if (!bounds.contains([d.lat, d.lng])) return;  // 뷰포트 밖 폴리곤·마커 스킵
          const c = JB_COLOR[jbGroup(d)];
          // 쓸 수 있는 링이 하나도 안 남으면 폴리곤을 그리지 않고 마커로 떨어뜨린다.
          // (예전엔 빈 배열로 L.polygon 을 만들어 아무것도 안 보이는 유령 도형이 됐다.)
          const rings = (d.rc && jbPolys && jbPolys[d.rc]) ? usableRings(d.rc, jbPolys[d.rc]) : null;
          if (rings && rings.length) {
            // fillRule 'nonzero': Leaflet 기본값은 'evenodd'인데, 그 규칙에서는 겹친 링이 서로를
            // 상쇄해 채움이 사라지고 외곽선만 남는다 (= 폴리곤 색이 안 칠해지는 증상).
            // weight 를 얇게: 서울 전체 줌에서는 구역이 20px 남짓이라 굵은 선이 채움을 덮어버린다.
            // smoothFactor 는 화면 픽셀 기준 단순화 허용오차다. 2 로 두면 줌 17에서
            // 경계가 실제 필지선에서 최대 2.4m 벗어난다(실측). 1 로 낮춰 절반으로 줄인다.
            const poly = L.polygon(rings.map((r) => [r]), { color: c, weight: 1.5, fillColor: c, fillOpacity: 0.45, fillRule: 'nonzero', smoothFactor: 1 });
            poly._jb = d;
            poly.bindTooltip(
              showStageBadge ? stageBadgeHtml(d) : `<b>${esc(d.name)}</b><br><span style="font-size:12px;color:#555">${esc(d.stage || '')}</span>`,
              { sticky: !showStageBadge, permanent: showStageBadge, direction: 'top', className: showStageBadge ? 'jb-perm-tt' : '' }
            );
            poly.bindPopup(() => jbPopupHtml(d));  // 열 때 생성
            jbPolyLayer.addLayer(poly);
          } else {
            // 폴리곤 데이터가 없는 건(모아·신통·지역주택·리모델링 등)은 대표 좌표 기준
            // 근사 구역(반경 300m 점선 원)으로 표시. 실측 경계가 없어 근사치임을 점선으로 구분.
            const circle = L.circle([d.lat, d.lng], { radius: 300, color: c, weight: 1.5, dashArray: '4 4', fillColor: c, fillOpacity: 0.22 });
            circle._jb = d;
            circle._approx = true;
            circle.bindTooltip(
              showStageBadge ? stageBadgeHtml(d) : `<b>${esc(d.name)}</b> · ${esc(d.stage || '')}`,
              { sticky: !showStageBadge, permanent: showStageBadge, direction: 'top', className: showStageBadge ? 'jb-perm-tt' : '' }
            );
            circle.bindPopup(() => jbPopupHtml(d));  // 열 때 생성
            dots.push(circle);
          }
        });
        jbCluster.addLayers(dots);
        if (openKey) {
          const target = (() => {
            const found = [];
            const scan = (g) => {
              if (!g) return;
              if (g._layers && typeof g._layers === 'object') Object.values(g._layers).forEach(scan);
              else if (g._featureGroup) scan(g._featureGroup);
              else if (g._jb && g._jb.name + '|' + (g._jb.jibun || '') === openKey) found.push(g);
            };
            scan(jbPolyLayer); scan(jbCluster);
            return found[0];
          })();
          if (target) target.openPopup();
        }
      }
      const jbCtrl = L.control({ position: 'topleft' });
      jbCtrl.onAdd = () => {
        const div = L.DomUtil.create('div');
        div.className = 'lc';

      const ITS_KEY = '143145cd464a4522b3a9347a9d768d4f';
      function itsDirect(minX, maxX, minY, maxY) {
        const call = (type) => fetch(`https://openapi.its.go.kr:9443/cctvInfo?apiKey=${ITS_KEY}`
          + `&type=${type}&cctvType=2&minX=${minX}&maxX=${maxX}&minY=${minY}&maxY=${maxY}&getType=json`)
          .then((r) => r.json())
          .then((j) => (j && j.response && Array.isArray(j.response.data)) ? j.response.data : [])
          .catch(() => null);   // null = 실패(프록시로 넘어감), [] = 정상인데 0건
        return Promise.all([call('ex'), call('its')]).then((rs) => {
          if (rs.every((x) => x === null)) return null;
          return rs.flatMap((x) => x || []).map((d) => ({
            name: d.cctvname, url: d.cctvurl,

      function loadCctv() {

        // 서울 전역 240건). 반경 3km 로 좁게 물으면 늘 빈 결과라, 화면에 보이는 범위를
        // 그대로 넘긴다. 너무 좁게 보고 있으면 최소 범위를 확보해 근처 것이라도 잡는다.
        const b = map.getBounds().pad(0.2);
        const MIN_SPAN = 0.08;   // 약 8km
        let [minY, maxY] = [b.getSouth(), b.getNorth()];
        let [minX, maxX] = [b.getWest(), b.getEast()];
        const cy = (minY + maxY) / 2, cx = (minX + maxX) / 2;
        if (maxY - minY < MIN_SPAN) { minY = cy - MIN_SPAN / 2; maxY = cy + MIN_SPAN / 2; }
        if (maxX - minX < MIN_SPAN) { minX = cx - MIN_SPAN / 2; maxX = cx + MIN_SPAN / 2; }
        const render = (items) => {
          if (!items) return;
          cctvLayer.clearLayers();

            if (!Number.isFinite(it.lat) || !Number.isFinite(it.lng)) return;

      // ── 청약예정 배지 레이어 ────────────────────────────────────────
      // 데이터는 페이지 로드 시 1회 받아 미리 그려 둔다. 토글은 레이어 트리(아래)가,
      // 그리기는 여기가 담당 — overlayadd 토글 이벤트에 의존하지 않는다.
      const subLayer = L.layerGroup();
      function subPopupHtml(it) {
        const range = (a, b) => (a || '?') + (b && b !== a ? ' ~ ' + b : '');
        const rows = [`<b>${esc(it.name)}</b>`, esc(it.addr)];
        if (it.supply) rows.push(`총 <b>${Number(it.supply).toLocaleString()}</b>세대`);
        if (it.pblancDe) rows.push(`모집공고일: ${it.pblancDe}`);
        if (it.spStart) rows.push(`특별공급 접수: ${range(it.spStart, it.spEnd)}`);
        if (it.rcptStart) rows.push(`일반(1순위) 접수: ${range(it.rcptStart, it.rcptEnd)}`);
        if (it.url) rows.push(`<a href="${safeUrl(it.url)}" target="_blank" rel="noopener">청약홈 상세 보기</a>`);
        return rows.join('<br>');
      }
      let _subRendered = false;
      function renderSubscriptions() {
        if (_subRendered) return;
        _subRendered = true;
        loadSubscriptions().then((items) => {
          let i = 0, active = 0;
          const MAX = Math.min(3, items.length || 1); // JSONP 지오코딩은 3건 동시까지만
          const next = () => {
            while (active < MAX && i < items.length) {
              const it = items[i++]; active++;
              vworldAddrToPnu(it.addr, (g) => {
                active--;
                if (g && g.lat && g.lng) {
                  L.marker([g.lat, g.lng], {
                    icon: L.divIcon({
                      className: 'sub-badge-wrap',
                      html: '<span class="sub-badge">분양예정</span>',
                      iconSize: [58, 20], iconAnchor: [29, 10],
                    }),
                    title: it.name,
                  }).addTo(subLayer).bindPopup(subPopupHtml(it));
                }
                next();
              });
            }
          };
          next();
        });
      }
      renderSubscriptions();

          { name: '정비사업 상세 (matjip)', layer: jbCluster },
        ]],
        ['지구단위계획구역', [
          { name: '지구단위계획구역', subs: [[33, '지구단위계획구역']] },
          { name: '특별계획구역', subs: [[34, '특별계획구역']] },
          { name: '획지예정선', subs: [[39, '획지예정선']] },

        ['용도지역·지구·구역', [

          { name: '용도지구', subs: [[19, '경관지구'], [20, '고도지구'], [21, '방화지구'], [22, '방재지구'], [23, '보호지구'], [25, '취락지구'], [26, '개발진흥지구'], [27, '특정용도제한지구'], [28, '복합용도지구'], [29, '폐지·사용중지 지구']] },
          { name: '용도구역', subs: [[30, '개발제한구역'], [31, '도시자연공원구역'], [32, '기타 용도구역']] },
          { name: '용도지역 (전국·V-World)', layer: wms('lt_c_uq111', 0.55) },
        ]],
        ['도시계획시설', [

          { name: '주차장', subs: [[12, '주차장']] },
          { name: '광장', subs: [[13, '광장']] },
          { name: '유통·공급시설', subs: [[11, '유통·공급시설']] },
          { name: '공공·문화체육시설', subs: [[14, '공공·문화체육시설']] },
          { name: '방재시설', subs: [[15, '방재시설']] },
          { name: '보건위생시설', subs: [[16, '보건위생시설']] },
          { name: '환경기초시설', subs: [[17, '환경기초시설']] },
          { name: '기타기반시설', subs: [[18, '기타기반시설']] },
        ]],
        ['규제구역', [
          { name: '토지거래허가구역', layer: tojiLayer },
          { name: '개발제한구역 (그린벨트)', layer: wms('lt_c_ud801', 0.5) },
          { name: '개발진흥지구', layer: wms('lt_c_uq129', 0.5) },
          { name: '택지·사업지구', layer: wms('lt_c_lhzone', 0.5) },
        ]],
        ['주제도', [
          { name: '가로구역별 건축물 높이기준', subs: [[333, '가로구역별 높이기준']] },
          { name: '기후환경 공간유형', subs: [[339, '기후'], [340, '열환경'], [341, '바람'], [342, '바람길']] },
          { name: '생태현황도 (2025)', subs: [[162, '비오톱 유형'], [163, '비오톱 유형(세부)'], [164, '개별 비오톱']] },
        ]],
        ['실거래', [
          { name: '아파트 실거래가·노후도', layer: realpriceCluster },
          { name: '연립·다세대 실거래가', layer: villaCluster },
        ]],
        ['현장 확인', [
          { name: 'CCTV (실시간 도로영상)', layer: cctvLayer },
        ]],
        ['청약', [
          { name: '분양예정 (청약홈)', layer: subLayer },
        ]],
        ['지적·행정경계', [
          { name: '지적도 (필지 경계)', layer: wms('lt_c_landinfobasemap', 0.85) },
          { name: '행정구역 (시군구)', layer: wms('lt_c_adsigg', 0.85) },
          { name: '행정동 경계', layer: wms('lt_c_ademd', 0.7) },
        ]],
      ];

      // 소분류를 켜고 끌 때마다 UPIS 레이어를 새로 만들지 않고, 중분류마다 타일 레이어를
      // 하나만 두고 'layers=show:...' 목록만 바꿔 다시 그린다(요청 수도 줄고 관리도 쉽다).
      function upisGroupLayer(mid) {
        // 주의: 여기서 mid._on 을 초기화하면 안 된다. 소분류를 처음 켤 때
        // add() 직후 이 함수가 불려 방금 넣은 id 가 지워졌다(레이어가 안 뜨던 원인).
        if (!mid._layer) mid._layer = upis('', mid.opacity);
        return mid._layer;
      }
      function refreshUpisGroup(mid) {
        const lyr = upisGroupLayer(mid);
        const ids = [...mid._on];
        if (!ids.length) { if (map.hasLayer(lyr)) map.removeLayer(lyr); return; }
        lyr.options.upisLayers = ids.join(',');
        if (!map.hasLayer(lyr)) lyr.addTo(map);
        else lyr.redraw();
      }

      const layerPanel = L.control({ position: 'topright' });
      layerPanel.onAdd = () => {
        const div = L.DomUtil.create('div', 'lp');
        div.innerHTML = '<button type="button" class="lp-toggle" title="레이어" aria-label="레이어">'
          + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l9 5-9 5-9-5 9-5z"/><path d="M3 12l9 5 9-5"/><path d="M3 17l9 5 9-5"/></svg></button>'
          + '<div class="lp-body"></div>';
        const body = div.querySelector('.lp-body');
        const toggle = div.querySelector('.lp-toggle');
        toggle.onclick = () => div.classList.toggle('open');

        LAYER_TREE.forEach(([big, mids]) => {
          const sec = L.DomUtil.create('div', 'lp-sec', body);
          const head = L.DomUtil.create('div', 'lp-head', sec);
          head.innerHTML = `<input type="checkbox" class="lp-cb"><span class="lp-name">${big}</span><span class="lp-arrow">▾</span>`;
          const kids = L.DomUtil.create('div', 'lp-kids', sec);
          head.querySelector('.lp-arrow').onclick = (e) => { e.stopPropagation(); sec.classList.toggle('closed'); };
          // 대분류 행 클릭 = 하위 전부 선택/해제 토글. 부분선택(일부만 켬) 중이면 '전체 선택'으로.
          head.addEventListener('click', (e) => {
            if (e.target.closest('.lp-cb') || e.target.closest('.lp-arrow')) return;
            if (bigCb.indeterminate) bigCb.checked = true;
            else bigCb.checked = !bigCb.checked;
            bigCb.onchange();
          });

          const midCbs = [];
          mids.forEach((mid) => {
            const row = L.DomUtil.create('div', 'lp-mid', kids);
            const hasSubs = !!mid.subs;
            row.innerHTML = `<div class="lp-midhead">${hasSubs ? '<span class="lp-exp">＋</span>' : '<span class="lp-exp lp-exp-none"></span>'}`
              + `<input type="checkbox" class="lp-cb lp-midcb"><span class="lp-name">${mid.name}</span></div>`;
            const midCb = row.querySelector('.lp-midcb');
            midCbs.push(midCb);

            if (!hasSubs) {
              midCb.onchange = () => {
                // Leaflet의 overlayadd/overlayremove 는 기본 레이어 컨트롤(L.Control.Layers)이
                // 있을 때만 발생한다. 커스텀 패널로 교체한 뒤로 이 이벤트가 안 불려
                // 실거래·정비사업 등 레이어가 빈 채로 남는 버그가 있었다 — 직접 fire 해준다.
                if (midCb.checked) { mid.layer.addTo(map); map.fire('overlayadd', { layer: mid.layer }); }
                else { map.removeLayer(mid.layer); map.fire('overlayremove', { layer: mid.layer }); }
                syncBig();
              };
              return;
            }
            const subBox = L.DomUtil.create('div', 'lp-subs', row);
            const subCbs = [];
            mid._on = new Set();
            mid.subs.forEach(([id, label]) => {
              const s = L.DomUtil.create('label', 'lp-sub', subBox);
              const sw = UPIS_SWATCH[id] ? `<img class="lp-sw" src="data:image/png;base64,${UPIS_SWATCH[id]}" alt="">` : '<span class="lp-sw"></span>';
              s.innerHTML = `<input type="checkbox" class="lp-cb">${sw}<span>${label}</span>`;
              const cb = s.querySelector('input');
              subCbs.push(cb);
              cb.onchange = () => {
                cb.checked ? mid._on.add(id) : mid._on.delete(id);
                refreshUpisGroup(mid);
                midCb.checked = subCbs.some((c) => c.checked);
                midCb.indeterminate = midCb.checked && !subCbs.every((c) => c.checked);
                // 브라우저는 부분선택(indeterminate) 체크박스를 누르면 '해제'로 간다.
                // 참조 사이트처럼 '전체 선택'이 되도록, 부분선택이었음을 기억해 둔다.
                midCb.dataset.wasInd = midCb.indeterminate ? '1' : '0';
                syncBig();
              };
            });
            row.querySelector('.lp-exp').onclick = () => row.classList.toggle('open');
            midCb.onchange = () => {
              // 부분선택 상태에서 눌렀으면 '전체 선택'으로 만든다(위 주석 참고).
              if (midCb.dataset.wasInd === '1') midCb.checked = true;
              midCb.dataset.wasInd = '0';
              subCbs.forEach((c) => { c.checked = midCb.checked; });
              mid._on = new Set(midCb.checked ? mid.subs.map(([id]) => id) : []);
              midCb.indeterminate = false;
              refreshUpisGroup(mid);
              syncBig();
            };
          });

          const bigCb = head.querySelector('.lp-cb');
          function syncBig() {
            const on = midCbs.filter((c) => c.checked).length;
            bigCb.checked = on > 0;
            bigCb.indeterminate = on > 0 && on < midCbs.length;
          }
          bigCb.onchange = () => {
            // 목표 상태를 미리 박아둔다. 루프 안에서 syncBig() 이 bigCb.checked 를 갈아치워도
            // 비교가 어긋나 일부만 토글되는 일(두 번째 클릭에 남는 체크)이 없게 한다.
            const target = bigCb.checked;
            midCbs.forEach((c) => {
              if (c.checked !== target) { c.checked = target; c.dataset.wasInd = '0'; c.onchange(); }
            });
            bigCb.indeterminate = false;
          };
        });

        L.DomEvent.disableClickPropagation(div);
        L.DomEvent.disableScrollPropagation(div);
        return div;
      };
      layerPanel.addTo(map);

      // ── 오른쪽 목록 패널 너비 조절 ────────────────────────────────────
      // 팝업처럼 목록도 고정 폭이라 답답하다는 지적. 가장자리를 끌어 넓히면
      // 안쪽 카드는 %/flex 기반이라 글자가 저절로 그 폭에 맞춰 다시 흐른다.
      (() => {
        const rz = document.getElementById('panel-resizer');
        const pnl = document.getElementById('panel');
        if (!rz || !pnl) return;
        let startX = 0, startW = 0;
        const onMove = (e) => {
          const dx = startX - e.clientX;                 // 왼쪽으로 끌면 넓어진다
          const max = Math.max(320, window.innerWidth - 360);   // 지도도 최소 폭은 남긴다
          const w = Math.min(max, Math.max(260, startW + dx));
          pnl.style.flex = `0 0 ${w}px`;
          pnl.style.minWidth = w + 'px';
        };
        const onUp = () => {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
          document.body.classList.remove('panel-resizing');
          rz.classList.remove('dragging');
          try { localStorage.setItem('mj_panel_w', pnl.getBoundingClientRect().width); } catch (e) {}
          map.invalidateSize();   // 지도 크기가 바뀌었으니 타일·팝업 기준을 다시 잡는다
        };
        rz.addEventListener('mousedown', (e) => {
          e.preventDefault();
          startX = e.clientX;
          startW = pnl.getBoundingClientRect().width;
          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
          document.body.classList.add('panel-resizing');
          rz.classList.add('dragging');
        });
        // 지난번 폭 복원
        try {
          const saved = Number(localStorage.getItem('mj_panel_w'));
          if (saved >= 260) { pnl.style.flex = `0 0 ${saved}px`; pnl.style.minWidth = saved + 'px'; }
        } catch (e) {}
      })();

      // 배경지도 선택 (일반/위성/위성+라벨) — 예전엔 '항공' 토글 버튼 하나뿐이라
      // 어떤 지도가 있는지 알 수 없었다. 네이버지도처럼 썸네일로 셋을 나란히 보여준다.
      // 썸네일 배경은 서울 도심(z15) 실제 타일이라 별도 이미지 파일이 필요 없다.
      const THUMB = (layer, ext) => `https://api.vworld.kr/req/wmts/1.0.0/${VWORLD_KEY}/${layer}/15/12688/27942.${ext}`;
      const BASEMAPS = [
        { key: '일반지도', label: '일반지도', thumb: THUMB('Base', 'png') },
        { key: '항공영상', label: '위성지도', thumb: THUMB('Satellite', 'jpeg') },
        { key: '항공+라벨', label: '위성+라벨', thumb: `${THUMB('Hybrid', 'png')}), url(${THUMB('Satellite', 'jpeg')}` },
        // OSM 은 V-World 장애 시 자동 대체용으로만 쓰이던 레이어인데, 수동으로도
        // 고를 수 있게 넷째 선택지로 노출한다. 같은 지역(z15 서울)을 보여주되
        // V-World는 {z}/{y}/{x}, OSM은 {z}/{x}/{y} 순서라 OSM 좌표는 뒤집어 쓴다.
        { key: 'OSM (대체)', label: 'OSM', thumb: 'https://tile.openstreetmap.org/15/27942/12688.png' },
      ];
      const bmPicker = L.control({ position: 'topleft' });
      bmPicker.onAdd = () => {
        const div = L.DomUtil.create('div');
        div.className = 'bm-picker';
        div.innerHTML = BASEMAPS.map((b) =>
          `<button type="button" class="bm-item${b.key === '일반지도' ? ' on' : ''}" data-b="${b.key}" title="${b.label}">`
          + `<span class="bm-thumb" style="background-image:url(${b.thumb});"></span>`
          + `<span class="bm-label">${b.label}</span></button>`
        ).join('');
        div.querySelectorAll('.bm-item').forEach((btn) => {
          btn.onclick = () => {
            const target = baseLayers[btn.dataset.b];
            if (!target) return;
            Object.values(baseLayers).forEach((l) => map.hasLayer(l) && map.removeLayer(l));
            target.addTo(map);
            if (target.bringToBack) target.bringToBack();
            div.querySelectorAll('.bm-item').forEach((o) => o.classList.toggle('on', o === btn));
          };
        });
        L.DomEvent.disableClickPropagation(div);
        L.DomEvent.disableScrollPropagation(div);
        return div;
      };
      bmPicker.addTo(map);
      // 배경지도 선택을 줌(+/−) 버튼 "옆"에 나란히 붙인다.
      // Leaflet 은 같은 코너(topleft)에 추가한 컨트롤을 세로로 쌓기만 해서,
      // 줌 컨트롤과 이 피커를 한 줄(.ctl-row)로 감싸 가로 배치로 바꾼다.
      // (코너 컨테이너 자체는 정비사업 메뉴 스크롤 때문에 flex column 을 유지해야 한다.)
      const _tl = map.getContainer().querySelector('.leaflet-top.leaflet-left');
      const _zoomEl = map.zoomControl && map.zoomControl.getContainer();
      const _pickEl = bmPicker.getContainer();
      if (_tl && _pickEl) {
        const row = L.DomUtil.create('div', 'ctl-row');
        _tl.insertBefore(row, _tl.firstChild);
        if (_zoomEl) row.appendChild(_zoomEl);
        row.appendChild(_pickEl);
      }
    }
    // 실거래가 데이터는 초기 렌더를 막지 않도록 브라우저가 한가할 때 미리 로드 (클릭 팝업의 '근처 실거래'에 사용)
    (window.requestIdleCallback || ((f) => setTimeout(f, 2500)))(() => { loadRp(); ensureNaver(); });

    // ── [V-World 검색 API] 주소·지명 검색 → 지도 이동 (JSONP로 브라우저 CORS 회피) ──
    let vsMarker = null;
    function vworldSearch(q, type) {
      if (!q) return;
      const cb = '__vw_' + Date.now();
      const clean = () => { try { delete window[cb]; } catch (e) {} };
      window[cb] = (data) => {
        clean();
        const items = (data.response && data.response.result && data.response.result.items) || [];
        if (!items.length) {
          if (type === 'place') { vworldSearch(q, 'address'); return; } // 장소 없으면 주소로 재검색
          alert('검색 결과가 없어요: ' + q); return;
        }
        const it = items[0], x = Number(it.point.x), y = Number(it.point.y);
        map.setView([y, x], 16);
        if (vsMarker) map.removeLayer(vsMarker);
        vsMarker = L.marker([y, x]).addTo(map).bindPopup(`<b>${esc(it.title || q)}</b>`).openPopup();
      };
      const s = document.createElement('script');
      s.src = `https://api.vworld.kr/req/search?service=search&request=search&version=2.0&crs=EPSG:4326&size=5&page=1&query=${encodeURIComponent(q)}&type=${type}&format=json&key=${VWORLD_KEY}&callback=${cb}`;
      s.onerror = clean;
      document.head.appendChild(s);
    }
    // 검색 통합: 식당 필터는 #search 입력, 주소·지명 이동은 #search Enter로 처리(아래 참조).

    const markers = {}; // id -> marker
    let user = null;

    // ── V-World 역지오코딩 (좌표→주소, JSONP CORS 회피) ──
    // 콜백 이름에 좌표만 쓰면, 같은 지점을 동시에 두 번 조회할 때(예: 지도 클릭 시
    // 팝업 주소용 + 헤더 날씨 지역명용) 뒤에 등록한 쪽이 window[name] 을 덮어써
    // 앞의 콜백이 영구히 안 불린다(실측: 헤더 지역명이 이전 지점에 멈춤).
    // 매 호출마다 고유번호를 붙여 충돌을 없앤다.
    let _vwRevSeq = 0;
    function reverseGeocode(lat, lng, cb) {
      const name = '__vwrev_' + Math.floor(lat * 1e6) + '_' + Math.floor(lng * 1e6) + '_' + (++_vwRevSeq);
      window[name] = (data) => {
        try { delete window[name]; } catch (e) {}
        let addr = '';
        try { const r = data.response.result; addr = (r && r[0] && r[0].text) || ''; } catch (e) {}
        cb(addr);
      };
      const s = document.createElement('script');
      s.src = `https://api.vworld.kr/req/address?service=address&request=getAddress&version=2.0&crs=epsg:4326&point=${lng},${lat}&format=json&type=both&key=${VWORLD_KEY}&callback=${name}`;
      s.onerror = () => { try { delete window[name]; } catch (e) {} cb(''); };
      document.head.appendChild(s);
    }

    // ── 헤더 정보: 날씨(클릭 지점 갱신) · 대출금리 · 환율 ──────────────
    // 실거래가·정비사업처럼 반경 단위로 자주 갱신할 필요는 없어(날씨는 30분,
    // 금리·환율은 하루 단위로만 바뀜) 클릭/최초 로드 시점에만 호출한다.
    // 주의: 아래에서 곧바로 loadRates()/loadWeather()를 호출하므로(TDZ), 이 상수들은
    // MOLIT_PROXY 근처가 아니라 반드시 사용 지점보다 앞에 선언돼 있어야 한다.
    const KMA_PROXY = 'https://bhgijvaxxjnocgfnaaeu.supabase.co/functions/v1/kma-weather-proxy';
    const EXIM_PROXY = 'https://bhgijvaxxjnocgfnaaeu.supabase.co/functions/v1/eximbank-proxy';
    const CCTV_PROXY = 'https://bhgijvaxxjnocgfnaaeu.supabase.co/functions/v1/its-cctv-proxy';
    let _weatherReq = 0;
    function loadWeather(lat, lng) {
      const reqId = ++_weatherReq;
      reverseGeocode(lat, lng, (addr) => {
        if (reqId !== _weatherReq) return; // 더 최근 클릭이 있으면 이 응답은 버린다
        const m = addr && addr.match(/(\S+(?:동|읍|면))(?!\S)/);
        $('weather-area').textContent = (m && m[1]) || addr?.split(' ').slice(-2, -1)[0] || '이 지점';
      });
      fetch(`${KMA_PROXY}?lat=${lat}&lng=${lng}`)
        .then((r) => r.json())
        .then((d) => {
          if (reqId !== _weatherReq) return;
          if (d.error) { $('weather-val').textContent = '조회 실패'; return; }
          $('weather-val').textContent = (d.temp != null ? d.temp + '℃ ' : '') + (d.label || '');
        })
        .catch(() => { if (reqId === _weatherReq) $('weather-val').textContent = '조회 실패'; });
    }
    function loadRates() {
      // 대출금리(한국수출입은행 AP02/AP03)는 엔드포인트 자체가 확인 안 돼(2026-08-05 실측
      // result:2 데이터코드 오류) 보류 — HANDOFF.md 참고. 은행별 비교는 애초에 Finlife(금감원
      // 금융상품 한눈에) API가 맞는 데이터 소스라 그쪽 키 발급 후 별도로 붙인다.
      fetch(`${EXIM_PROXY}?kind=exchange`).then((r) => r.json()).then((d) => {
        const items = d.items || [];
        const usd = items.find((x) => x.cur_unit === 'USD');
        const jpy = items.find((x) => x.cur_unit === 'JPY(100)');
        $('fx-usd').textContent = usd ? usd.deal_bas_r : '조회 실패';
        $('fx-jpy').textContent = jpy ? jpy.deal_bas_r : '조회 실패';
      }).catch(() => { $('fx-usd').textContent = '조회 실패'; $('fx-jpy').textContent = '조회 실패'; });
    }
    loadRates();
    loadWeather(37.5665, 126.9780); // 초기값: 서울시청 — 지도를 클릭하면 그 지점으로 갱신

    // ── 지도 클릭 → 위치 정보(주소 + 근처 실거래가) 표시 ──
    let clickMarker = null;
    const _gcCache = new Map(); // 좌표 캐시(≈1m 그리드) → {addr, bldName}
    // 그리드가 너무 크면(예: ×200 = 약 555m) 옆 건물을 클릭해도 같은 셀로 뭉쳐
    // 첫 건물의 주소·건물명·지번이 그대로 재사용된다. ×100000 ≈ 1.1m(위도)로 좁힌다.
    const _gcKey = (lat, lng) => `${(lat * 100000 | 0)},${(lng * 100000 | 0)}`;

    // ── 단지명 보정 ──────────────────────────────────────────────
    // 국토부 실거래가 원본은 단지명이 축약돼 있다 (실측: 9,030건 중 1,594건 = 17.7%가 3글자 이하).
    // 예를 들어 '두산1단지아파트'가 '두산'으로만 들어와서, 그대로 네이버에 검색하면
    // 전혀 다른 단지가 나온다. 좌표를 역지오코딩해 실제 건물명을 받아 보정한다.
    const _bldCache = new Map();
    function naverBldName(lat, lng, cb) {
      const key = _gcKey(lat, lng);
      if (_bldCache.has(key)) { cb(_bldCache.get(key)); return; }
      ensureNaver().then((nv) => {
        if (!(nv && nv.maps && nv.maps.Service)) { cb(null); return; }
        try {
          nv.maps.Service.reverseGeocode({
            coords: new nv.maps.LatLng(lat, lng),
            // orders 는 배열이 아니라 콤마로 이은 문자열이어야 한다.
            // 배열로 넘기면 콘솔에 '"orders" type does not match' 경고가 뜨고 무시된다.
            orders: [nv.maps.Service.OrderType.ROAD_ADDR, nv.maps.Service.OrderType.ADDR].join(','),
          }, (status, res) => {
            let name = null;
            try {
              if (status === nv.maps.Service.Status.OK) {
                for (const r of ((res.v2 && res.v2.results) || [])) {
                  const a0 = r.land && r.land.addition0;
                  if (a0 && a0.type === 'building' && a0.value) { name = a0.value; break; }
                }
              }
            } catch (err) {}
            _bldCache.set(key, name);
            cb(name);
          });
        } catch (err) { cb(null); }
      });
    }
    // ── 건물 정보 (V-World 건물정보 LT_C_BLDGINFO, JSONP) ────────────
    // 아파트가 아닌 건물(단독·다세대·근린생활 등)의 용도·층수·연면적·사용승인일을 제공한다.
    // 실측 주의: 이 레이어의 usability는 그룹코드(01000/02000/04000…)만 내려온다.
    // 5자리 세부코드(예: 02003 다세대주택)는 제공되지 않아 '다세대 vs 다가구' 구분은 불가능하다.
    // 그래서 계열까지만 표기하고, 층수·연면적으로 사용자가 판단할 수 있게 함께 보여준다.
    const BLD_USE = {
      '01000': '단독주택 계열 (단독·다중·다가구)',
      '02000': '공동주택 계열 (아파트·연립·다세대)',
      '03000': '제1종 근린생활시설', '04000': '제2종 근린생활시설',
      '05000': '문화 및 집회시설', '06000': '종교시설', '07000': '판매시설',
      '08000': '운수시설', '09000': '의료시설', '10000': '교육연구시설',
      '11000': '노유자시설', '12000': '수련시설', '13000': '운동시설',
      '14000': '업무시설', '15000': '숙박시설', '16000': '위락시설',
      '17000': '공장', '18000': '창고시설', '19000': '위험물 저장·처리시설',
      '20000': '자동차 관련시설', '21000': '동물·식물 관련시설', '22000': '자원순환 관련시설',
    };
    // V-World 데이터 API 범용 조회 (JSONP — 브라우저에서 CORS 없이 호출 가능함을 실측 확인)
    // 레이어별로 캐시한다. 좌표는 ≈1m 그리드로 뭉쳐 같은 건물 반복 조회를 막는다.
    // buffer(m)를 주면 POINT 반경 버퍼 쿼리로 바뀐다 (건물 스냅용).
    const _vwCache = new Map();
    let _vwSeq = 0;
    function vworldFeature(dataId, lat, lng, cb, buffer) {
      const key = dataId + '@' + _gcKey(lat, lng) + (buffer ? '#b' + buffer : '');
      if (_vwCache.has(key)) { cb(_vwCache.get(key)); return; }
      const cbName = '__vw' + (++_vwSeq) + '_' + Math.abs(lat * 1e5 | 0);
      let done = false;
      const finish = (val) => {
        if (done) return;
        done = true;
        try { delete window[cbName]; } catch (e) {}
        _vwCache.set(key, val);
        cb(val);
      };
      window[cbName] = (data) => {
        let props = [];
        try {
          // 기존 호출부(용도지역·지적)는 properties 배열을 그대로 쓴다.
          // 건물 스냅이 폴리곤 정점과의 거리를 재도록 geometry 를 _geom 에 붙여준다.
          props = ((data.response.result.featureCollection.features) || []).map((f) => {
            const p = f.properties || {};
            p._geom = f.geometry || null;
            return p;
          }).filter(Boolean);
        } catch (e) {}
        finish(props);
      };
      const s = document.createElement('script');
      s.src = `https://api.vworld.kr/req/data?service=data&version=2.0&request=GetFeature&format=json&size=${buffer ? 10 : 5}`
        + `&crs=EPSG:4326&geomFilter=POINT(${lng}%20${lat})&data=${dataId}&key=${VWORLD_KEY}`
        + `&domain=${encodeURIComponent(location.origin)}&callback=${cbName}`
        + (buffer ? `&buffer=${buffer}` : '');
      s.onerror = () => finish([]);
      document.head.appendChild(s);
      setTimeout(() => finish([]), 7000);
    }

    // ── 주소 → PNU 조회 (지번 주소로 V-World 검색 → PNU + 좌표) ──
    // 클릭 시 네이버 역지오코딩에서 받은 지번 주소를 이용해 정확한 PNU를 찾는다.
    // POINT 쿼리가 경계 오류로 잘못된 필지를 줄 때의 폴백이자 주요 PNU 원천.
    function vworldAddrToPnu(addr, cb) {
      if (!addr) { cb(null); return; }
      const cbName = '__vwAddr_' + (++_vwSeq);
      let done = false;
      const finish = (val) => { if (done) return; done = true; try { delete window[cbName]; } catch (e) {} cb(val); };
      window[cbName] = (data) => {
        try {
          const items = (data.response && data.response.result && data.response.result.items) || [];
          if (items.length) {
            const it = items[0];
            const pnu = String(it.id || '');
            const x = Number(it.point && it.point.x);
            const y = Number(it.point && it.point.y);
            if (pnu && x && y) { finish({ pnu, lat: y, lng: x }); return; }
          }
        } catch (e) {}
        finish(null);
      };
      const s = document.createElement('script');
      s.src = `https://api.vworld.kr/req/search?service=search&request=search&version=2.0&crs=EPSG:4326&size=1&page=1&query=${encodeURIComponent(addr)}&type=address&category=road&format=json&key=${VWORLD_KEY}&callback=${cbName}`;
      s.onerror = () => finish(null);
      document.head.appendChild(s);
      setTimeout(() => finish(null), 7000);
    }

    // ── 건물 스냅 (클릭 좌표 → 가장 가까운 건물) ──────────────────
    // 클릭한 점이 빈터·도로·건물 경계면 지적(POINT 쿼리)은 이웃 필지를 줘서
    // 주소·PNU가 전부 어긋난다. 그래서 30m 반경 건물들 중 가장 가까운 건물 폴리곤으로
    // 스냅해 그 건물의 PNU·지번·속성을 쓴다. 폴리곤 정점과의 거리로 판정하므로
    // 클릭점이 건물 안(또는 인접)이면 거리 0에 가깝게 잡힌다. 30m 안 건물이 없으면 null.
    function nearestBuilding(lat, lng, cb) {
      vworldFeature('LT_C_BLDGINFO', lat, lng, (features) => {
        let best = null, bd = 30 / 1000;
        for (const f of features || []) {
          let d = 1e9;
          try {
            const g = f._geom || {};
            if (g.type === 'Point') {
              const [x, y] = g.coordinates;
              d = kmDist(lat, lng, y, x);
            } else {
              const rings = g.type === 'Polygon' ? g.coordinates
                : g.type === 'MultiPolygon' ? g.coordinates[0] : null;
              for (const ring of rings || []) {
                for (const [x, y] of ring) d = Math.min(d, kmDist(lat, lng, y, x));
              }
            }
          } catch (e) {}
          if (d < bd) { bd = d; best = f; }
        }
        cb(best ? { bld: best, dist: bd } : null);
      }, 30);
    }

    // 토지·건물 정보를 한 번에 모은다.
    //  LT_C_UQ111        용도지역   → 용적률·건폐율을 결정. 재개발 가치 판단의 출발점.
    //  LP_PA_CBND_BUBUN  지적       → 개별공시지가, 지번, 지목, PNU
    //  LT_C_BLDGINFO     건물       → 용도 계열, 층수, 연면적, 사용승인일

    // ── 국토교통부 건축HUB 건축물대장 (data.go.kr) ──────────────
    // serviceKey는 프론트에 두지 않는다 — Supabase Edge Function(molit-proxy)이
    // 서버에서 중계한다(supabase/functions/molit-proxy 참고). 일일 호출 한도가 있어
    // 키가 노출되면 남용으로 소진될 수 있기 때문.
    // 주의 1) 구버전 BldRgstService_v2 는 응답이 비어 있다. BldRgstHubService 를 써야 한다.
    // 주의 2) platGbCd 를 빠뜨리면 조회되지 않는다.
    const MOLIT_PROXY = 'https://bhgijvaxxjnocgfnaaeu.supabase.co/functions/v1/molit-proxy';
    // 헤더 날씨·금리·환율, CCTV 프록시 상수(KMA_PROXY/EXIM_PROXY/CCTV_PROXY)는
    // 위쪽 "헤더 정보" 섹션에서 이미 선언했다(그 자리에서 곧바로 호출하므로 TDZ상 여기보다 앞이어야 함).
    // PNU(19자리) = 시군구5 + 법정동5 + 산여부1 + 본번4 + 부번4
    // V-World 지적 레이어가 주는 PNU 를 그대로 건축물대장 파라미터로 분해할 수 있다.
    function pnuParts(pnu) {
      if (!pnu || String(pnu).length !== 19) return null;
      const s = String(pnu);
      return { sigunguCd: s.slice(0, 5), bjdongCd: s.slice(5, 10), platGbCd: s[10] === '2' ? '1' : '0', bun: s.slice(11, 15), ji: s.slice(15, 19) };
    }
    const _brCache = new Map();
    // data.go.kr 은 간헐적으로 500·404 를 뱉는다(실측: 같은 요청이 연속 200 이다가도 한 번씩 실패,
    // 몰아치면 몇 초간 전부 실패). 그래서 세 가지를 지킨다.
    //  1) 일시적 실패는 최대 3회(600ms·1.8s 간격) 재시도한다.
    //  2) 일시적 실패를 캐시하지 않는다. 캐시하면 그 필지는 영영 조회를 안 하게 된다.
    //     '정상 응답인데 기록이 없음'(빈 배열)만 캐시한다.
    //  3) 병렬로 한꺼번에 쏘지 않는다 — 동시 요청이 몰리면 상위 게이트웨이가 통째로 막는다(loadLedgerDetail).
    // 건축HUB 의 조회는 전부 같은 지번 파라미터(sigunguCd·bjdongCd·platGbCd·bun·ji)를
    // 쓰므로(명세 공통 입력) op 이름만 바꿔 하나의 함수로 호출한다.
    // 표제부는 대표 동 1건(건물대장), 상세 조회는 배열 전체를 돌려준다.
    function ledgerOp(op, pnu, cb, _attempt) {
      const p = pnuParts(pnu);
      if (!p) { cb(null); return; }
      const key = op + '|' + pnu;
      if (_brCache.has(key)) { cb(_brCache.get(key)); return; }
      const attempt = _attempt || 0;
      const fail = () => {
        const wait = [600, 1800, 0][attempt];
        if (wait) { setTimeout(() => ledgerOp(op, pnu, cb, attempt + 1), wait); return; }
        cb(null);  // 캐시하지 않는다 — 다음 클릭 때 다시 시도할 수 있도록
      };
      // 아파트 대단지는 세대가 수백~천 개라 1페이지만 받으면 세대 수·공시가격이 잘린다.
      // totalCount 를 보고 100행/페이지로 마저 받되, 남용 방지를 위해 최대 500행(5페이지)으로 막는다.
      // 페이지는 순차로만 이어받아(data.go.kr 이 동시 요청에 약함) 한 번 실패하면 전체 재시도.
      const MAX_ROWS = 500;
      const pageSize = op === 'getBrTitleInfo' ? 10 : 100;
      const page = (pno, acc) => {
        const q = `op=${op}&sigunguCd=${p.sigunguCd}&bjdongCd=${p.bjdongCd}`
          + `&platGbCd=${p.platGbCd}&bun=${p.bun}&ji=${p.ji}&numOfRows=${pageSize}&pageNo=${pno}`;
        fetch(`${MOLIT_PROXY}?${q}`)
          .then((r) => (r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status))))
          .then((j) => {
            const body = j.response.body;
            const items = body.items;
            const arr = (!items ? [] : Array.isArray(items.item) ? items.item : [items.item]).filter(Boolean);
            const acc2 = acc.concat(arr);
            const total = Number(body.totalCount) || 0;
            if (total > acc2.length && acc2.length < MAX_ROWS && arr.length === pageSize) {
              setTimeout(() => page(pno + 1, acc2), 150);
              return;
            }
            _brCache.set(key, acc2);
            cb(acc2);
          })
          .catch(fail);
      };
      page(1, []);
    }
    function buildingRegister(pnu, cb) {
      ledgerOp('getBrTitleInfo', pnu, (arr) => {
        // 한 필지에 동이 여러 개일 수 있다(아파트 단지). 연면적이 가장 큰 동을 대표로 삼는다.
        cb((arr || []).sort((a, b) => (Number(b.totArea) || 0) - (Number(a.totArea) || 0))[0] || null);
      });
    }
    // 서울시 도시계획조례 기준 용적률 상한. 지구단위계획·정비계획으로 달라질 수 있어 참고용이다.
    const FAR_LIMIT = {
      '제1종전용주거지역': 100, '제2종전용주거지역': 150,
      '제1종일반주거지역': 200, '제2종일반주거지역': 250, '제3종일반주거지역': 300,
      '준주거지역': 400, '근린상업지역': 600, '유통상업지역': 600,
      '일반상업지역': 800, '중심상업지역': 1000, '준공업지역': 400,
    };

    // ── 단독·다가구 동 단위 시세 ─────────────────────────────────
    // 국토부가 단독/다가구 실거래의 지번을 '1***' 로 마스킹해서(표본 428건 전부) 개별
    // 좌표를 찍을 수 없다. 그래서 마커가 아니라 동 단위 집계로만 제공한다.
    // 파일이 30KB 라 부담이 없어 처음 필요할 때 한 번 받는다.
    let houseStats = null, _housePromise = null;
    function loadHouse() {
      if (!_housePromise) {
        _housePromise = fetch('realprice_house.json').then((r) => r.json())
          .then((j) => { houseStats = j; return j; }).catch(() => null);
      }
      return _housePromise;
    }
    // V-World 지적의 addr('서울특별시 관악구 봉천동 459-8')에서 '관악구 봉천동' 을 뽑는다.
    // 집계 파일의 키가 이 형식이다.
    function guDongKey(addr) {
      const g = addrGuDong(addr);
      return g.gu && g.dong ? `${g.gu} ${g.dong}` : null;
    }
    function addrGuDong(addr) {
      const m = String(addr || '').match(/(\S+구)\s+(\S+?[동가])(?:\s|$)/);
      return m ? { gu: m[1], dong: m[2] } : { gu: '', dong: '' };
    }
    function houseStatHtml(st) {
      if (!st) return '';
      const rows = [`거래 <b>${st.cnt}건</b> · 중앙값 <b>${st.med}억</b>` + (st.max > st.min ? ` <span style="color:var(--c-muted);">(${st.min}~${st.max}억)</span>` : '')];
      const ar = [];
      if (st.plot) ar.push(`대지 ${st.plot}㎡`);
      if (st.area) ar.push(`연면적 ${st.area}㎡`);
      if (ar.length) rows.push(`<span style="color:var(--c-muted);">중앙값 ${ar.join(' · ')}</span>`);
      if (st.build) rows.push(`<span style="color:var(--c-muted);">건축년도 중앙값 ${st.build}년</span>`);
      return `<div style="margin-top:5px;padding-top:5px;border-top:1px dashed var(--c-border);">`
        + `<b>이 동 단독·다가구 시세</b> <span style="font-size:12px;color:var(--c-muted);">최근 12개월</span><br>${rows.join('<br>')}</div>`;
    }

    // Leaflet 의 popup.update() 는 저장된 _content 문자열로 innerHTML 을 다시 그린다.
    // 우리가 DOM 에 직접 꽂아 넣은 내용(토지·건물 정보, 상호 목록)이 그 순간 통째로 지워지고,
    // 붙잡아 둔 노드도 분리돼 이후 렌더가 화면에 영영 반영되지 않는다.
    // 팝업이 지도 밖으로 넘치면 '지도를 움직여' 팝업을 맞추는 대신, '팝업만 밀어 넣어' 맞춘다.
    // 과거엔 넘친 만큼 map.panBy([dx,dy], {animate:false}) 로 지도를 즉시 옮겨 팝업을 보여줬는데,
    // ① 클릭 직후 상세 정보가 차곡차곡 쌓이며 팝업이 자라날 때마다, ② 줌 후에도 지도가 훌쩍
    // 다른 지역으로 옮겨가 '클릭한 좌표가 다른 곳으로 이동 / 줌하면 다른 화면으로 이동'처럼
    // 보이는 원인이었다(사용자 제보). 참조 사이트(서울도시공간포털)는 지도를 절대 움직이지 않고
    // 클릭 정보를 고정 패널에 보여준다 — 여기도 지도는 고정, 팝업만 offset 으로 지도 안에
    // 끌어 들인다. 지도가 움직이지 않으므로 클릭·줌·드래그 내내 화면이 안정적으로 고정된다.
    const POPUP_PAD = 12;
    function clampPopup(p) {
      if (!p || !p.isOpen || !p.isOpen()) return;
      const map = p._map;
      if (!map || !p.getElement) return;
      const el = p.getElement();
      if (!el) return;
      const m = map.getContainer().getBoundingClientRect();
      const r = el.getBoundingClientRect();
      // 아래가 넘치면 양수, 위가 잘리면 음수. offset 은 화면 이동량과 같은 부호다(panBy 와 반대).
      let dx = 0, dy = 0;
      if (r.bottom > m.bottom - POPUP_PAD) dy = r.bottom - (m.bottom - POPUP_PAD);
      // 위쪽 판정을 나중에 둬서, 팝업이 지도보다 길 때는 상단이 보이도록 한다(내부 스크롤 가능).
      if (r.top - dy < m.top + POPUP_PAD) dy = r.top - (m.top + POPUP_PAD);
      if (r.right > m.right - POPUP_PAD) dx = r.right - (m.right - POPUP_PAD);
      if (r.left - dx < m.left + POPUP_PAD) dx = r.left - (m.left + POPUP_PAD);
      if (!dx && !dy) return;
      const off = L.point(p.options.offset || [0, 0]);
      p.options.offset = L.point(off.x - dx, off.y - dy);
      try { p._updatePosition(); } catch (e) {}
    }
    function repanPopup(p, precise) {
      if (!p || !p.isOpen || !p.isOpen()) return;
      const map = p._map;
      if (!map) return;
      if (!precise) {
        // 좌표 기준 느슨한 판정: 앵커가 지도 중앙 근처면 건드리지 않는다. 상세 조회가
        // 하나씩 쌓일 때마다 팝업이 어지럽게 움직이는 걸 막기 위한 완충(과거 회귀 3e02fdb).
        const ll = p.getLatLng ? p.getLatLng() : null;
        if (!ll || map.getBounds().pad(-0.03).contains(ll)) return;
      }
      clampPopup(p);
    }
    // Leaflet 내부의 _adjustPan 을 위 로직으로 통째로 교체한다.
    // 원본은 _autopanning 플래그로 "직전에 자동 패닝했으면 이번 호출은 건너뛰고 플래그만
    // 리셋"하는데, 팝업은 열릴 때 한 번 패닝되고( '정보 불러오는 중…' 상태라 짧음 ) 그 뒤
    // 내용이 비동기로 채워지며 커진다. 그때 update() 가 부르는 _adjustPan 이 플래그에
    // 삼켜져, 길어진 팝업의 위쪽이 지도 밖으로 잘린 채 남았다(실측 top -52px).
    // ResizeObserver 로 잡으려 했지만 --popup-max-h 에 걸리면 컨테이너 크기가 더 이상
    // 변하지 않아 콜백이 아예 오지 않는다(실측 0회). 그래서 호출 지점이 아니라
    // 함수 자체를 고친다 — 열 때·내용 갱신·줌 전부 같은 경로로 정확히 맞춰진다.
    if (L.Popup && L.Popup.prototype) {
      L.Popup.prototype._adjustPan = function () {
        if (!this.options.autoPan) return;
        clampPopup(this);
      };
    }

    const M2_PER_PY = 3.305785;
    // 토지·건물 정보 렌더. 건물 부분은 출처가 둘인데 겹치므로 하나만 쓴다.
    //  br  = 건축물대장 (정확한 주용도·용적률·건폐율) — 있으면 이것만 쓴다
    //  bld = V-World LT_C_BLDGINFO (용도 '계열'까지만) — 대장에 기록이 없을 때만 폴백
    // 둘 다 그리면 '단독주택 계열'과 '주용도 단독주택'이 나란히 나와 중복이다.
    function landInfoHtml(st, noDetail) {
      if (!st) return '';
      const rows = [];
      let badge = '';

      // 용도지역 — 투자 판단에서 가장 먼저 보는 항목
      if (st.zone) rows.push(`<b style="color:var(--c-primary);">${esc(st.zone)}</b>`);

      // 개별공시지가 + 평당 환산
      const pc = st.parcel;
      if (pc) {
        const jg = Number(pc.jiga) || 0;
        if (jg > 0) {
          const when = pc.gosi_year ? `${esc(pc.gosi_year)}.${esc(pc.gosi_month || '')}` : '';
          rows.push(`공시지가 <b>${jg.toLocaleString()}원/㎡</b> <span style="color:var(--c-muted);">(평당 ${Math.round(jg * M2_PER_PY).toLocaleString()}원${when ? ' · ' + when + ' 기준' : ''})</span>`);
        }
        if (pc.jibun) rows.push(`지번 ${esc(pc.jibun)}`);
      }

      const oldTag = (yr) => (yr && parseInt(yr) <= 1994)
        ? '<span style="background:#e03131;color:#fff;font-size:12px;padding:1px 6px;border-radius:999px;margin-left:5px;">30년↑</span>' : '';
      const ageDot = (yr) => yr ? `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${ageColor(yr)};margin-right:5px;"></span>` : '';

      if (st.br) {
        // ── 건축물대장 (우선) ──
        const it = st.br;
        const yr = /^\d{8}$/.test(it.useAprDay || '') ? String(it.useAprDay).slice(0, 4) : '';
        badge = oldTag(yr);
        const fam = Number(it.fmlyCnt) || Number(it.hhldCnt) || 0;
        const purps = it.mainPurpsCdNm || it.etcPurps || '';
        if (purps) rows.push(ageDot(yr) + `주용도 <b style="color:var(--c-primary);">${esc(purps)}</b>` + (fam ? ` · ${fam}세대` : ''));
        if (it.bldNm) rows.push(`<span style="color:var(--c-muted);">${esc(it.bldNm)}</span>`);
        const vl = Number(it.vlRat) || 0, bc = Number(it.bcRat) || 0;
        if (vl || bc) {
          let s = (vl ? `용적률 <b>${vl}%</b>` : '') + (bc ? `${vl ? ' · ' : ''}건폐율 ${bc}%` : '');
          const lim = FAR_LIMIT[st.zone];
          if (lim && vl) {
            // 상한 대비 낮을수록 증축·재건축 여력이 있다는 뜻. 판단은 사용자 몫이라 수치만 보여준다.
            const pct = Math.round(vl / lim * 100);
            const col = pct < 70 ? 'var(--c-success)' : pct < 95 ? 'var(--c-price)' : 'var(--c-muted)';
            s += `<br><span style="color:${col};font-size:12px;">조례 상한 ${lim}% 대비 <b>${pct}%</b></span>`;
          }
          rows.push(s);
        }
        const ar = [];
        if (Number(it.platArea)) ar.push(`대지 ${Number(it.platArea).toLocaleString()}㎡`);
        if (Number(it.archArea)) ar.push(`건축 ${Number(it.archArea).toLocaleString()}㎡`);
        if (Number(it.totArea)) ar.push(`연면적 ${Number(it.totArea).toLocaleString()}㎡`);
        if (ar.length) rows.push(ar.join(' · '));
        const stx = [];
        if (it.strctCdNm) stx.push(esc(it.strctCdNm));
        if (Number(it.grndFlrCnt)) stx.push(`지상 ${it.grndFlrCnt}층` + (Number(it.ugrndFlrCnt) ? `·지하 ${it.ugrndFlrCnt}층` : ''));
        if (stx.length) rows.push(stx.join(' · '));
        if (yr) rows.push(`${yr}.${String(it.useAprDay).slice(4, 6)} 사용승인`);
        if (String(it.rserthqkDsgnApplyYn) === '1') {
          rows.push(`<span style="color:var(--c-success);">✓ 내진설계 적용</span>${it.rserthqkAblty ? ' <span style="color:var(--c-muted);font-size:12px;">' + esc(it.rserthqkAblty) + '</span>' : ''}`);
        }
      } else if (st.bld) {
        // ── V-World 폴백 (대장에 기록이 없는 건물) ──
        const b = st.bld;
        const yr = /^\d{8}$/.test(b.useapr_day || '') ? b.useapr_day.slice(0, 4) : '';
        badge = oldTag(yr);
        const use = BLD_USE[b.usability] || (b.usability ? '용도코드 ' + esc(b.usability) : '');
        if (use) rows.push(ageDot(yr) + use);
        const line = [
          b.grnd_flr && b.grnd_flr !== '0' ? `지상 ${esc(b.grnd_flr)}층` + (b.ugrnd_flr && b.ugrnd_flr !== '0' ? `·지하 ${esc(b.ugrnd_flr)}층` : '') : '',
          b.totalarea && b.totalarea !== '0' ? `연면적 ${Number(b.totalarea).toLocaleString()}㎡` : '',
        ].filter(Boolean).join(' · ');
        if (line) rows.push(line);
        if (yr) rows.push(`${yr}.${b.useapr_day.slice(4, 6)} 사용승인`);
      }

      const houseHtml = houseStatHtml(st.house);
      let detailHtml = '';
      if (st.br && !noDetail) {
        // 상세 조회는 클릭 때만 부른다(일일 호출 한도 절약). 결과가 캐시되면 다시 열 때 즉시 나온다.
        detailHtml = st.detail
          ? ledgerDetailHtml(st)
          : `<button type="button" class="ld-more" style="margin-top:5px;font-size:12px;color:var(--c-primary);background:none;border:1px solid var(--c-border);border-radius:6px;padding:3px 10px;cursor:pointer;">건축물대장 상세 보기</button>`;
      }
      if (!rows.length && !houseHtml && !detailHtml) return '';
      return `<div style="font-size:13px;margin-top:6px;border-top:1px solid var(--c-border);padding-top:5px;">`
        + (rows.length ? `<b>토지·건물 정보</b>${badge}<br>${rows.join('<br>')}` : '')
        + houseHtml + detailHtml + '</div>';
    }

    // ── 건축물대장 상세 (투자자용 추가 조회) ─────────────────────
    // 표제부만으론 부족한 항목을 '상세 보기' 클릭 한 번에 모아 보여준다.
    // 오수정화시설(getBrWclfInfo)은 투자 판단과 무관해 제외했다.
    const LEDGER_DETAIL_OPS = [
      ['recap', 'getBrRecapTitleInfo'],         // 총괄표제부 — 단지 전체 세대·주차·주/부속건물
      ['basis', 'getBrBasisOulnInfo'],          // 기본개요 — 건물명·대장종류
      ['floors', 'getBrFlrOulnInfo'],           // 층별개요 — 층별 주용도·면적
      ['atch', 'getBrAtchJibunInfo'],           // 부속지번 — 통합/합병된 필지
      ['exposPub', 'getBrExposPubuseAreaInfo'], // 전유공용면적 — 전용/공용면적 구분
      ['housePrice', 'getBrHsprcInfo'],        // 주택가격 — 공시가격. op명은 getBrHousePriceInfo가 아님(실측 확인)
      ['jijigu', 'getBrJijiguInfo'],            // 지역지구구역 — 정비구역 등 포함
      // 전유부(getBrExposInfo)는 목록을 상시 받아도 전유공용면적이 있으면 쓰이지 않는다.
      // 그래서 상시 호출에서 제외하고, 전유공용면적이 비어 있을 때만 보충 조회한다.
    ];
    function loadLedgerDetail(st, render) {
      if (!st || st.detail || st._ldBusy) return;
      const pnu = st.addrPnu || (st.bld && st.bld.pnu) || (st.parcel && st.parcel.pnu);
      if (!pnu) return;
      // '일반'(단독·다세대 단독대장)은 전유/공용면적 개념이 없다. 집합건축물일 때만 조회.
      const isComplex = !st.br || st.br.regstrGbCdNm !== '일반';
      const ops = isComplex ? LEDGER_DETAIL_OPS : LEDGER_DETAIL_OPS.filter(([k]) => k !== 'exposPub');
      st._ldBusy = true;
      st.detail = { loading: true };
      render();
      let left = ops.length;
      const finish = () => {
        st.detail.loading = false;
        st._ldBusy = false;
        render();
      };
      const done = () => {
        if (--left > 0) return;
        if (isComplex && !(st.detail.exposPub || []).some((x) => String(x.exposPubuseGbCd) === '1')) {
          // 전유공용면적이 비면 전유부로 동·호 목록을 보충한다. 이때만 1회 더 호출.
          ledgerOp('getBrExposInfo', pnu, (arr) => {
            st.detail.expos = arr || [];
            if (arr === null) st.detail.fail = (st.detail.fail || 0) + 1;
            finish();
          });
          return;
        }
        finish();
      };
      // data.go.kr 은 동시 요청이 몰리면 통째로 막힌다(실측). 8개를 한꺼번에 쏘지 말고
      // 동시 2개씩, 완료마다 150ms 간격으로 흘려보내 실패율을 낮춘다.
      let idx = 0, active = 0;
      const pump = () => {
        while (active < 2 && idx < ops.length) {
          const [k, op] = ops[idx++];
          active++;
          ledgerOp(op, pnu, (arr) => {
            active--;
            st.detail[k] = arr || [];
            if (arr === null) st.detail.fail = (st.detail.fail || 0) + 1;

            if (active < 2 && idx < ops.length) setTimeout(pump, 150);
          });
        }
      };
      pump();
    }
    function ledgerDetailHtml(st) {
      const d = st.detail;
      if (!d) return '';
      if (d.loading) {
        return `<div style="margin-top:5px;padding-top:5px;border-top:1px dashed var(--c-border);font-size:12px;color:var(--c-muted);">건축물대장 상세 조회 중…</div>`;
      }
      const rows = [];
      const basis = (d.basis || [])[0];
      if (basis && basis.bldNm) {
        rows.push(`건물명 <b>${esc(basis.bldNm)}</b> <span style="color:var(--c-muted);font-size:12px;">${esc(basis.regstrGbCdNm || '')}</span>`);
      }
      const recap = (d.recap || [])[0];
      if (recap) {
        const parts = [];
        if (Number(recap.hhldCnt)) parts.push(`세대 <b>${Number(recap.hhldCnt).toLocaleString()}</b>`);
        if (Number(recap.totPkngCnt)) parts.push(`주차 <b>${Number(recap.totPkngCnt).toLocaleString()}대</b>`);
        if (Number(recap.mainBldCnt)) parts.push(`주건축물 ${recap.mainBldCnt}동`);
        if (Number(recap.atchBldCnt)) parts.push(`부속 ${recap.atchBldCnt}동`);
        if (Number(recap.archArea)) parts.push(`건축면적 ${Number(recap.archArea).toLocaleString()}㎡`);
        if (parts.length) rows.push(`<b>총괄표제부</b> ${parts.join(' · ')}`);
      }
      const jijigu = (d.jijigu || []).filter((x) => x.jijiguCdNm);
      if (jijigu.length) {
        const seen = new Set();
        const arr = [];
        for (const x of jijigu) {
          if (seen.has(x.jijiguCdNm)) continue;
          seen.add(x.jijiguCdNm);
          const gb = x.jijiguGbCdNm || ({ 1: '용도지역', 2: '용도지구', 3: '용도구역' }[x.jijiguGbCd] || '');
          arr.push(`<span style="color:var(--c-muted);font-size:12px;">${esc(gb)}</span> ${esc(x.jijiguCdNm)}`);
        }
        rows.push(`<b>지역·지구·구역</b> ${arr.join(' · ')}`);
      }
      const floors = (d.floors || []).filter((x) => x.flrNoNm || x.flrNo);
      if (floors.length) {
        const dongSet = new Set(floors.map((x) => x.dongNm).filter(Boolean));
        const uni = [];
        const seen = new Set();
        for (const f of floors) {
          const label = f.flrNoNm || (f.flrNo + '층');
          if (seen.has(label)) continue;
          seen.add(label);
          uni.push([label, f.mainPurpsCdNm, f.area].filter(Boolean).join(' '));
        }
        const dong = dongSet.size > 1 ? ` <span style="color:var(--c-muted);font-size:12px;">동 ${dongSet.size}개</span>` : '';
        rows.push(`<b>층별개요</b>${dong} ${uni.slice(0, 6).join(' · ')}${uni.length > 6 ? ` 외 ${uni.length - 6}개 층` : ''}`);
      }
      const atch = (d.atch || []).filter((x) => x.atchBun != null);
      if (atch.length) {
        const shown = atch.slice(0, 3).map((x) => `${x.atchBun}${Number(x.atchJi) ? '-' + x.atchJi : ''}`).join(', ');
        rows.push(`<b>부속지번</b> ${atch.length}필지${shown ? ' · ' + esc(shown) + ' 외' : ''}`);
      }
      // ── 호실별 전용·공용면적 (전유공용면적 = 집합건축물의 개별 세대 정보) ──
      // exposPubuseGbCd 1=전유(전용) 2=공용. 같은 동·호의 전용+공용 = 공급면적.
      // 방 갯수는 건축물대장 어디에도 없어 공급 데이터로는 제공할 수 없다.
      const expAll = (d.exposPub || []).filter((x) => x.dongNm || x.hoNm);
      if (expAll.length) {
        const units = new Map();
        for (const x of expAll) {
          const key = (x.dongNm || '') + '|' + (x.hoNm || '');
          if (key === '|') continue;
          const u = units.get(key) || {
            ho: ((x.dongNm && x.dongNm.trim() && x.dongNm !== '1') ? x.dongNm + '-' : '') + (x.hoNm || ''),
            flr: Number(x.flrNo) || 0, jeon: 0, gong: 0,
            purps: x.mainPurpsCdNm || '', strct: x.strctCdNm || '',
          };
          const a = Number(x.area) || 0;
          if (String(x.exposPubuseGbCd) === '1') u.jeon += a;
          else if (String(x.exposPubuseGbCd) === '2') u.gong += a;
          if (x.mainPurpsCdNm) u.purps = x.mainPurpsCdNm;
          if (x.strctCdNm) u.strct = x.strctCdNm;
          units.set(key, u);
        }
        const arr = [...units.values()].filter((u) => u.jeon > 0 || u.gong > 0)
          .sort((a, b) => (a.flr - b.flr) || (a.ho > b.ho ? 1 : -1));
        if (arr.length) {
          const dongSet = new Set(expAll.map((x) => x.dongNm).filter((v) => v && v.trim() && v !== '1'));
          const MAX = 24;
          // 행 클릭 → 해당 호 상세(층·전용/공용/공급·주용도·구조)가 아래로 펼쳐진다. 호 하나로
          // 들어가는 모달 대신 팝업 안에서 같은 자리에 펼침 — 새 데이터 없이 UX만 정리했다.
          const list = arr.slice(0, MAX).map((u, i) => {
            const total = u.jeon + u.gong;
            const detail = [
              `층 <b>${u.flr || '?'}</b>`,
              `전용 <b>${u.jeon.toFixed(1)}㎡</b>`,
              u.gong ? `공용 <b>${u.gong.toFixed(1)}㎡</b>` : '',
              total ? `공급 <b>${total.toFixed(1)}㎡</b>` : '',
              u.purps ? `주용도 <b>${esc(u.purps)}</b>` : '',
              u.strct ? `구조 <b>${esc(u.strct)}</b>` : '',
            ].filter(Boolean).join(' · ');
            return `<button type="button" class="unit-row" data-i="${i}">`
              + `<span>${esc(u.ho)} <b>전용 ${u.jeon.toFixed(1)}㎡</b>${u.gong ? ` · 공급 <b>${total.toFixed(1)}㎡</b>` : ''}</span>`
              + `<span class="ur-chev">▸</span></button>`
              + `<div class="unit-detail" id="ud-${i}">${detail}</div>`;
          }).join('');
          rows.push(`<b>호실별 면적</b> <span style="color:var(--c-muted);font-size:12px;">${arr.length}세대${dongSet.size ? ` · ${dongSet.size}개동` : ''} · 전용+공용=공급 · 호실 클릭</span>${list}${arr.length > MAX ? `<br><span style="color:var(--c-muted);font-size:12px;">외 ${arr.length - MAX}세대</span>` : ''}`);
        }
      }
      if (!expAll.length) {
        const exx = (d.expos || []).filter((x) => x.dongNm || x.hoNm);
        if (exx.length) {
          const names = exx.slice(0, 12).map((x) => `${x.dongNm && x.dongNm.trim() && x.dongNm !== '1' ? x.dongNm + '-' : ''}${x.hoNm || ''}`).filter(Boolean).join(', ');
          rows.push(`<b>전유부</b> ${exx.length}호${names ? ' · ' + esc(names) + (exx.length > 12 ? ' 외' : '') : ''}`);
        }
      }
      const hp = (d.housePrice || []).filter((x) => Number(x.hsprc));
      if (hp.length) {
        const vs = hp.map((x) => Number(x.hsprc));
        const min = Math.min(...vs), max = Math.max(...vs);
        const day = (hp.map((x) => String(x.stdDay || '')).filter((s) => /^\d{8}$/.test(s))[0] || '')
          .replace(/^(\d{4})(\d{2})(\d{2})$/, '$1.$2.$3');
        rows.push(`<b>공시가격</b> ${(min / 1e8).toFixed(min >= 1e9 ? 1 : 2)}~${(max / 1e8).toFixed(max >= 1e9 ? 1 : 2)}억 <span style="color:var(--c-muted);font-size:12px;">${day ? day + ' 기준 · ' : ''}세대별 ${hp.length}건</span>`);
      }
      if (!rows.length) {
        const msg = d.fail
          ? `<div style="font-size:12px;color:var(--c-price);">상세 조회를 불러오지 못했어요</div>`
          : `<div style="font-size:12px;color:var(--c-muted);">상세 조회 결과가 없어요</div>`;
        return `<div style="margin-top:5px;padding-top:5px;border-top:1px dashed var(--c-border);">`
          + msg + retryHtml(d) + '</div>';
      }
      return `<div style="margin-top:5px;padding-top:5px;border-top:1px dashed var(--c-border);">`
        + `<div style="font-size:12px;color:var(--c-muted);margin-bottom:2px;">건축물대장 상세 <span style="font-size:12px;">국토교통부 건축HUB</span></div>`
        + rows.join('<br>') + retryHtml(d) + '</div>';
    }
    function retryHtml(d) {
      if (!d || !d.fail) return '';
      return `<div style="margin-top:5px;"><span style="color:var(--c-price);font-size:12px;">${d.fail}개 항목을 불러오지 못했어요</span>`
        + ` <button type="button" class="ld-retry" style="font-size:12px;color:var(--c-primary);background:none;border:1px solid var(--c-border);border-radius:6px;padding:2px 9px;cursor:pointer;">다시 시도</button></div>`;
    }

    // 팝업의 토지·건물 정보를 채운다.
    //  1) 지번 주소가 있으면 V-World 주소 검색으로 정확한 PNU를 먼저 확보 (address-based PNU)
    //  2) 용도지역 + 지적을 받아 즉시 그린다 (공시지가·지번은 이 둘로 끝난다)
    //  3) 건물 스냅으로 용도·층수를 받는다
    //  4) PNU 우선순위: 주소 검색 PNU → 건물 PNU → 필지 PNU
    function fillLandInfo(popupEl, getPopup, lat, lng, onInfo, noDetail, jibun) {
      const slot = popupEl && popupEl.querySelector('.bld-info');
      if (!slot) return;
      const st = { zone: '', parcel: null, br: null, bld: null, house: null, detail: null, addrPnu: null };
      let _firstRender = true;
      const render = () => {
        slot.innerHTML = landInfoHtml(st, noDetail);
        // 팝업 안 버튼은 반드시 전파를 끊어야 한다.
        // 안 끊으면 클릭이 지도까지 올라가 map click 이 한 번 더 발생하고,
        // 버튼이 놓인 화면 지점의 좌표로 새 팝업이 열려 다른 필지로 갈아탄다.
        // (실측: 숭인동2길 29-10 -> 41, 지도 81m 이동)
        // 상위에서 걸러내려 했지만, 그 시점엔 이미 팝업 내용이 교체돼 버튼 노드가 DOM 에서
        // 분리된 뒤라 closest('.leaflet-popup') 가 null 을 반환해 통과됐다. 발생 지점에서 끊는다.
        const stop = (ev) => { if (ev) { ev.preventDefault(); ev.stopPropagation(); } };
        const btn = slot.querySelector('.ld-more');
        if (btn) btn.onclick = (ev) => { stop(ev); loadLedgerDetail(st, render); };
        const rb = slot.querySelector('.ld-retry');
        if (rb) rb.onclick = (ev) => {
          stop(ev);
          st.detail = null;
          st._ldBusy = false;
          loadLedgerDetail(st, render);
        };
        slot.querySelectorAll('.unit-row').forEach((row) => {
          row.onclick = (ev) => {
            stop(ev);   // 호실 아코디언 클릭도 지도로 새면 안 된다
            const d = slot.querySelector('#ud-' + row.dataset.i);
            if (!d) return;
            const opening = d.style.display === 'none';
            slot.querySelectorAll('.unit-detail').forEach((x) => { x.style.display = 'none'; });
            slot.querySelectorAll('.unit-row').forEach((r) => r.classList.remove('open'));
            if (opening) { d.style.display = 'block'; row.classList.add('open'); }
          };
        });
        if (onInfo) onInfo(st);
        // 이 렌더는 팝업 DOM 에 직접 꽂아 넣는 경로라 Leaflet 의 update() 를 타지 않는다
        // → update() 가 부르는 _adjustPan 도 안 불린다. 그래서 여기서 직접 맞춰 준다.
        // 예전엔 최초 렌더에서만(그것도 좌표 기준 느슨한 판정으로) 불러서, 상세가 쌓여
        // 팝업이 길어지면 위쪽이 지도 밖으로 잘린 채 남았다(실측 top -52px).
        // 지금은 매 렌더마다 부르지만 '실제로 잘렸을 때만 최소 거리로' 움직이므로,
        // 상세가 쌓일 때 지도가 훌쩍 밀리던 과거 회귀(3e02fdb)는 생기지 않는다.
        _firstRender = false;
        repanPopup(getPopup(), true);
      };
      let left = jibun ? 4 : 3;
      const afterBase = () => {
        if (--left > 0) return;
        render();
        // 이 동의 단독·다가구 시세 (지번 마스킹 때문에 개별 마커가 불가능한 대신 제공)
        const key = guDongKey(st.parcel && st.parcel.addr);
        if (key) {
          loadHouse().then(() => {
            if (houseStats && houseStats[key]) { st.house = houseStats[key]; render(); }
          });
        }
        // PNU 우선순위: 주소 검색 PNU → 건물 PNU → 필지 PNU
        // 주소 기반 PNU가 가장 정확하고, POINT 쿼리의 경계 오류를 방지한다.
        const pnu = st.addrPnu || (st.bld && st.bld.pnu) || (st.parcel && st.parcel.pnu);
        if (!pnu) return;
        buildingRegister(pnu, (it) => {
          if (it) { st.br = it; render(); }
        });
      };
      // 지번 주소가 있으면 V-World 주소 검색으로 PNU를 먼저 확보
      if (jibun) {
        vworldAddrToPnu(jibun, (result) => {
          if (result) st.addrPnu = result.pnu;
          afterBase();
        });
      }
      vworldFeature('LT_C_UQ111', lat, lng, (ps) => {
        st.zone = ((ps || []).find((x) => x.uname) || {}).uname || '';
        afterBase();
      });
      vworldFeature('LP_PA_CBND_BUBUN', lat, lng, (ps) => {
        st.parcel = (ps || [])[0] || null;
        afterBase();
      });
      // 30m 안에서 가장 가까운 건물로 스냅 → st.bld (용도·층수 폴백)
      nearestBuilding(lat, lng, (hit) => {
        st.bld = hit ? hit.bld : null;
        afterBase();
      });
    }

    // ── 이 지점의 상호(POI) ──────────────────────────────────────
    // '뜰안애' 같은 가게 이름은 건물명이 아니라 장소(POI) 데이터다.
    // 역지오코딩은 건축물대장상 건물명까지만 주므로 상호는 원리상 나올 수 없다.
    // 그래서 카카오 장소 검색(인근 공인중개사 찾기에 쓰는 것과 같은 API)으로 좌표 주변을 훑는다.
    // 카카오는 카테고리 단위로만 주변 조회가 되어 카테고리 수만큼 호출해야 한다.
    // → 지도 클릭마다 8회씩 부르면 낭비라, 팝업의 버튼을 눌렀을 때만 실행한다.
    const POI_CATS = [
      ['FD6', '음식점'], ['CE7', '카페'], ['HP8', '병원'], ['PM9', '약국'],
      ['CS2', '편의점'], ['BK9', '은행'], ['AC5', '학원'], ['AG2', '중개업소'],
    ];
    function findPois(lat, lng, radius, cb) {
      if (!(window.kakao && kakao.maps && kakao.maps.services)) { cb(null); return; }
      const svc = new kakao.maps.services.Places();
      const loc = new kakao.maps.LatLng(lat, lng);
      const found = [];
      let left = POI_CATS.length;
      const done = () => {
        if (--left > 0) return;
        const seen = new Set();
        const uniq = [];
        for (const p of found.sort((a, b) => a.dist - b.dist)) {
          if (seen.has(p.id)) continue;
          seen.add(p.id);
          uniq.push(p);
        }
        cb(uniq.slice(0, 5));
      };
      POI_CATS.forEach(([code, label]) => {
        svc.categorySearch(code, (data, status) => {
          try {
            if (status === kakao.maps.services.Status.OK) {
              for (const p of data) {
                const d = Number(p.distance);
                if (d <= radius) found.push({ id: p.id, name: p.place_name, label, dist: d });
              }
            }
          } catch (e) {}
          done();
        }, { location: loc, radius, sort: kakao.maps.services.SortBy.DISTANCE });
      });
    }

    // 좌표를 함께 넘겨 네이버 지도가 그 지점으로 이동하게 한다 (동명이 단지 오검색 방지)
    const naverSearchUrl = (q, lat, lng) => `https://map.naver.com/p/search/${encodeURIComponent(q)}?c=${lng},${lat},17,0,0,0,dh`;
    // 팝업이 열린 뒤 제목·네이버 링크를 실제 건물명으로 교체.
    // 원본명과 서로 포함 관계일 때만 반영한다 (엉뚱한 인접 건물명으로 바뀌는 것을 막기 위함).
    // 카카오 장소 DB 에서 단지 통칭을 찾는다.
    // 공적 장부에는 '1단지' 같은 구분이 없다 — 실측으로 확인했다:
    //   동대문구 답십리동 990 → 건축물대장 표제부 13개 동 전부 bldNm "두산아파트",
    //   총괄표제부도 "두산아파트", 네이버 역지오코딩도 "두산아파트".
    //   같은 지번을 카카오 장소 DB 로 보면 "두산1단지아파트"(1m)와 "두산2단지아파트"(66m)로 나뉜다.
    //   국토부 실거래가는 둘 다 "두산"으로 축약해 내려주므로, 통칭이 있어야 구분된다.
    // 카테고리 필터가 핵심이다. 이름·거리만 보면 부속 시설이 이긴다:
    //   "삼성" → "종로 평창삼성 전기차충전소"(7m) 가 "삼성아파트"(8m) 보다 가깝다.
    // 그래서 '주거시설 > 아파트' 분류만 채택한다. 실측: 20건 중 18건 보정, 오염 0건.
    const _kakaoNameCache = new Map();
    function kakaoAptName(lat, lng, rawName, cb) {
      const key = _gcKey(lat, lng) + '|' + rawName;
      if (_kakaoNameCache.has(key)) { cb(_kakaoNameCache.get(key)); return; }
      if (!rawName || !(window.kakao && kakao.maps && kakao.maps.services)) { cb(null); return; }
      let settled = false;
      const finish = (v) => { if (settled) return; settled = true; _kakaoNameCache.set(key, v); cb(v); };
      try {
        new kakao.maps.services.Places().keywordSearch(rawName, (data, status) => {
          if (status !== kakao.maps.services.Status.OK) { finish(null); return; }
          const hit = (data || [])
            .filter((x) => /주거시설\s*>\s*아파트/.test(x.category_name || ''))
            .filter((x) => Number(x.distance) <= 50 && String(x.place_name).includes(rawName))
            .sort((a, b) => Number(a.distance) - Number(b.distance))[0];
          finish(hit ? hit.place_name : null);
        }, { location: new kakao.maps.LatLng(lat, lng), radius: 100, sort: kakao.maps.services.SortBy.DISTANCE });
      } catch (e) { finish(null); }
      setTimeout(() => finish(null), 6000);
    }

    // 팝업 제목과 네이버 링크를 실제 단지명으로 교체한다.
    // 카카오(통칭, '1단지'까지 구분) 를 먼저 쓰고, 없으면 네이버 역지오코딩(공부상 건물명)으로 물러선다.
    // 둘 다 실패하면 원본명을 그대로 둔다 — 틀린 이름으로 바꾸지 않는다.
    function enrichAptName(el, rawName, area, lat, lng) {
      if (!el) return;
      const apply = (full) => {
        if (!full || full === rawName) return false;
        const nameEl = el.querySelector('.rp-name');
        if (nameEl) nameEl.textContent = full;
        const a = el.querySelector('.rp-naver');
        if (a) a.href = naverSearchUrl(full + ' ' + (area || ''), lat, lng);
        return true;
      };
      kakaoAptName(lat, lng, rawName, (place) => {
        if (apply(place)) return;
        naverBldName(lat, lng, (bld) => {
          if (!bld || bld === rawName) return;
          // 원본명과 서로 포함 관계일 때만 반영해 인접 건물 오적용을 막는다
          if (!(bld.includes(rawName) || rawName.includes(bld))) return;
          apply(bld.length >= rawName.length ? bld : rawName);
        });
      });
    }

    // ── 호버 툴팁 (건물 위에 커서를 정지하면 주소·토지·건물 정보) ─────────
    // 네이버지도처럼 동작하되 API 호출은 전부 무료(V-World + 건축물대장)다. 할당량을

    async function drawRoute() {

        } else {

    // ── 공통 이스케이프 ──

    // 외부 URL은 http/https만 허용(javascript:·data: 스킴 차단)

    let landMode = 'agents';   // 'agents'(인근 공인중개사) | 'favorites'(부동산 즐겨찾기)

    // ── 부동산 · 정비구역 비교 ──
